name: G2 IMOEX verified complete source observed H1 M15 research V2
on:
  push:
    branches: [chatgpt/imoex-interval-recovery-source-fidelity-20261013]
    paths:
      - .github/workflows/g2-imoex-final-authentic-source-archive.yml
permissions:
  contents: read
  actions: read
jobs:
  verify-enrich-and-seal:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Verify all offline source fidelity and read adapter safety tests
        run: python -m pytest -q tests/test_g2_imoex_source_interval_recovery.py tests/test_g2_imoex_enrich_research_archive.py tests/test_research_intraday_source_compat.py
      - name: Fetch 22 immutable monthly source recovery proofs and original V1 DuckDB
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          mkdir -p research/IMOEX /tmp/imoex_source_recovery
          gh run download 38445782909 --repo "$GITHUB_REPOSITORY" --name imoex-2025-2026-10-12-consolidated-h1-m15 --dir research/IMOEX
          gh run download 38454854250 --repo "$GITHUB_REPOSITORY" --pattern "imoex-source-exceptions-*" --dir /tmp/imoex_source_recovery
      - name: Reconcile all 457 dates against exactly 22 SHA verified source reports and make isolated V2 DB
        run: |
          python -m scripts.g2_imoex_enrich_research_archive \
            --original research/IMOEX/birzha_intraday_research_2025_2026.duckdb \
            --recovery-root /tmp/imoex_source_recovery \
            --target research/IMOEX/birzha_intraday_research_2025_2026_source_compatible.duckdb \
            --report research/IMOEX/IMOEX_2025-2026_ACTUAL_SOURCE_INTERVALS_V2.json
      - name: Verify full exact source counts and two selectable read modes
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          from birzha.domain.market import Instrument
          from birzha.application.research_intraday_source_compat import IMOEXResearchPriceView
          f=Path('research/IMOEX/IMOEX_2025-2026_ACTUAL_SOURCE_INTERVALS_V2.json')
          r=json.loads(f.read_text())
          assert r['source_dates']==457
          assert r['source_native_noncanonical_h1']==541
          assert r['source_partial_m15_1_to_14_minutes']==1296
          assert r['total_observed_h1']==4740
          assert r['total_observed_m15']==17369
          assert r['unresolved_excluded_from_original']==0
          assert r['original_canonical_untouched'] is True
          assert r['minutes_M1_persisted'] is False
          i=Instrument(symbol='IMOEX',secid='IMOEX',board='SNDX',engine='stock',market='index',asset_class='index')
          view=IMOEXResearchPriceView(Path('research/IMOEX/birzha_intraday_research_2025_2026_source_compatible.duckdb'))
          try:
              assert view.quality_counts()['M15']['SOURCE_M15_WITH_FEWER_THAN_15_M1']==1296
              assert view.quality_counts()['H1']['NATIVE_H1_SHORT_OBSERVED']==541
              for tf,strict_n,source_n in (('H1',9,10),('M15',34,37)):
                  strict=view.read_exact(i,timeframe=tf,from_date='2025-06-09',till_date='2025-06-09')
                  live=view.read_exact(i,timeframe=tf,from_date='2025-06-09',till_date='2025-06-09',source_compatible=True)
                  assert strict.count==strict_n and live.count==source_n
          finally:
              view.close()
          print('VERIFIED_ALL_457_SOURCE_DAYS_NO_SYNTHETIC_CANDLES',r['total_observed_h1'],r['total_observed_m15'])
          PY
      - name: Seal independent new DuckDB and audit proof with SHA256
        run: |
          cd research/IMOEX
          sha256sum birzha_intraday_research_2025_2026_source_compatible.duckdb \
            IMOEX_2025-2026_ACTUAL_SOURCE_INTERVALS_V2.json \
            > IMOEX_2025-2026_SOURCE_COMPAT_V2_SHA256SUMS.txt
          du -h birzha_intraday_research_2025_2026_source_compatible.duckdb
      - name: Save final revised research database without overwriting original
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imoex-all-observed-source-h1-m15-2025-2026-v2
          path: |
            research/IMOEX/birzha_intraday_research_2025_2026_source_compatible.duckdb
            research/IMOEX/IMOEX_2025-2026_ACTUAL_SOURCE_INTERVALS_V2.json
            research/IMOEX/IMOEX_2025-2026_SOURCE_COMPAT_V2_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
