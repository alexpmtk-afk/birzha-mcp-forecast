name: M23 BRJ0 Corrected Source Regression Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m23-brj0-code-regression-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact corrected M23 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e88a4a7f69a83212b6de265a7f58a2d4d4bc327c
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install corrected source
        run: python -m pip install -e .

      - name: Reproduce original BRJ0 condition against real MOEX
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import date

          from birzha.domain.market import Instrument
          from birzha.providers.moex_calendar import MoexTradingCalendar
          from birzha.providers.moex_iss import MoexIssClient

          client = MoexIssClient()
          calendar = MoexTradingCalendar(client)
          days = calendar.dates(
              engine="futures",
              market="forts",
              board="RFUD",
              security="BRJ0",
              from_date=date(2019, 6, 24),
              till_date=date(2019, 6, 28),
          )
          print("BRJ0_CORRECTED_PRICE_DATES=" + ",".join(day.isoformat() for day in days))
          assert date(2019, 6, 25) not in days
          assert date(2019, 6, 27) in days
          assert date(2019, 6, 28) in days

          instrument = Instrument(
              symbol="BR",
              secid="BRJ0",
              board="RFUD",
              engine="futures",
              market="forts",
              asset_class="future",
          )
          candles = client.fetch_candles(
              instrument,
              timeframe="D1",
              from_date="2019-06-25",
              till_date="2019-06-25",
              completed_only=True,
          )
          print(f"BRJ0_CORRECTED_D1_2019_06_25_COUNT={candles.count}")
          assert candles.count == 0
          print("BRJ0_ORIGINAL_CONDITION_RETEST=PASS")
          PY
