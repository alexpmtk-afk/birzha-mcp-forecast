name: BR YDB Export Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/br-ydb-export-once.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: br-ydb-export-once
  cancel-in-progress: false

env:
  APP_SHA: 46982ad6c7040d82dffec6cf0d345fb9e844f89e
  OIDC_AUDIENCE: https://github.com/alexpmtk-afk
  PUBLISHER_SERVICE_ACCOUNT_ID: ajessiopotr4eq1g2c2v
  EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/birzha-mcp-forecast@1350648480:ref:refs/heads/main
  YDB_CONNECTION_STRING: grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1gi4pr9msenirafh2c7/etnes7omhgut11oulsd5

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mint read-only Yandex IAM token through GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Refusing outside main" >&2; exit 1; }
          ENCODED_AUDIENCE="$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe=""))')"
          SEP='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && SEP='&'
          RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${SEP}audience=${ENCODED_AUDIENCE}")"
          OIDC_JWT="$(python -c 'import json,sys; print(json.load(sys.stdin).get("value", ""))' <<< "$RESPONSE")"
          test -n "$OIDC_JWT"
          echo "::add-mask::$OIDC_JWT"
          python - "$OIDC_JWT" <<'PY'
          import base64, json, os, sys
          payload=sys.argv[1].split('.')[1]; payload += '=' * (-len(payload) % 4)
          claims=json.loads(base64.urlsafe_b64decode(payload))
          assert claims.get('sub') == os.environ['EXPECTED_OIDC_SUBJECT'], claims.get('sub')
          assert claims.get('aud') == os.environ['OIDC_AUDIENCE'], claims.get('aud')
          print('GITHUB_OIDC_CLAIMS=PASS')
          PY
          TOKEN_RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 \
            -X POST 'https://auth.yandex.cloud/oauth/token' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${PUBLISHER_SERVICE_ACCOUNT_ID}" \
            --data-urlencode "subject_token=${OIDC_JWT}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          IAM_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin).get("access_token", ""))' <<< "$TOKEN_RESPONSE")"
          test -n "$IAM_TOKEN"
          echo "::add-mask::$IAM_TOKEN"
          printf '%s' "$IAM_TOKEN" > "$RUNNER_TEMP/yandex-iam-token"
          chmod 600 "$RUNNER_TEMP/yandex-iam-token"
          echo 'YANDEX_OIDC_TOKEN_EXCHANGE=PASS'

      - name: Checkout validated application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: alexpmtk-afk/birzha-mcp-forecast
          ref: ${{ env.APP_SHA }}
          path: app
          fetch-depth: 1
          persist-credentials: false

      - name: Install application
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = "$APP_SHA"
          python -m pip install --disable-pip-version-check -e ./app

      - name: Export BR D1 from YDB without writes
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/app/src"
          python - <<'PY'
          import base64, gzip, json, os
          from pathlib import Path
          import ydb
          from birzha.storage.ydb_historical_store import _rows, _row_value, _utf8

          token=Path(os.environ['RUNNER_TEMP'] + '/yandex-iam-token').read_text().strip()
          driver=ydb.Driver(connection_string=os.environ['YDB_CONNECTION_STRING'], credentials=ydb.AccessTokenCredentials(token))
          driver.wait(timeout=15, fail_fast=True)
          pool=ydb.QuerySessionPool(driver)
          try:
              sessions_result=pool.execute_with_retries(
                  """
                  DECLARE $from_date AS Utf8;
                  DECLARE $till_date AS Utf8;
                  SELECT symbol, trade_date, secid
                  FROM `historical_candles_sessions`
                  WHERE trade_date >= $from_date AND trade_date <= $till_date
                  ORDER BY trade_date, secid;
                  """,
                  {'$from_date': _utf8('2021-01-01'), '$till_date': _utf8('2024-12-31')},
                  retry_settings=ydb.RetrySettings(idempotent=True),
              )
              session_map={}
              br_secids=set()
              symbols=set()
              for row in _rows(sessions_result):
                  secid=str(_row_value(row,'secid'))
                  if not secid.upper().startswith('BR'):
                      continue
                  trade_date=str(_row_value(row,'trade_date'))[:10]
                  symbol=str(_row_value(row,'symbol'))
                  br_secids.add(secid)
                  symbols.add(symbol)
                  session_map[(secid,trade_date)]=trade_date

              candles_result=pool.execute_with_retries(
                  """
                  DECLARE $timeframe AS Utf8;
                  DECLARE $from_date AS Utf8;
                  DECLARE $upper AS Utf8;
                  SELECT secid, begin, end_time, payload_json, source
                  FROM `historical_candles`
                  WHERE timeframe = $timeframe AND begin >= $from_date AND begin < $upper
                  ORDER BY begin, secid;
                  """,
                  {'$timeframe': _utf8('D1'), '$from_date': _utf8('2021-01-01'), '$upper': _utf8('2025-01-01')},
                  retry_settings=ydb.RetrySettings(idempotent=True),
              )
              out=[]
              for row in _rows(candles_result):
                  secid=str(_row_value(row,'secid'))
                  if secid not in br_secids:
                      continue
                  payload=json.loads(str(_row_value(row,'payload_json')))
                  candle=payload.get('candle') or {}
                  begin=str(candle.get('begin') or _row_value(row,'begin'))
                  end=str(candle.get('end') or _row_value(row,'end_time'))
                  day=begin[:10]
                  source=str(_row_value(row,'source'))
                  out.append([
                      f'BR|D1|{secid}|{begin}',
                      day,
                      session_map.get((secid,day), day),
                      '',
                      begin,
                      end,
                      end,
                      'INFERRED',
                      secid,
                      candle.get('open'),
                      candle.get('high'),
                      candle.get('low'),
                      candle.get('close'),
                      candle.get('volume'),
                      '',
                      candle.get('value'),
                      bool(candle.get('completed', True)),
                      'D1',
                      1,
                      source,
                  ])
              out.sort(key=lambda r:(r[1],r[8],r[4]))
              payload={'columns':['record_key','calendar_date','trade_session_date','session_id','bar_start_time','bar_end_time','available_at','available_at_confidence','contract_code','open','high','low','close','volume','number_of_trades','turnover','is_complete','source_interval','source_candles','source_id'], 'rows':out, 'symbols':sorted(symbols), 'secids':sorted(br_secids)}
              raw=json.dumps(payload,ensure_ascii=False,separators=(',',':')).encode('utf-8')
              packed=base64.b64encode(gzip.compress(raw,compresslevel=9)).decode('ascii')
              print(f'BR_EXPORT_COUNT={len(out)}')
              print(f'BR_EXPORT_FIRST={out[0][1] if out else ""}')
              print(f'BR_EXPORT_LAST={out[-1][1] if out else ""}')
              print('BR_EXPORT_SYMBOL_KEYS=' + ','.join(sorted(symbols)))
              print('BR_EXPORT_B64_BEGIN')
              for i in range(0,len(packed),12000):
                  print(f'BR_EXPORT_B64_{i//12000:03d}={packed[i:i+12000]}')
              print('BR_EXPORT_B64_END')
              assert out, 'No BR D1 rows found in YDB'
          finally:
              pool.stop()
              driver.stop()
          PY

      - name: Cleanup ephemeral token
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yandex-iam-token"
