name: GOLD exact-contract MOEX source gaps research (read-only)
on:
  push:
    branches: [chatgpt/gold-source-gap-diagnostic-20261015]
    paths: [.github/workflows/gold-source-gap-diagnostic-20261015.yml]
permissions:
  contents: read
jobs:
  source-gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install read-only research environment
        run: python -m pip install -e .
      - name: Fetch official MOEX exact-contract raw D1/H1/M1 and report M15 omissions
        id: source
        shell: bash
        run: |
          mkdir -p research_diagnostics/GOLD
          set +e
          python -m scripts.gold_source_gap_diagnostic_20261015 \
            > research_diagnostics/GOLD/source.log 2>&1
          rc=$?
          cat research_diagnostics/GOLD/source.log
          echo "source_exit=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Always retain source evidence even if intervals incomplete
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GOLD-exact-contract-native-M1-H1-source-gap-evidence
          path: research_diagnostics/GOLD/
          retention-days: 30
          if-no-files-found: error
      - name: Never call gap incomplete a full market PASS
        shell: bash
        run: |
          rc='${{ steps.source.outputs.source_exit }}'
          if [ "$rc" -eq 0 ]; then
            echo 'DIAGNOSTIC_SOURCE_NO_GAPS_OBSERVED; no PIT or full calendar admission'
          elif [ "$rc" -eq 1 ]; then
            echo 'PARTIAL: real MOEX source gaps preserved and enumerated in artifact'
            exit 1
          else
            echo 'ERROR: source or diagnostic failed, inspect artifact errors'
            exit 2
          fi
