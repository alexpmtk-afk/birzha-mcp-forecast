name: BR D1 isolated exact 13-day source delta
on:
  push:
    branches: [chatgpt/br-source-capture-20261015]
    paths:
      - .github/workflows/br-d1-delta-20260928-20261014.yml
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - name: Capture verified D1 from MOEX exact historical contract
        run: python -m scripts.g2_br_d1_delta_20261015
      - name: Validate source/manifest SHA and CSV contract
        run: |
          cd br_d1_source_20260928_20261014
          sha256sum -c SHA256SUMS.txt
          python - <<'PY'
          import csv,json
          with open('verified_d1_rows.csv',newline='') as f:rows=list(csv.reader(f))
          manifest=json.load(open('source_manifest.json'))
          assert len(rows)==len(manifest['records'])==13
          assert all(len(r)==20 and r[8] in ('BRV6','BRX6') and r[16]=='TRUE' for r in rows)
          assert len({r[0] for r in rows})==len(rows)
          print({'status':'D1_EXACT_CONTRACT_SOURCE_PASS','rows':len(rows)})
          PY
      - name: Preserve isolated D1 source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: br-d1-delta-20260928-20261014
          path: br_d1_source_20260928_20261014/
          if-no-files-found: error
          retention-days: 30
