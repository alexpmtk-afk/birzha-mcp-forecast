name: G2 IMOEX 2025-26 D1 trading calendar audit
on:
  push:
    branches: [chatgpt/g2-imoex-h1m15-coverage-probe-20261013]
    paths:
      - .github/workflows/g2-imoex-calendar-coverage-audit.yml
permissions:
  contents: read
jobs:
  imoex-read-only-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Verify offline IMOEX source-calendar audit policy
        run: python -m pytest -q tests/test_g2_imoex_calendar_coverage_audit.py
      - name: Check official MOEX activity versus IMOEX D1 2025 to last complete week
        run: python -m scripts.g2_imoex_calendar_coverage_audit --mode audit --from-date 2025-01-01 --till-date 2026-10-09
