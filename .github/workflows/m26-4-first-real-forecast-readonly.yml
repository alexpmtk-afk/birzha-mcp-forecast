name: M26.4 First Real Forecast Readonly

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/run_first_real_forecast_readonly.py"
      - ".github/workflows/m26-4-first-real-forecast-readonly.yml"
      - "src/birzha/application/**"
      - "src/birzha/providers/**"

permissions:
  contents: read

concurrency:
  group: m26-4-first-real-forecast-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Build guarded live SBER forecast without persistence
        run: python scripts/run_first_real_forecast_readonly.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: first-real-sber-forecast
          path: artifacts/first_real_sber_forecast.json
          if-no-files-found: warn
          retention-days: 30
