name: M23 main-controlled regression once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m23-main-regression-once.yml'

permissions:
  contents: read
  id-token: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout M22 exact SHA
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: 5e31dc3aa47dc9aead84f638bf2b29cdf40f6f5c
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: M22 install and test
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pytest -q
          python -m compileall -q src tests scripts
      - name: Checkout M23 exact SHA
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: f3cd250c873dfcf87d20d5e5f777b10fa9d78394
          clean: true
          persist-credentials: false
      - name: M23 install and test
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pytest -q
          python -m compileall -q src tests scripts
