name: G2 IMOEX full reconstructed Forecast V1 offline validation
on:
  push:
    branches: [chatgpt/g2-imoex-final-quality-replay-20261013]
    paths:
      - .github/workflows/g2-imoex-full-forecast-replay-validation.yml
permissions:
  contents: read
  actions: read
jobs:
  full-v1-development-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Reuse full real 2025-2026 IMOEX research DB, no MOEX intraday download
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          mkdir -p research/IMOEX
          gh run download 38445782909 --repo "$GITHUB_REPOSITORY" --name imoex-2025-2026-10-12-consolidated-h1-m15 --dir research/IMOEX
      - name: Real MOEX D1 plus immutable saved H1 M15 every eligible development date
        run: |
          python -m scripts.g2_imoex_full_reconstructed_v1_validation \
            --archive research/IMOEX/birzha_intraday_research_2025_2026.duckdb \
            --expected-sha256 caa235288d442cf88fd9f8ae38a5c51071042badb6b9295386495468aaa2d4c6 \
            --output research/IMOEX/IMOEX_2025-2026_V1_ALL_CUTOFFS_RECONSTRUCTED_RESEARCH.json
      - name: Assert research flags, archive counts and nonzero actual V1 outcomes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/IMOEX/IMOEX_2025-2026_V1_ALL_CUTOFFS_RECONSTRUCTED_RESEARCH.json')
          r=json.loads(p.read_text())
          assert r['archive_quality']['captured_days']==457
          assert r['archive_quality']['H1']==4199 and r['archive_quality']['M15']==16073
          assert r['engine_replays_completed']>100
          assert r['cutoffs_with_20_future_candidate_D1']>75
          assert not r['release_allowed'] and not r['eligible_for_trading']
          assert r['historical_first_receipt']=='NOT_PROVEN'
          assert r['future_prices_delivered_to_engine'] is False
          assert all(row['assessment_status']=='ENGINE_REPLAYED' for row in r['forecast_rows'])
          print('REAL_V1_ALL_ELIGIBLE_PASS',r['engine_replays_completed'],
                r['cutoffs_with_20_future_candidate_D1'])
          PY
      - name: Save complete historical Forecast V1 research and descriptive outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imoex-2025-26-all-v1-replays-and-descriptive-outcomes
          path: research/IMOEX/IMOEX_2025-2026_V1_ALL_CUTOFFS_RECONSTRUCTED_RESEARCH.json
          if-no-files-found: error
          retention-days: 30
