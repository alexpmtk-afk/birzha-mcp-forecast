name: G2 IMOEX January 2025 durable research capture
on:
  push:
    branches: [chatgpt/g2-imoex-jan2025-durable-capture-20261013]
    paths:
      - .github/workflows/g2-imoex-jan2025-capture.yml
      - scripts/g2_imoex_month_archive.py
      - tests/test_g2_imoex_month_archive.py
permissions:
  contents: read
jobs:
  imoex-jan2025-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Prove source collector with offline fixtures
        run: python -m pytest -q tests/test_g2_imoex_month_archive.py tests/test_research_intraday_archive.py tests/test_g2_intraday_research_cli.py
      - name: Create independent research archive output folder
        run: mkdir -p ./research/IMOEX
      - name: Ingest native IMOEX H1 plus ephemeral M1-derived strict M15 for Jan 2025
        run: |
          python -m scripts.g2_imoex_month_archive --mode ingest --year 2025 --month 1 --max-source-days 31 \
            --archive ./research/IMOEX/birzha_intraday_research_2025_2026.duckdb \
            --report ./research/IMOEX/IMOEX_2025-01_coverage.json --ack-research-write
      - name: Print auditable SHA256 and file sizes
        if: always()
        shell: bash
        run: |
          if [ -d research/IMOEX ]; then
            find research/IMOEX -maxdepth 1 -type f -printf '%f %s bytes\n'
            (cd research/IMOEX && sha256sum *.duckdb *.json > IMOEX_2025-01_SHA256SUMS.txt) || true
          fi
      - name: Preserve reusable DuckDB and coverage report as an artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imoex-intraday-2025-01-duckdb
          path: research/IMOEX/
          if-no-files-found: error
          retention-days: 30
