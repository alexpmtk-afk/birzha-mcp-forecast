name: GOLD June 2025 multi-contract research archive

on:
  push:
    branches:
      - chatgpt/gold-monthly-2025-06-20261014
    paths:
      - .github/workflows/gold-monthly-2025-06-20261014.yml

permissions:
  contents: read
  actions: read

jobs:
  gold-june-research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install existing research code
        run: python -m pip install -e .

      - name: Seed monthly archive with verified 2025-06-09 DuckDB artifact
        uses: actions/download-artifact@v4
        with:
          name: GOLD-GDM5-2025-06-09-research-duckdb
          run-id: 38601837254
          github-token: ${{ github.token }}
          path: research/GOLD/2025-06-09

      - name: Verify seed marker and exact 09 June candle counts
        run: |
          python -m scripts.gold_gdm5_verify_archive \
            --archive research/GOLD/2025-06-09/birzha_intraday_research_2025_2026.duckdb \
            --capture-exit 1

      - name: Collect June 2025 GOLD only, all quoted GD contracts
        id: capture
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.gold_monthly_research_capture \
            --month 2025-06 \
            --archive research/GOLD/2025-06-09/birzha_intraday_research_2025_2026.duckdb \
            --output research/GOLD/2025-06 2>&1 | tee research/GOLD/month-run.log

      - name: Preserve research DuckDB, manifest, all diagnostics and H1/M15 exports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GOLD-JUNE-2025-all-GD-research
          path: research/GOLD/
          if-no-files-found: error
          retention-days: 30

      - name: Never promote research with gaps or uncertified calendar to PASS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/GOLD/2025-06/manifest.json")
          if not p.is_file():
              raise SystemExit("MISSING_MANIFEST")
          d = json.loads(p.read_text(encoding="utf-8"))
          print("RESEARCH_STATUS", d["status"])
          print("ROWS", d.get("counts"))
          print("CONTRACTS", d.get("contracts"))
          if d["status"] != "SOURCE_RECEIPT_NOT_PIT_VERIFIED":
              raise SystemExit("PARTIAL_OR_INVALID_RESEARCH_WITH_GAPS")
          PY
