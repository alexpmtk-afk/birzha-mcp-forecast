name: G2 Post-Maturity Outcome Readiness

on:
  push:
    branches:
      - chatgpt/g2-post-maturity-outcome-readiness-20261010
  pull_request:
    branches:
      - chatgpt/g2-first-frozen-real-forecast-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Test maturity and evidence gates
        run: python -m pytest -q tests/test_g2_post_maturity_outcome_readiness.py
      - name: Test entire project
        run: python -m pytest -q
      - name: Compile maturity reader
        run: python -m compileall -q scripts/g2_post_maturity_outcome_readiness.py scripts/g2_frozen_forecast_report.py tests/test_g2_post_maturity_outcome_readiness.py
