name: SBER 2025-26 isolated research batch verification
on:
  push:
    branches: [chatgpt/sber-g2-history-2025-26-20261013]
    paths:
      - .github/workflows/g2-sber-history-batch.yml
      - scripts/g2_sber_history_batch.py
      - src/birzha/application/research_intraday_fetch.py
      - tests/test_g2_sber_history_batch.py
      - tests/test_sber_stock_market_calendar.py
      - src/birzha/application/sber_stock_market_calendar.py
      - tests/test_research_intraday_archive.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: SBER synthetic invariants (strict M15, audit, resume, conflicts)
        run: python -m pytest -q tests/test_sber_stock_market_calendar.py tests/test_g2_sber_history_batch.py tests/test_g2_intraday_research_cli.py tests/test_research_intraday_archive.py
      - name: Whole existing repository regression (offline)
        run: python -m pytest -q
  source-read-only:
    # Avoid new MOEX downloads on every test-only code push.
    # The initial approved bounded five-date pilot was already completed.
    if: github.event_name == 'workflow_dispatch'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        date: ["2025-06-09", "2025-12-15", "2026-06-15", "2026-07-18", "2026-10-09"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - name: Bounded MOEX read-only probe; never persist source candles
        env:
          SAMPLE_DATE: ${{ matrix.date }}
        run: |
          python -m scripts.g2_intraday_research_archive --mode probe --date "$SAMPLE_DATE" --markets SBER > /tmp/sber-source-summary.json || true
          python - <<'PY'
          import json, os
          with open('/tmp/sber-source-summary.json', encoding='utf-8') as f:
              records = [json.loads(line) for line in f if line.strip()]
          assert len(records) == 1 and records[0]['market'] == 'SBER', records
          r = records[0]
          print(json.dumps({'date': os.environ['SAMPLE_DATE'], 'status': r['status'],
                            'h1': r.get('h1_rows'), 'm1_transient': r.get('raw_m1_rows_transient'),
                            'strict_m15': r.get('m15_rows'),
                            'incomplete_m15': r.get('incomplete_m15_buckets'),
                            'invalid_h1': r.get('skipped_h1_bars')}, sort_keys=True))
          # Weekend session candle assignment requires a separate calendar
          # verification. Absence is an explicit unresolved result, not CLOSED.
          if os.environ['SAMPLE_DATE'] != '2026-07-18':
              assert r.get('h1_rows', 0) > 0 and r.get('m15_rows', 0) > 0, r
          else:
              print('WEEKEND_SESSION_ASSOCIATION_UNVERIFIED')
          PY
  ephemeral-pilot:
    if: github.event_name == 'workflow_dispatch'
    needs: [offline, source-read-only]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Single real SBER date to disposable isolated DuckDB only
        run: |
          mkdir -p research/SBER
          python -m scripts.g2_sber_history_batch --mode ingest --from-date 2025-06-09 --through-date 2025-06-09 --max-days 1 --pause-seconds 0 --archive research/SBER/birzha_intraday_research_2025_2026.duckdb --ack-research-write --ack-source-verified || true
          python -m scripts.g2_sber_history_batch --mode report --from-date 2025-06-09 --through-date 2025-06-09 --archive research/SBER/birzha_intraday_research_2025_2026.duckdb
          python - <<'PY'
          import duckdb
          path = 'research/SBER/birzha_intraday_research_2025_2026.duckdb'
          with duckdb.connect(path, read_only=True) as cx:
              rows = dict(cx.execute("SELECT timeframe, count(*) FROM research_intraday_candles GROUP BY timeframe").fetchall())
              assert rows.get('H1', 0) > 0 and rows.get('M15', 0) > 0, rows
              assert set(rows) == {'H1', 'M15'}
              summary = cx.execute("SELECT status, attempts FROM research_sber_batch_dates WHERE civil_date='2025-06-09'").fetchone()
              assert summary and summary[0] == 'CAPTURED_WITH_GAPS' and summary[1] == 1, summary
              print('EPHEMERAL_SBER_PILOT_PASS', rows, summary)
          PY
      - name: One-day restart skips network and does not duplicate stored candles
        run: |
          python -m scripts.g2_sber_history_batch --mode ingest --from-date 2025-06-09 --through-date 2025-06-09 --max-days 1 --pause-seconds 0 --archive research/SBER/birzha_intraday_research_2025_2026.duckdb --ack-research-write --ack-source-verified
          python - <<'PY'
          import duckdb
          path = 'research/SBER/birzha_intraday_research_2025_2026.duckdb'
          with duckdb.connect(path, read_only=True) as cx:
              assert cx.execute("SELECT attempts FROM research_sber_batch_dates WHERE civil_date='2025-06-09'").fetchone()[0] == 1
              assert cx.execute("SELECT count(*) FROM (SELECT secid,timeframe,begin,count(*) AS n FROM research_intraday_candles GROUP BY 1,2,3 HAVING n>1)").fetchone()[0] == 0
              print('NO_REPEAT_FETCH_AND_NO_DUPLICATES_PASS')
          PY
      # No artifact upload: do not distribute MOEX candle OHLCV in public CI.
