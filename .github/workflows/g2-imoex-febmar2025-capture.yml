name: G2 IMOEX February March 2025 research captures
on:
  push:
    branches: [chatgpt/g2-imoex-jan2025-durable-capture-20261013]
    paths:
      - .github/workflows/g2-imoex-febmar2025-capture.yml
permissions:
  contents: read
jobs:
  imoex-monthly-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        month: ["02", "03"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Test bounded monthly capture and immutable source store
        run: python -m pytest -q tests/test_g2_imoex_month_archive.py tests/test_research_intraday_archive.py tests/test_g2_intraday_research_cli.py
      - name: Prepare only the isolated study folder
        run: mkdir -p ./research/IMOEX
      - name: Ingest exact IMOEX source for bounded month
        run: |
          python -m scripts.g2_imoex_month_archive --mode ingest --year 2025 --month ${{ matrix.month }} \
            --archive ./research/IMOEX/birzha_intraday_research_2025_2026.duckdb \
            --report ./research/IMOEX/IMOEX_2025-${{ matrix.month }}_coverage.json --ack-research-write
      - name: Record file sizes and SHA-256
        if: always()
        shell: bash
        run: |
          if [ -d research/IMOEX ]; then
            find research/IMOEX -maxdepth 1 -type f -printf '%f %s bytes\n'
            (cd research/IMOEX && sha256sum *.duckdb *.json > IMOEX_2025-${{ matrix.month }}_SHA256SUMS.txt) || true
          fi
      - name: Preserve isolated month DB and source-day report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imoex-intraday-2025-${{ matrix.month }}-duckdb
          path: research/IMOEX/
          if-no-files-found: error
          retention-days: 30
