name: Birzha Bridge v1 M25 Final CI

on:
  push:
    branches:
      - bridge-v1-m25-final
    paths:
      - 'src/birzha/application/market_mirror.py'
      - 'src/birzha/application/market_mirror_sync.py'
      - 'src/birzha/application/orchestration_worker.py'
      - 'src/birzha/storage/google_sheets_bridge.py'
      - 'src/birzha/config.py'
      - 'src/birzha/worker.py'
      - 'tests/test_google_sheets_bridge_v1.py'
      - 'tests/test_market_mirror_config_v1.py'
      - 'tests/test_market_mirror_sync_v1.py'
      - 'tests/test_orchestration_worker_market_mirror_v1.py'
      - 'docs/BIRZHA_BRIDGE_V1_STATUS.md'
      - '.github/workflows/bridge-v1-m25-final-ci.yml'

permissions:
  contents: read

jobs:
  final-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridge-v1-m25-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Static final contract
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          f=src/birzha/storage/google_sheets_bridge.py
          grep -Fq 'BRIDGE_PROTOCOL_VERSION = 1' "$f"
          grep -Fq 'BRIDGE_RELEASE = "1.0.0"' "$f"
          grep -Fq 'BRIDGE_PROJECT_ID = "birzha"' "$f"
          for action in sheet_ensure sheet_stage_begin sheet_write_chunk sheet_verify sheet_commit sheet_inspect sheet_abort; do
            grep -Fq "\"$action\"" "$f"
          done
          ! grep -Eq 'birzha_health|birzha_ensure_archive|birzha_replace_snapshot|birzha_summary' "$f"
          ! grep -Eqi 'marketplaces.*secret|marketplaces.*apps script|shared Marketplaces' "$f"
          if grep -R -n -E 'NOT_IMPLEMENTED|TODO|FIXME' src/birzha/storage/google_sheets_bridge.py src/birzha/application/market_mirror.py src/birzha/application/market_mirror_sync.py docs/BIRZHA_BRIDGE_V1_STATUS.md; then
            echo 'unfinished M25 Bridge marker found'
            exit 1
          fi
          echo BIRZHA_BRIDGE_V1_FINAL_STATIC=PASS
      - name: Focused Bridge/M25 tests
        run: |
          python -m pytest -q \
            tests/test_google_sheets_bridge_v1.py \
            tests/test_market_mirror_config_v1.py \
            tests/test_market_mirror_sync_v1.py \
            tests/test_orchestration_worker_market_mirror_v1.py \
            tests/test_worker_entrypoint.py
      - name: Full repository regression
        run: python -m pytest -q
