name: GOLD GDM5 single-day isolated research capture

on:
  push:
    branches:
      - chatgpt/gold-gdm5-capture-20261014
    paths:
      - .github/workflows/gold-gdm5-single-day-20261014.yml

permissions:
  contents: read

jobs:
  gold-gdm5-2025-06-09:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install existing research application
        run: python -m pip install -e .

      - name: Resolve and capture only GOLD GDM5 on 2025-06-09
        id: capture
        shell: bash
        run: |
          mkdir -p research/GOLD/2025-06-09
          set +e
          python - <<'PY' > research/GOLD/2025-06-09/contract_resolution.log 2>&1
          from datetime import date
          from birzha.application.market_data import MarketDataService
          i = MarketDataService.default().resolve("GOLD", as_of=date(2025, 6, 9))
          print("MOEX_RESOLUTION", i.symbol, i.secid, i.engine, i.market, i.board, flush=True)
          assert (i.symbol, i.secid, i.engine, i.market, i.board) == (
              "GOLD", "GDM5", "futures", "forts", "RFUD"
          ), "Unexpected MOEX contract or market; refuse ingest"
          PY
          resolution_rc=$?
          if [ "$resolution_rc" -eq 0 ]; then
            python -m scripts.g2_intraday_research_archive \
              --mode ingest \
              --date 2025-06-09 \
              --markets GOLD \
              --archive research/GOLD/2025-06-09/birzha_intraday_research_2025_2026.duckdb \
              --ack-research-write \
              > research/GOLD/2025-06-09/ingest.log 2>&1
            capture_rc=$?
          else
            capture_rc=3
            printf 'MOEX contract-resolution guard failed with rc=%s\n' "$resolution_rc" \
              > research/GOLD/2025-06-09/ingest.log
          fi
          cat research/GOLD/2025-06-09/contract_resolution.log
          cat research/GOLD/2025-06-09/ingest.log
          printf 'exit_code=%s\n' "$capture_rc" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$capture_rc" > research/GOLD/2025-06-09/capture_exit_code.txt
          exit 0

      - name: Close/reopen independent DuckDB read-only and hash archive
        id: validate
        continue-on-error: true
        run: |
          python -m scripts.gold_gdm5_verify_archive \
            --archive research/GOLD/2025-06-09/birzha_intraday_research_2025_2026.duckdb \
            --capture-exit "${{ steps.capture.outputs.exit_code }}"

      - name: Preserve real DuckDB plus diagnostics even on partial/error
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GOLD-GDM5-2025-06-09-research-duckdb
          path: research/GOLD/2025-06-09/
          if-no-files-found: error
          retention-days: 30

      - name: Keep source gaps and failed verification non-PASS
        shell: bash
        run: |
          if [ "${{ steps.validate.outcome }}" != "success" ]; then
            echo "FAIL: persisted research archive did not pass read-only verification"
            exit 2
          fi
          if [ "${{ steps.capture.outputs.exit_code }}" != "0" ]; then
            echo "PARTIAL: verified GOLD candles persisted; source contains missing/incomplete intervals"
            exit 1
          fi
          echo "SOURCE_RECEIPT_PASS: source database verified (PIT/calendar not certified)"
