name: BR One Instrument Export

on:
  push:
    branches:
      - feature/semantic-timeframe-indicators-20260924
    paths:
      - 'scripts/export_one_instrument_br.py'
      - '.github/workflows/br-one-instrument-export.yml'

permissions:
  contents: write

jobs:
  export-br:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MOEX_ALGOPACK_BEARER_TOKEN: ${{ secrets.MOEX_ALGOPACK_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/semantic-timeframe-indicators-20260924
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Export BR only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp/br-one-instrument
          python scripts/export_one_instrument_br.py             --as-of 2026-09-24             --output tmp/br-one-instrument

      - name: Commit generated BR dataset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/br-one-instrument
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Generate BR one-instrument dataset"
          git push origin HEAD:feature/semantic-timeframe-indicators-20260924
