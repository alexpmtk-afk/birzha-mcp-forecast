name: G2 Forecast Decision Explanation
on:
  push:
    branches: [codex/g2-forecast-decision-explanation-20261010]
  pull_request:
    branches: [codex/g2-combined-market-report-20261010]
permissions:
  contents: read
concurrency:
  group: g2-forecast-decision-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -p no:cacheprovider
      - run: python scripts/repository_preflight.py
