name: G2 IMOEX source exception real one-day pilot
on:
  push:
    branches: [chatgpt/imoex-interval-recovery-source-fidelity-20261013]
    paths:
      - .github/workflows/g2-imoex-recovery-source-pilot.yml
permissions:
  contents: read
  actions: read
jobs:
  source-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Unit tests for authentic source exceptions
        run: python -m pytest -q tests/test_g2_imoex_source_interval_recovery.py
      - name: Download original 457-day research DuckDB read-only
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          mkdir -p research
          gh run download 38445782909 --repo "$GITHUB_REPOSITORY" --name imoex-2025-2026-10-12-consolidated-h1-m15 --dir research
      - name: Verify real June 2025 source H1 and M1 against original canonical prices
        run: |
          python -m scripts.g2_imoex_source_interval_recovery \
            --archive research/birzha_intraday_research_2025_2026.duckdb \
            --year 2025 --month 6 --day 2025-06-09 \
            --output research/IMOEX_MOEX_SHORT_INTERVAL_SOURCE_PILOT.json
      - name: Preserve actual MOEX recovery diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imoex-m1-h1-source-recovery-pilot-2025-06-09
          path: research/IMOEX_MOEX_SHORT_INTERVAL_SOURCE_PILOT.json
          if-no-files-found: ignore
