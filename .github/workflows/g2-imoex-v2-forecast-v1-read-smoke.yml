name: G2 IMOEX source compatible original Forecast V1 research smoke
on:
  push:
    branches: [chatgpt/imoex-interval-recovery-source-fidelity-20261013]
    paths:
      - .github/workflows/g2-imoex-v2-forecast-v1-read-smoke.yml
permissions:
  contents: read
  actions: read
jobs:
  compare-reconstructed-source-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Reuse source validated V2 research DuckDB without any H1/M1 network refill
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          mkdir -p research/IMOEX
          gh run download 38457009349 --repo "$GITHUB_REPOSITORY" --name imoex-all-observed-source-h1-m15-2025-2026-v2 --dir research/IMOEX
      - name: Run original price-only Forecast V1 strict and compatible input variants on two historical dates
        run: |
          python -m scripts.g2_imoex_v2_research_engine_smoke \
            --archive research/IMOEX/birzha_intraday_research_2025_2026_source_compatible.duckdb \
            --expected-sha256 e66262c6d809e7a81b2b91d6e1068e60b3dac114b0310c862d05127c36b29a5c \
            --output research/IMOEX/IMOEX_STRICT_VS_SOURCE_COMPAT_FORECAST_V1_SMOKE.json
      - name: Verify extra real native observations are actually supplied to engine
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/IMOEX/IMOEX_STRICT_VS_SOURCE_COMPAT_FORECAST_V1_SMOKE.json')
          r=json.loads(p.read_text())
          assert r['engine_unchanged'] and not r['trade_allowed'] and not r['live_forecast_issued']
          for day,modes in r['results'].items():
              a=modes['strict']
              b=modes['native_source_compatible']
              assert a['engine_version']==b['engine_version']
              assert b['h1_bars'] > a['h1_bars']
              assert b['m15_bars'] > a['m15_bars']
              print('FORECAST_V1_SOURCE_INPUTS_PASS',day,'H1',a['h1_bars'],b['h1_bars'],'M15',a['m15_bars'],b['m15_bars'])
          PY
      - name: Retain read-only actual engine acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imoex-v2-original-forecast-v1-strict-vs-source-compat-smoke
          path: research/IMOEX/IMOEX_STRICT_VS_SOURCE_COMPAT_FORECAST_V1_SMOKE.json
          if-no-files-found: error
          retention-days: 30
