name: G2 isolated intraday research archive
on:
  push:
    branches: [chatgpt/g2-research-intraday-duckdb-archive-20261013]
permissions:
  contents: read
jobs:
  offline-research-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: New isolated DuckDB, strict M15 and CLI negatives (no MOEX)
        run: python -m pytest -q tests/test_research_intraday_archive.py tests/test_g2_intraday_research_cli.py
      - name: All repository tests (offline)
        run: python -m pytest -q
