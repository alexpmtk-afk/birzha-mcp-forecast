name: M23 BRJ0 MOEX Diagnostic Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m23-brj0-diagnostic-once.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare official MOEX history and candle intervals for BRJ0
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          BASE = "https://iss.moex.com/iss"
          HEADERS = {"Accept": "application/json", "User-Agent": "BIRZHA-MCP-FORECAST-DIAGNOSTIC/1.0"}

          def get(path, params):
              url = BASE + path + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def table(payload, name):
              t = payload.get(name) or {}
              cols = t.get("columns") or []
              return [dict(zip(cols, row)) for row in (t.get("data") or [])]

          history = get(
              "/history/engines/futures/markets/forts/boards/RFUD/securities/BRJ0.json",
              {
                  "iss.meta": "off",
                  "iss.only": "history",
                  "history.columns": "TRADEDATE,NUMTRADES,VOLUME,VALUE,OPEN,CLOSE,HIGH,LOW,WAPRICE",
                  "from": "2019-06-24",
                  "till": "2019-06-26",
              },
          )
          h = table(history, "history")
          print("BRJ0_HISTORY=" + json.dumps(h, ensure_ascii=False, sort_keys=True))

          candle_path = "/engines/futures/markets/forts/boards/RFUD/securities/BRJ0/candles.json"
          for interval, label in ((24, "D1"), (60, "H1"), (1, "M1")):
              payload = get(
                  candle_path,
                  {
                      "iss.meta": "off",
                      "interval": interval,
                      "from": "2019-06-25",
                      "till": "2019-06-25",
                      "candles.columns": "open,close,high,low,value,volume,begin,end",
                  },
              )
              rows = table(payload, "candles")
              print(f"BRJ0_{label}_2019_06_25_COUNT={len(rows)}")
              print(f"BRJ0_{label}_2019_06_25_ROWS=" + json.dumps(rows[:20], ensure_ascii=False, sort_keys=True))

          row = next((r for r in h if str(r.get("TRADEDATE"))[:10] == "2019-06-25"), None)
          assert row is not None
          activity = any(row.get(k) is not None and float(row.get(k) or 0) > 0 for k in ("NUMTRADES", "VOLUME", "VALUE"))
          price = any(row.get(k) is not None for k in ("OPEN", "CLOSE", "HIGH", "LOW", "WAPRICE"))
          print(f"BRJ0_2019_06_25_POSITIVE_ACTIVITY={str(activity).lower()}")
          print(f"BRJ0_2019_06_25_HISTORY_HAS_PRICE={str(price).lower()}")
          print("BRJ0_MOEX_DIAGNOSTIC_EXTENDED=PASS")
          PY
