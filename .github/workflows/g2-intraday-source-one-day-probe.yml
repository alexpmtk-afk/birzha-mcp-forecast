name: G2 one-day public MOEX source feasibility
on:
  push:
    branches: [chatgpt/g2-research-intraday-duckdb-archive-20261013]
    paths:
      - .github/workflows/g2-intraday-source-one-day-probe.yml
permissions:
  contents: read
jobs:
  one-day-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - name: Probe SBER 2025 H1/M1 source only, do not save files
        run: python -m scripts.g2_intraday_research_archive --mode probe --date 2025-06-09 --markets SBER
