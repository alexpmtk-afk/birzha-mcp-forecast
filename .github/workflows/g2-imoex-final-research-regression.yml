name: G2 IMOEX final research no-network full regression
on:
  push:
    branches: [chatgpt/g2-imoex-final-quality-replay-20261013]
    paths:
      - .github/workflows/g2-imoex-final-research-regression.yml
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Specific read-only archive integrity and historical replay safeguards
        run: python -m pytest -q tests/test_g2_imoex_saved_archive_replay.py tests/test_g2_imoex_merge_research_months.py tests/test_g2_forecast_historical_replay.py
      - name: Every repository regression test (offline)
        run: python -m pytest -q
