name: Publish current BIRZHA Yandex image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "scripts/docker_smoke.py"
      - ".github/workflows/publish-current-yandex-image.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: birzha-current-image-main
  cancel-in-progress: false

env:
  REGISTRY_ID: crpk5qvf4p7kcqil2u3v
  PUBLISHER_SERVICE_ACCOUNT_ID: ajessiopotr4eq1g2c2v
  OIDC_AUDIENCE: https://github.com/alexpmtk-afk
  EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/birzha-mcp-forecast@1350648480:ref:refs/heads/main
  IMAGE_NAME: birzha-mcp-forecast
  REGISTRY_API: https://container-registry.api.cloud.yandex.net/container-registry/v1

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Assert main identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          TARGET_TAG="git-${GITHUB_SHA}"
          TARGET_REPOSITORY="${REGISTRY_ID}/${IMAGE_NAME}"
          TARGET_IMAGE="cr.yandex/${TARGET_REPOSITORY}:${TARGET_TAG}"
          echo "TARGET_TAG=$TARGET_TAG" >> "$GITHUB_ENV"
          echo "TARGET_REPOSITORY=$TARGET_REPOSITORY" >> "$GITHUB_ENV"
          echo "TARGET_IMAGE=$TARGET_IMAGE" >> "$GITHUB_ENV"
          echo "LOCAL_IMAGE=birzha-mcp-forecast:source-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pytest -q
          python -m compileall -q src tests scripts

      - name: Build exact image
        run: docker build --pull --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "$LOCAL_IMAGE" .

      - name: Local container acceptance
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -d --name birzha-publish-smoke -p 8080:8080 "$LOCAL_IMAGE"
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null
          python scripts/docker_smoke.py
          docker stop birzha-publish-smoke

      - name: Exchange GitHub OIDC for Yandex IAM token
        shell: bash
        run: |
          set -euo pipefail
          ENCODED_AUDIENCE="$(python - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['OIDC_AUDIENCE'], safe=''))
          PY
          )"
          SEP='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && SEP='&'
          OIDC_RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${SEP}audience=${ENCODED_AUDIENCE}")"
          OIDC_JWT="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$OIDC_RESPONSE")"
          echo "::add-mask::$OIDC_JWT"
          python - "$OIDC_JWT" <<'PY'
          import base64,json,os,sys
          p=sys.argv[1].split('.')[1]; p += '=' * (-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          assert c.get('sub') == os.environ['EXPECTED_OIDC_SUBJECT'], c.get('sub')
          assert c.get('aud') == os.environ['OIDC_AUDIENCE'], c.get('aud')
          assert c.get('ref') == 'refs/heads/main'
          print('OIDC_CLAIMS_PASS')
          PY
          TOKEN_RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -X POST 'https://auth.yandex.cloud/oauth/token' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' --data-urlencode "audience=${PUBLISHER_SERVICE_ACCOUNT_ID}" --data-urlencode "subject_token=${OIDC_JWT}" --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          IAM_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$TOKEN_RESPONSE")"
          echo "::add-mask::$IAM_TOKEN"
          umask 077
          printf '%s' "$IAM_TOKEN" > "$RUNNER_TEMP/yandex-iam-token"

      - name: Push immutable image
        shell: bash
        run: |
          set -euo pipefail
          IAM_TOKEN="$(cat "$RUNNER_TEMP/yandex-iam-token")"
          DOCKER_CONFIG_DIR="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG_DIR"
          printf '%s' "$IAM_TOKEN" | docker --config "$DOCKER_CONFIG_DIR" login --username iam --password-stdin cr.yandex >/dev/null
          docker tag "$LOCAL_IMAGE" "$TARGET_IMAGE"
          docker --config "$DOCKER_CONFIG_DIR" push "$TARGET_IMAGE"

      - name: Resolve immutable Yandex digest and write evidence
        shell: bash
        run: |
          set -euo pipefail
          IAM_TOKEN="$(cat "$RUNNER_TEMP/yandex-iam-token")"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${IAM_TOKEN}" "${REGISTRY_API}/images?registryId=${REGISTRY_ID}&pageSize=1000" -o "$RUNNER_TEMP/images.json"
          mkdir -p artifacts
          python - "$RUNNER_TEMP/images.json" artifacts/yandex_image_publish.json <<'PY'
          import json,os,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text())
          matches=[x for x in d.get('images',[]) if x.get('name')==os.environ['TARGET_REPOSITORY'] and os.environ['TARGET_TAG'] in (x.get('tags') or [])]
          assert len(matches)==1, len(matches)
          image=matches[0]
          digest=image.get('digest','')
          assert digest.startswith('sha256:') and len(digest)==71, digest
          e={
            'schema':'BIRZHA_YANDEX_IMAGE_V1',
            'source_sha':os.environ['GITHUB_SHA'],
            'image_id':image.get('id'),
            'image_tag':os.environ['TARGET_IMAGE'],
            'digest':digest,
            'immutable_url':f"cr.yandex/{os.environ['TARGET_REPOSITORY']}@{digest}",
          }
          Path(sys.argv[2]).write_text(json.dumps(e,indent=2,sort_keys=True)+'\n')
          print(json.dumps(e,sort_keys=True))
          PY

      - name: Upload image evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: birzha-current-yandex-image
          path: artifacts/yandex_image_publish.json
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup credentials
        if: always()
        shell: bash
        run: |
          docker stop birzha-publish-smoke >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/yandex-iam-token" "$RUNNER_TEMP/images.json"
          rm -rf "$RUNNER_TEMP/docker-config"
