name: Diagnose Yandex OIDC subject

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Read only non-secret GitHub OIDC claims
        shell: bash
        env:
          OIDC_AUDIENCE: https://github.com/alexpmtk-afk
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Refusing diagnostic outside main" >&2; exit 1; }
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] || { echo "GitHub OIDC endpoint unavailable" >&2; exit 1; }
          ENCODED_AUDIENCE="$(python - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['OIDC_AUDIENCE'], safe=''))
          PY
          )"
          SEP='?'
          [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && SEP='&'
          RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${SEP}audience=${ENCODED_AUDIENCE}")"
          JWT="$(python -c 'import json,sys; print(json.load(sys.stdin).get("value", ""))' <<< "$RESPONSE")"
          [[ -n "$JWT" ]] || { echo "GitHub did not return an OIDC JWT" >&2; exit 1; }
          echo "::add-mask::$JWT"
          python - "$JWT" <<'PY'
          import base64, json, sys
          token=sys.argv[1]
          payload=token.split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims=json.loads(base64.urlsafe_b64decode(payload))
          allowed=(
              'sub','aud','repository','repository_id','repository_owner','repository_owner_id',
              'ref','ref_type','job_workflow_ref','job_workflow_sha','event_name','actor','actor_id'
          )
          for key in allowed:
              print(f'{key}={claims.get(key, "<absent>")}')
          PY
          unset JWT RESPONSE ACTIONS_ID_TOKEN_REQUEST_TOKEN
