name: Diagnose Yandex OIDC subject

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-yandex-oidc-subject.yml"

permissions:
  contents: read
  id-token: write

env:
  OIDC_AUDIENCE: https://github.com/alexpmtk-afk
  PUBLISHER_SERVICE_ACCOUNT_ID: ajessiopotr4eq1g2c2v
  EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/birzha-mcp-forecast@1350648480:ref:refs/heads/main
  REGISTRY_ID: crpk5qvf4p7kcqil2u3v
  REGISTRY_API: https://container-registry.api.cloud.yandex.net/container-registry/v1

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify GitHub OIDC and Yandex token exchange
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Refusing diagnostic outside main" >&2; exit 1; }
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] || { echo "GitHub OIDC endpoint unavailable" >&2; exit 1; }
          ENCODED_AUDIENCE="$(python - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['OIDC_AUDIENCE'], safe=''))
          PY
          )"
          SEP='?'
          [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && SEP='&'
          OIDC_RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${SEP}audience=${ENCODED_AUDIENCE}")"
          OIDC_JWT="$(python -c 'import json,sys; print(json.load(sys.stdin).get("value", ""))' <<< "$OIDC_RESPONSE")"
          [[ -n "$OIDC_JWT" ]] || { echo "GitHub did not return an OIDC JWT" >&2; exit 1; }
          echo "::add-mask::$OIDC_JWT"
          python - "$OIDC_JWT" <<'PY'
          import base64, json, os, sys
          token=sys.argv[1]
          payload=token.split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims=json.loads(base64.urlsafe_b64decode(payload))
          assert claims.get('sub') == os.environ['EXPECTED_OIDC_SUBJECT'], claims.get('sub')
          assert claims.get('aud') == os.environ['OIDC_AUDIENCE'], claims.get('aud')
          assert claims.get('ref') == 'refs/heads/main', claims.get('ref')
          print('GITHUB_OIDC_CLAIMS=PASS')
          PY
          TOKEN_RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 \
            -X POST 'https://auth.yandex.cloud/oauth/token' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${PUBLISHER_SERVICE_ACCOUNT_ID}" \
            --data-urlencode "subject_token=${OIDC_JWT}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          IAM_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin).get("access_token", ""))' <<< "$TOKEN_RESPONSE")"
          [[ -n "$IAM_TOKEN" ]] || { echo "Yandex token exchange returned no access_token" >&2; exit 1; }
          echo "::add-mask::$IAM_TOKEN"
          echo 'YANDEX_OIDC_TOKEN_EXCHANGE=PASS'
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 \
            -H "Authorization: Bearer ${IAM_TOKEN}" \
            "${REGISTRY_API}/images?registryId=${REGISTRY_ID}&pageSize=1" >/dev/null
          echo 'YANDEX_REGISTRY_READ=PASS'
          echo 'YANDEX_OIDC_END_TO_END=PASS'
