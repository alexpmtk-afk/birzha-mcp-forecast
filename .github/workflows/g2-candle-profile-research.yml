name: G2 Candle Profile Research
on:
  push:
    branches: [codex/g2-candle-profile-research-20261011]
  pull_request:
    branches: [codex/g2-six-market-data-diagnostics-20261011]
permissions:
  contents: read
concurrency:
  group: g2-candle-profile-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -p no:cacheprovider
      - run: python scripts/repository_preflight.py

  audit-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout this exact audit head without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Merge pinned colleague and research heads locally without push
        shell: bash
        run: |
          set -euo pipefail
          audit_head="$(git rev-parse HEAD)"
          git fetch --no-tags origin 008803a7bb5475f767e928f7d813bd7e754a7145 82af27e1f9d79f02f8062c5756047fe1fb35ef20
          git -c user.name=Audit-Runner -c user.email=runner@invalid.example merge --no-ff --no-edit 008803a7bb5475f767e928f7d813bd7e754a7145
          git -c user.name=Audit-Runner -c user.email=runner@invalid.example merge --no-ff --no-edit 82af27e1f9d79f02f8062c5756047fe1fb35ef20
          test -z "$(git diff --name-only --diff-filter=U)"
          git merge-base --is-ancestor "$audit_head" HEAD
          git merge-base --is-ancestor 008803a7bb5475f767e928f7d813bd7e754a7145 HEAD
          git merge-base --is-ancestor 82af27e1f9d79f02f8062c5756047fe1fb35ef20 HEAD
          echo "EXACT_HEAD_COMPATIBILITY_ONLY;NO_PUSH;NO_MOEX_CAPTURE;NO_HOME"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Full offline suite on the combined tree
        run: python -m pytest -q -p no:cacheprovider
      - run: python scripts/repository_preflight.py
      - name: Preserve the existing release refusal
        run: python -m scripts.g2_release_gate --manifest docs/G2_RELEASE_GATE_20261010.json --summary
