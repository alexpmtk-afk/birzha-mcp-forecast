name: M23 Capacity Audit Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m23-capacity-audit-once.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: m23-capacity-audit-once
  cancel-in-progress: false

env:
  APP_SHA: 6292eb25d270114a7849676adcd1208c45020bb1
  OIDC_AUDIENCE: https://github.com/alexpmtk-afk
  PUBLISHER_SERVICE_ACCOUNT_ID: ajessiopotr4eq1g2c2v
  EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/birzha-mcp-forecast@1350648480:ref:refs/heads/main
  YDB_CONNECTION_STRING: grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1gi4pr9msenirafh2c7/etnes7omhgut11oulsd5

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mint read-only Yandex IAM token through GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Refusing OIDC audit outside main" >&2; exit 1; }
          ENCODED_AUDIENCE="$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe=""))')"
          SEP='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && SEP='&'
          RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${SEP}audience=${ENCODED_AUDIENCE}")"
          OIDC_JWT="$(python -c 'import json,sys; print(json.load(sys.stdin).get("value", ""))' <<< "$RESPONSE")"
          test -n "$OIDC_JWT"
          echo "::add-mask::$OIDC_JWT"
          python - "$OIDC_JWT" <<'PY'
          import base64, json, os, sys
          payload=sys.argv[1].split('.')[1]; payload += '=' * (-len(payload) % 4)
          claims=json.loads(base64.urlsafe_b64decode(payload))
          assert claims.get('sub') == os.environ['EXPECTED_OIDC_SUBJECT'], claims.get('sub')
          assert claims.get('aud') == os.environ['OIDC_AUDIENCE'], claims.get('aud')
          assert claims.get('ref') == 'refs/heads/main', claims.get('ref')
          print('GITHUB_OIDC_CLAIMS=PASS')
          PY
          TOKEN_RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 \
            -X POST 'https://auth.yandex.cloud/oauth/token' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth-token-type:access_token' \
            --data-urlencode "audience=${PUBLISHER_SERVICE_ACCOUNT_ID}" \
            --data-urlencode "subject_token=${OIDC_JWT}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          IAM_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin).get("access_token", ""))' <<< "$TOKEN_RESPONSE")"
          test -n "$IAM_TOKEN"
          echo "::add-mask::$IAM_TOKEN"
          printf '%s' "$IAM_TOKEN" > "$RUNNER_TEMP/yandex-iam-token"
          chmod 600 "$RUNNER_TEMP/yandex-iam-token"
          echo 'YANDEX_OIDC_TOKEN_EXCHANGE=PASS'

      - name: Checkout exact tested M23 application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: alexpmtk-afk/birzha-mcp-forecast
          ref: ${{ env.APP_SHA }}
          path: app
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify exact source and install
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = "$APP_SHA"
          python -m pip install --disable-pip-version-check -e ./app
          echo "APP_SOURCE_SHA=PASS $APP_SHA"

      - name: Run sealed read-only capacity audit
        shell: bash
        run: |
          set -euo pipefail
          cd app
          python scripts/run_authorized_ydb_capacity_audit.py \
            --connection-string "$YDB_CONNECTION_STRING" \
            --token-file "$RUNNER_TEMP/yandex-iam-token" \
            --development-start 2021-01-01 \
            --split-date 2022-12-31 \
            --holdout-end 2024-12-31 \
            --step-sessions 5 \
            --max-points 80 \
            --artifact "$RUNNER_TEMP/ydb_capacity_audit.json"

      - name: Summarize capacity artifact
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/ydb_capacity_audit.json" ]]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'ydb_capacity_audit.json'
          d=json.loads(p.read_text())
          summary={k:d.get(k) for k in ('run_status','model_status','holdout_evaluated','holdout_sealed','minimum_acceptance_observations')}
          summary['readiness_status']=(d.get('readiness') or {}).get('status')
          summary['development_capacity']=d.get('development_capacity',{})
          summary['holdout_capacity']=d.get('holdout_capacity',{})
          summary['capacity_shortfall']=d.get('capacity_shortfall',{})
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY
          else
            echo 'CAPACITY_ARTIFACT=MISSING'
          fi

      - name: Upload durable capacity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: birzha-m23-ydb-capacity-audit
          path: ${{ runner.temp }}/ydb_capacity_audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup ephemeral IAM token
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yandex-iam-token"
