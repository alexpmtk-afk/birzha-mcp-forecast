name: SBER isolated read-only research adapter CI
on:
  push:
    branches: [chatgpt/sber-research-readonly-adapter-20261013]
    paths:
      - src/birzha/application/sber_research_read_only.py
      - tests/test_sber_research_read_only.py
      - docs/SBER_RESEARCH_READ_ONLY_INTEGRATION.md
      - .github/workflows/g2-sber-research-readonly-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install isolated package and unit test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Reader tests - only disposable DuckDB, no MOEX, no secret files
        run: python -m pytest -q tests/test_sber_research_read_only.py tests/test_research_intraday_archive.py tests/test_g2_sber_history_batch.py
      - name: Whole repository offline regression
        run: python -m pytest -q
