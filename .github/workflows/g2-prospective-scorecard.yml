name: G2 prospective scorecard

on:
  push:
    branches:
      - codex/g2-prospective-scorecard-20261011
  pull_request:
    branches:
      - codex/g2-candle-profile-research-20261011
    paths:
      - "scripts/g2_prospective_baseline_scorecard.py"
      - "scripts/g2_prospective_scorecard_review.py"
      - "scripts/g2_prospective_scorecard_batch.py"
      - "tests/test_g2_prospective_baseline_scorecard.py"
      - "tests/test_g2_scorecard_writer_compatibility.py"
      - "docs/G2_PROSPECTIVE_BASELINE_SCORECARD_20261011.md"
      - ".github/workflows/g2-prospective-scorecard.yml"

permissions:
  contents: read

concurrency:
  group: g2-prospective-scorecard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install duckdb==1.5.5 pytest==8.4.1
      - name: Check scorecard syntax
        run: python -m py_compile scripts/g2_prospective_baseline_scorecard.py scripts/g2_prospective_scorecard_review.py scripts/g2_prospective_scorecard_batch.py tests/test_g2_prospective_baseline_scorecard.py
      - name: Check SQLite and DuckDB scorecards
        run: python -m pytest -q tests/test_g2_prospective_baseline_scorecard.py

  current-writer-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact writer version from PR 202
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5f623a1d828ce5eb68adb468d0e047845b78fcf0
          path: peer-code
          persist-credentials: false
      - name: Checkout this exact scorecard version
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: scorecard-code
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Combine only scorecard files inside disposable runner
        run: |
          cp scorecard-code/scripts/g2_prospective_baseline_scorecard.py peer-code/scripts/
          cp scorecard-code/scripts/g2_prospective_scorecard_review.py peer-code/scripts/
          cp scorecard-code/scripts/g2_prospective_scorecard_batch.py peer-code/scripts/
          cp scorecard-code/tests/test_g2_prospective_baseline_scorecard.py peer-code/tests/
          cp scorecard-code/tests/test_g2_scorecard_writer_compatibility.py peer-code/tests/
          python -m pip install -e './peer-code[dev]'
      - name: Require actual writer and run scorecard compatibility tests
        working-directory: peer-code
        run: |
          python -c "from birzha.storage.prospective_single_store import SingleDuckDBProspectiveStagingJournal"
          python -m pytest -q tests/test_g2_prospective_baseline_scorecard.py tests/test_g2_scorecard_writer_compatibility.py
      - name: Check entire writer line with the scorecard package
        working-directory: peer-code
        run: python -m pytest -q

  full-base-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install complete project test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check entire scorecard base line
        run: python -m pytest -q
