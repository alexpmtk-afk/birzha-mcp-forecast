name: GOLD D1 missing tail exact-contract research

on:
  push:
    branches:
      - chatgpt/gold-d1-missing-2026-09-10-20261014
    paths:
      - .github/workflows/gold-d1-missing-2026-09-oct-20261014.yml

permissions:
  contents: read

jobs:
  gold-d1-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install existing MOEX provider
        run: python -m pip install -e .

      - name: Capture only GOLD D1 2026-09-16 through 2026-10-13
        id: capture
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p research/GOLD/D1-tail
          set -o pipefail
          python -m scripts.gold_d1_missing_tail_capture \
            2>&1 | tee research/GOLD/D1-tail/collector.log

      - name: Preserve D1 DuckDB and readback source evidence even on partial/error
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GOLD-D1-missing-tail-20260916-20261013
          path: research/GOLD/D1-tail/
          retention-days: 30
          if-no-files-found: error

      - name: Require successful observed source receipt
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/GOLD/D1-tail/manifest.json")
          if not p.is_file():
              raise SystemExit("D1_MISSING_MANIFEST")
          d = json.loads(p.read_text(encoding="utf-8"))
          print("GOLD_D1_STATUS", d.get("status"))
          print("ROW_COUNT", d.get("rows"))
          print("SHA256", d.get("sha256"))
          if d.get("status") != "SOURCE_RECEIPT_NOT_PIT_VERIFIED":
              raise SystemExit("D1_SOURCE_PARTIAL_NOT_FULL_PASS")
          PY
