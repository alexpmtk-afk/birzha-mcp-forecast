name: Runtime M23 regression once

on:
  push:
    branches:
      - runtime/m23-regression-9e487b
    paths:
      - '.github/workflows/runtime-m23-regression-once.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact M23 candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: 9e487b470b1e2b4e3fdaef16784b6de93537f00b
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Full pytest
        run: python -m pytest -q
      - name: Compile all project Python
        run: python -m compileall -q src tests scripts
