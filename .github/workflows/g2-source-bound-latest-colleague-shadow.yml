name: G2 Current-Head Source Bound + Colleague Compatibility

on:
  push:
    branches:
      - chatgpt/g2-source-bound-latest-colleague-shadow-20261010
      - chatgpt/g2-current-release-pins-20261010
  pull_request:
    branches:
      - chatgpt/g2-source-bound-issuance-20261010
      - chatgpt/g2-source-bound-latest-colleague-shadow-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-head-three-line:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout source-bound issuer without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact issuer ancestor and fetch newest colleague heads
        shell: bash
        run: |
          git merge-base --is-ancestor 5f091403510a7af0a4c036404db7c04af959120d HEAD
          git fetch --no-tags origin +refs/heads/codex/g2-price-level-evidence-20261010:refs/remotes/origin/g2-latest-price-level
          git fetch --no-tags origin +refs/heads/codex/g2-regime-development-results-20261010:refs/remotes/origin/g2-regime-audit
          test "$(git rev-parse refs/remotes/origin/g2-latest-price-level)" = "0a55a9607642cd1428a396c9d69ff404c7d0578f" || {
            echo "::error::COLLEAGUE_LEVEL_HEAD_MOVED"; exit 3;
          }
          test "$(git rev-parse refs/remotes/origin/g2-regime-audit)" = "82af27e1f9d79f02f8062c5756047fe1fb35ef20" || {
            echo "::error::COLLEAGUE_REGIME_HEAD_MOVED"; exit 4;
          }
      - name: Only local temporary no-push merge of latest three lines
        shell: bash
        run: |
          git -c user.name=Ephemeral-CI -c user.email=ci@example.invalid merge --no-ff --no-edit refs/remotes/origin/g2-latest-price-level
          git -c user.name=Ephemeral-CI -c user.email=ci@example.invalid merge --no-ff --no-edit refs/remotes/origin/g2-regime-audit
          test -z "$(git diff --name-only --diff-filter=U)"
          for sha in 5f091403510a7af0a4c036404db7c04af959120d 0a55a9607642cd1428a396c9d69ff404c7d0578f 82af27e1f9d79f02f8062c5756047fe1fb35ef20; do
            git merge-base --is-ancestor "$sha" HEAD
          done
          echo "LOCAL_EPHEMERAL_MERGE=PASS;NO_PUSH=TRUE"
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install combined project dependencies
        run: python -m pip install -e '.[dev]'
      - name: Focus on source issuance and latest admission/price contract
        run: |
          python -m pytest -q tests/test_g2_source_bound_issuance.py tests/test_g2_freeze_real_forecast_from_source_receipts.py tests/test_baseline_decision_contract.py tests/test_price_level_evidence.py tests/test_g2_live_issuance_semantics.py tests/test_g2_release_gate.py
      - name: Full combined project pytest
        run: python -m pytest -q
      - name: Compile all affected combined code
        run: python -m compileall -q src/birzha/application src/birzha/domain src/birzha/storage scripts/g2_freeze_real_forecast_from_source_receipts.py
      - name: Confirm release stays blocked despite combined code PASS
        run: |
          python -m scripts.g2_release_gate --manifest docs/G2_RELEASE_GATE_20261010.json --summary
          echo "THESE LATEST-HEAD COMPATIBILITY TESTS ARE NOT PROD RELEASE AUTHORIZATION"
