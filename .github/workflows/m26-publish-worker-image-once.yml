name: M26 Publish Worker Image Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m26-publish-worker-image-once.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: birzha-m26-worker-image-once
  cancel-in-progress: false

env:
  APP_SHA: bca9de131e806b1a77253a1c1249bd60e634b741
  REGISTRY_ID: crpk5qvf4p7kcqil2u3v
  PUBLISHER_SERVICE_ACCOUNT_ID: ajessiopotr4eq1g2c2v
  OIDC_AUDIENCE: https://github.com/alexpmtk-afk
  EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/birzha-mcp-forecast@1350648480:ref:refs/heads/main
  IMAGE_NAME: birzha-mcp-forecast
  REGISTRY_API: https://container-registry.api.cloud.yandex.net/container-registry/v1

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Guard exact one-shot publication
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "push" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_REPOSITORY" == "alexpmtk-afk/birzha-mcp-forecast" ]]
          [[ "$APP_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact verified M26 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: alexpmtk-afk/birzha-mcp-forecast
          ref: ${{ env.APP_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact source and M26 policy
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$APP_SHA" ]]
          grep -Fq 'D1_ARCHIVE_START = "2021-01-01"' src/birzha/application/history_policy.py
          grep -Fq 'PERSISTENT_PRICE_TIMEFRAMES = ("D1",)' src/birzha/application/history_policy.py
          grep -Fq 'BRIDGE_PROTOCOL_VERSION = 1' src/birzha/storage/google_sheets_bridge.py
          grep -Fq 'BRIDGE_RELEASE = "1.0.0"' src/birzha/storage/google_sheets_bridge.py
          grep -Fq 'BRIDGE_PROJECT_ID = "birzha"' src/birzha/storage/google_sheets_bridge.py
          TARGET_TAG="m26-d1-archive-git-${APP_SHA}"
          TARGET_REPOSITORY="${REGISTRY_ID}/${IMAGE_NAME}"
          echo "TARGET_TAG=$TARGET_TAG" >> "$GITHUB_ENV"
          echo "TARGET_REPOSITORY=$TARGET_REPOSITORY" >> "$GITHUB_ENV"
          echo "TARGET_IMAGE=cr.yandex/${TARGET_REPOSITORY}:${TARGET_TAG}" >> "$GITHUB_ENV"
          echo "LOCAL_IMAGE=birzha-m26-worker:source-${APP_SHA}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Full regression before image build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pytest -q
          python -m compileall -q src tests scripts

      - name: Assert production worker wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          worker=Path('src/birzha/worker.py').read_text()
          runtime=Path('src/birzha/storage/ydb_runtime_storage.py').read_text()
          assert 'start_d1_archive_refresh' in worker
          assert 'D1_ARCHIVE_START' in worker
          assert 'latest_safe_d1_calendar_date' in worker
          assert 'YdbRuntimeHistoricalCandleStore' in worker
          assert 'YdbRuntimeSlotPacingGate' in worker
          assert 'MarketMirrorSyncService' in worker
          assert 'GoogleSheetsBridge' in worker
          assert 'def _init_schema(self) -> None:' in runtime
          assert 'require_persistent_price_timeframe' in runtime
          print('M26_WORKER_WIRING=PASS')
          PY

      - name: Build exact immutable M26 image
        shell: bash
        run: docker build --pull --label "org.opencontainers.image.revision=${APP_SHA}" -t "$LOCAL_IMAGE" .

      - name: Exchange GitHub OIDC for Yandex IAM token
        shell: bash
        run: |
          set -euo pipefail
          ENCODED_AUDIENCE="$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe=""))')"
          SEP='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && SEP='&'
          OIDC_RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${SEP}audience=${ENCODED_AUDIENCE}")"
          OIDC_JWT="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$OIDC_RESPONSE")"
          echo "::add-mask::$OIDC_JWT"
          python - "$OIDC_JWT" <<'PY'
          import base64,json,os,sys
          p=sys.argv[1].split('.')[1]; p += '=' * (-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          assert c.get('sub')==os.environ['EXPECTED_OIDC_SUBJECT'], c.get('sub')
          assert c.get('aud')==os.environ['OIDC_AUDIENCE'], c.get('aud')
          assert c.get('ref')=='refs/heads/main', c.get('ref')
          print('M26_PUBLISHER_OIDC_CLAIMS=PASS')
          PY
          RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -X POST 'https://auth.yandex.cloud/oauth/token' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' --data-urlencode "audience=${PUBLISHER_SERVICE_ACCOUNT_ID}" --data-urlencode "subject_token=${OIDC_JWT}" --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          IAM_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$RESPONSE")"
          test -n "$IAM_TOKEN"
          echo "::add-mask::$IAM_TOKEN"
          printf '%s' "$IAM_TOKEN" > "$RUNNER_TEMP/yandex-iam-token"

      - name: Assert immutable target tag is absent
        shell: bash
        run: |
          set -euo pipefail
          IAM_TOKEN="$(cat "$RUNNER_TEMP/yandex-iam-token")"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${IAM_TOKEN}" "${REGISTRY_API}/images?registryId=${REGISTRY_ID}&pageSize=1000" -o "$RUNNER_TEMP/registry-before.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'registry-before.json').read_text())
          assert not d.get('nextPageToken')
          hits=[x for x in d.get('images',[]) if os.environ['TARGET_TAG'] in (x.get('tags') or [])]
          assert not hits, 'immutable M26 tag already exists'
          print('M26_WORKER_TARGET_TAG_ABSENT=PASS')
          PY

      - name: Push immutable M26 worker image
        shell: bash
        run: |
          set -euo pipefail
          IAM_TOKEN="$(cat "$RUNNER_TEMP/yandex-iam-token")"
          D="$RUNNER_TEMP/docker-config"; mkdir -p "$D"; chmod 0700 "$D"
          printf '%s' "$IAM_TOKEN" | docker --config "$D" login --username iam --password-stdin cr.yandex >/dev/null
          docker tag "$LOCAL_IMAGE" "$TARGET_IMAGE"
          docker --config "$D" push "$TARGET_IMAGE"

      - name: Verify immutable digest and write evidence
        shell: bash
        run: |
          set -euo pipefail
          IAM_TOKEN="$(cat "$RUNNER_TEMP/yandex-iam-token")"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${IAM_TOKEN}" "${REGISTRY_API}/images?registryId=${REGISTRY_ID}&pageSize=1000" -o "$RUNNER_TEMP/registry-after.json"
          mkdir -p artifacts
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'registry-after.json').read_text())
          assert not d.get('nextPageToken')
          m=[x for x in d.get('images',[]) if x.get('name')==os.environ['TARGET_REPOSITORY'] and os.environ['TARGET_TAG'] in (x.get('tags') or [])]
          assert len(m)==1, len(m)
          digest=m[0].get('digest','')
          assert digest.startswith('sha256:') and len(digest)==71, digest
          e={'schema':'BIRZHA_M26_WORKER_IMAGE_V1','source_sha':os.environ['APP_SHA'],'tag':os.environ['TARGET_IMAGE'],'digest':digest,'immutable_url':f"cr.yandex/{os.environ['TARGET_REPOSITORY']}@{digest}"}
          Path('artifacts/m26_worker_image.json').write_text(json.dumps(e,indent=2,sort_keys=True)+'\n')
          print('M26_WORKER_IMAGE='+json.dumps(e,sort_keys=True))
          print('M26_WORKER_IMAGE_VERIFY=PASS')
          PY

      - name: Upload durable image evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: birzha-m26-worker-image
          path: artifacts/m26_worker_image.json
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup authentication
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/yandex-iam-token" "$RUNNER_TEMP/docker-config" "$RUNNER_TEMP/registry-before.json" "$RUNNER_TEMP/registry-after.json"