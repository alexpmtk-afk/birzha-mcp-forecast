name: G2 Forecast Research Wiring — Technical Only

on:
  push:
    branches:
      - chatgpt/g2-unified-forecast-research-wiring-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  technical-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact research revision, no credential persistence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require corrected level-research ancestor
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 80deb7a89be826cf756afaf5d289e83f56d60a67 HEAD
          echo "CORRECTED_LEVEL_HISTORY_ANCESTRY=PASS"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install project test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Technical interface and safety tests only — NO backtest
        run: |
          python -m pytest -q tests/test_g2_factor_fusion_research.py tests/test_forecast_research_wiring.py tests/test_g2_control_holding.py tests/test_g2_level_route.py tests/test_g2_alignment15_proposal.py tests/test_g2_market_state_classifier.py
      - name: Syntax check of shared research sources
        run: python -m compileall -q src/birzha/application/g2_factor_fusion_research.py src/birzha/application/forecast_research.py src/birzha/application/market_structure_facts.py
      - name: Confirm no new MCP registration, journal or trading writes
        shell: bash
        run: |
          set -euo pipefail
          if grep -En '@mcp.tool|\.create_and_save\(|\.append\(|\.execute_order\(|\.place_order\(' src/birzha/application/forecast_research.py src/birzha/application/g2_factor_fusion_research.py; then
            echo "::error::RESEARCH_MODULE_SIDE_EFFECT_TOKEN_FOUND"
            exit 1
          fi
          echo "NO_MCP_REGISTRATION=true;NO_FORECAST_BACKTEST=true;NO_STORAGE_WRITES=true"
