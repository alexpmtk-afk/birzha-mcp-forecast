name: BR missing 2026-06 to 2026-10 controlled source archive
on:
  push:
    branches: [chatgpt/br-source-capture-20261015]
    paths:
      - .github/workflows/br-missing-2026-06-10-capture.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - {year: 2026, month: "06"}
          - {year: 2026, month: "07"}
          - {year: 2026, month: "08"}
          - {year: 2026, month: "09"}
          - {year: 2026, month: "10"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - name: Capture exact BR contracts with source governor
        shell: bash
        run: |
          mkdir -p research/BR/${{ matrix.year }}-${{ matrix.month }}
          set +e
          python -m scripts.g2_br_month_capture_20261015 --year ${{ matrix.year }} --month ${{ matrix.month }} --output research/BR/${{ matrix.year }}-${{ matrix.month }} 2>&1 | tee research/BR/${{ matrix.year }}-${{ matrix.month }}/source_capture.log
          printf 'collector_exit_code=%s\n' "${PIPESTATUS[0]}" > research/BR/${{ matrix.year }}-${{ matrix.month }}/collector_status.txt
          exit 0
      - name: Validate source and abort matrix on real upstream failure
        run: |
          python - <<'PY'
          import pathlib,hashlib,csv,json
          b=pathlib.Path('research/BR')
          dirs=[x for x in b.iterdir() if x.is_dir()]
          assert len(dirs)==1
          p=dirs[0]
          assert (p/'source_quality.json').exists()
          q=json.loads((p/'source_quality.json').read_text())
          for line in (p/'SHA256SUMS.txt').read_text().splitlines():
              sha,name=line.split('  ')
              assert hashlib.sha256((p/name).read_bytes()).hexdigest()==sha
          with (p/'verified_sheet_rows.csv').open(newline='') as f:rows=list(csv.reader(f))
          assert rows and len(rows)==sum(q['rows'].values()) and len(set(r[0] for r in rows))==len(rows)
          assert all(len(r)==20 and r[0].startswith('BR|') and r[8].startswith('BR') for r in rows)
          if any(d['status']=='UPSTREAM_TEMPORARILY_UNAVAILABLE' for d in q['days']):
              raise RuntimeError('UPSTREAM_TEMPORARILY_UNAVAILABLE: stop future month jobs')
          print(json.dumps({'status':'VERIFIED_SOURCE_WITH_CALENDAR_UNATTESTED','month':p.name,'rows':q['rows'],'source_days':q['source_days'],'errors':q['errors']}))
          PY
      - name: Preserve authenticated monthly source even after error
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: br-month-${{ matrix.year }}-${{ matrix.month }}-real-source
          path: research/BR/${{ matrix.year }}-${{ matrix.month }}/
          if-no-files-found: warn
          retention-days: 30
