name: M22 regression and backfill

on:
  push:
    branches: [m22-gold-futures-root]

permissions:
  contents: read

concurrency:
  group: m22-regression-backfill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-regression:
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Run full regression suite
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pytest -q
          python -m compileall -q src tests scripts

  validate-and-backfill:
    runs-on: [self-hosted, Windows, X64, codex-bridge-admin]
    timeout-minutes: 180
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Run regression suite
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $python = 'C:\Users\Win10_Game_OS\AppData\Local\Programs\Python\Python313\python.exe'
          & $python -m pip install --disable-pip-version-check -e '.[dev]'
          & $python -m pytest -q
          & $python -m compileall -q src tests scripts
      - name: Resume validation-range YDB history backfill
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path = 'C:\Users\Win10_Game_OS\yandex-cloud\bin;' + $env:Path
          where.exe yc
          $python = 'C:\Users\Win10_Game_OS\AppData\Local\Programs\Python\Python313\python.exe'
          $connection = 'grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1gi4pr9msenirafh2c7/etnes7omhgut11oulsd5'
          & $python scripts/run_authorized_ydb_backfill.py --connection-string $connection --from-date 2025-01-01 --till-date 2026-05-31 --symbols SBER,GOLD,IMOEX,RTSI,Si,BR --timeframes D1,H1,M15
