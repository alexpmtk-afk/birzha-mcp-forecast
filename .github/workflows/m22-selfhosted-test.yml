name: M22 self-hosted regression

on:
  push:
    branches: [m22-gold-futures-root]

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, Windows, X64, codex-bridge-service]
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Run regression suite
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $python = 'C:\Users\Win10_Game_OS\AppData\Local\Programs\Python\Python313\python.exe'
          & $python -m pip install --disable-pip-version-check -e '.[dev]'
          & $python -m pytest -q
          & $python -m compileall -q src tests scripts
