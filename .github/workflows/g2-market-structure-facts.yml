name: G2 Observable Market Structure Facts
on:
  push:
    branches:
      - chatgpt/g2-observable-market-structure-facts-20261016
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  research-facts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Market Structure causal tests
        run: python -m pytest -q -p no:cacheprovider tests/test_market_structure_facts.py
      - name: Full regression
        run: python -m pytest -q -p no:cacheprovider
      - name: Repository preflight
        run: python scripts/repository_preflight.py
