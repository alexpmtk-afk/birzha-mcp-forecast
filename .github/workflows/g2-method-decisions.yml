name: G2 Forecast Method Decisions Registry
on:
  push:
    branches:
      - chatgpt/g2-method-disposition-registry-20261016
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  readonly-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Test registry semantics
        run: python -m pytest -q -p no:cacheprovider tests/test_method_registry.py
      - name: Test MCP tool registration without starting HOME
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path("src/birzha/mcp/server.py").read_text()
          assert '@mcp.tool(' in text and 'name="methods.registry"' in text
          assert 'return read_method_decisions(method_id=method_id)' in text
          from birzha.application.method_registry import read_method_decisions
          assert read_method_decisions()["approved_predictive_methods"] == []
          print("READONLY_METHOD_REGISTRY_ADAPTER=PASS")
          PY
      - name: Full existing regression
        run: python -m pytest -q -p no:cacheprovider
      - name: Repository preflight
        run: python scripts/repository_preflight.py
