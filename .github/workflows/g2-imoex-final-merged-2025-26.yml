name: G2 IMOEX final merged H1 M15 2025 through 2026-10-12
on:
  push:
    branches: [chatgpt/g2-imoex-complete-history-to-date-20261013]
    paths:
      - .github/workflows/g2-imoex-final-merged-2025-26.yml
permissions:
  contents: read
  actions: read
jobs:
  combine-22-existing-saved-months:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Verify merge reproducibility and checksum refusal offline
        run: python -m pytest -q tests/test_g2_imoex_merge_research_months.py
      - name: Reuse 22 saved month partitions (no MOEX requests)
        env:
          GH_TOKEN: "${{ github.token }}"
        shell: bash
        run: |
          bash scripts/g2_imoex_download_saved_months.sh /tmp/imoex_all_sources
      - name: Verify every source and merge exact-contract H1/M15 into one DuckDB
        run: |
          mkdir -p research/IMOEX
          python -m scripts.g2_imoex_merge_research_months \
            --source-root /tmp/imoex_all_sources \
            --target research/IMOEX/birzha_intraday_research_2025_2026.duckdb \
            --report research/IMOEX/IMOEX_2025-01_to_2026-10-12_CONSOLIDATED.json
      - name: Final physical database quality and SHA256 inventory
        run: |
          cd research/IMOEX
          sha256sum birzha_intraday_research_2025_2026.duckdb \
                    IMOEX_2025-01_to_2026-10-12_CONSOLIDATED.json \
            > IMOEX_2025-2026_SHA256SUMS.txt
          du -h birzha_intraday_research_2025_2026.duckdb
          ls -al
      - name: Retain ONE consolidated actual market data archive and proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imoex-2025-2026-10-12-consolidated-h1-m15
          path: research/IMOEX/
          if-no-files-found: error
          retention-days: 30
