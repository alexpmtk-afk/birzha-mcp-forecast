name: G2 Historical Revision Content-Hash Safety

on:
  push:
    branches:
      - chatgpt/g2-revision-content-integrity-20261010
  pull_request:
    branches:
      - chatgpt/g2-post-maturity-outcome-readiness-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install current project dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify version integrity and T0 negative cases
        run: |
          python -m pytest -q tests/test_g2_revision_content_integrity.py tests/test_historical_candle_finality_projection.py tests/test_historical_legacy_revision_integrity.py tests/test_stored_market_data_version_view.py tests/test_decision_cutoff_forecast_input.py
      - name: Full repository pytest
        run: python -m pytest -q
      - name: Compile affected source and tests
        run: python -m compileall -q src/birzha/storage/historical_store.py tests/test_g2_revision_content_integrity.py
