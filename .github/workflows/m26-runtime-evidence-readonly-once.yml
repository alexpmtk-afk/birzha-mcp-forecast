name: M26 Runtime Evidence Readonly Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m26-runtime-evidence-readonly-once.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: birzha-m26-runtime-evidence-readonly-once
  cancel-in-progress: false

env:
  APP_SHA: bca9de131e806b1a77253a1c1249bd60e634b741
  PUBLISHER_SERVICE_ACCOUNT_ID: ajessiopotr4eq1g2c2v
  OIDC_AUDIENCE: https://github.com/alexpmtk-afk
  EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/birzha-mcp-forecast@1350648480:ref:refs/heads/main
  YDB_CONNECTION_STRING: grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1gi4pr9msenirafh2c7/etnes7omhgut11oulsd5

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.APP_SHA }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install YDB client dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check -e .

      - name: Mint read-only YDB access token
        shell: bash
        run: |
          set -euo pipefail
          A="$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe=""))')"
          S='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && S='&'
          R="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${S}audience=${A}")"
          J="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$R")"
          echo "::add-mask::$J"
          python - "$J" <<'PY'
          import base64,json,os,sys
          p=sys.argv[1].split('.')[1]; p += '='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          assert c.get('sub')==os.environ['EXPECTED_OIDC_SUBJECT']
          assert c.get('aud')==os.environ['OIDC_AUDIENCE']
          assert c.get('ref')=='refs/heads/main'
          PY
          X="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -X POST 'https://auth.yandex.cloud/oauth/token' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' --data-urlencode "audience=${PUBLISHER_SERVICE_ACCOUNT_ID}" --data-urlencode "subject_token=${J}" --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          T="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$X")"
          test -n "$T"
          echo "::add-mask::$T"
          umask 077
          printf '%s' "$T" > "$RUNNER_TEMP/ydb-token"
          echo 'M26_READONLY_AUTH=PASS'

      - name: Inspect latest archive workflow and stored D1 coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import ydb

          token=(Path(os.environ['RUNNER_TEMP'])/'ydb-token').read_text()
          driver=ydb.Driver(
              connection_string=os.environ['YDB_CONNECTION_STRING'],
              credentials=ydb.AccessTokenCredentials(token),
          )
          driver.wait(timeout=10, fail_fast=True)
          pool=ydb.QuerySessionPool(driver)

          def rows(result):
              out=[]
              for rs in result or []:
                  for row in getattr(rs,'rows',[]) or []:
                      out.append(row)
              return out
          def val(row,key):
              if isinstance(row,dict): return row.get(key)
              try: return row[key]
              except Exception: return getattr(row,key,None)

          runs=rows(pool.execute_with_retries("""
              SELECT workflow_id, kind, stage, status, created_at, updated_at, last_error
              FROM `orchestration_runs`
              WHERE kind = 'D1_ARCHIVE_REFRESH_V1'
              ORDER BY updated_at DESC, workflow_id DESC
              LIMIT 5;
          """))
          print('M26_D1_WORKFLOW_COUNT=' + str(len(runs)))
          latest=None
          if runs:
              latest=runs[0]
              safe={k:str(val(latest,k) or '') for k in ('workflow_id','kind','stage','status','created_at','updated_at','last_error')}
              print('M26_LATEST_D1_WORKFLOW=' + json.dumps(safe,sort_keys=True,ensure_ascii=False))
              wid=safe['workflow_id'].replace("'","''")
              acts=rows(pool.execute_with_retries(f"""
                  SELECT sequence, kind, status, attempt, max_attempts, payload_json, evidence_json, last_error
                  FROM `orchestration_actions`
                  WHERE workflow_id = '{wid}'
                  ORDER BY sequence, action_id;
              """))
              for row in acts:
                  payload={}
                  evidence={}
                  try: payload=json.loads(str(val(row,'payload_json') or '{}'))
                  except Exception: pass
                  try: evidence=json.loads(str(val(row,'evidence_json') or '{}'))
                  except Exception: pass
                  item={
                      'sequence':int(val(row,'sequence') or 0),
                      'kind':str(val(row,'kind') or ''),
                      'status':str(val(row,'status') or ''),
                      'attempt':int(val(row,'attempt') or 0),
                      'max_attempts':int(val(row,'max_attempts') or 0),
                      'symbol':str(payload.get('symbol') or ''),
                      'timeframe':str(payload.get('timeframe') or ''),
                      'from_date':str(payload.get('from_date') or ''),
                      'till_date':str(payload.get('till_date') or ''),
                      'last_error':str(val(row,'last_error') or ''),
                      'evidence_status':str(evidence.get('status') or ''),
                  }
                  mm=evidence.get('market_mirror') if isinstance(evidence,dict) else None
                  if isinstance(mm,dict):
                      item['mirror_status']=str(mm.get('status') or '')
                  print('M26_D1_ACTION=' + json.dumps(item,sort_keys=True,ensure_ascii=False))

          syms=('SBER','Si','BR','GOLD','IMOEX','RTSI')
          for sym in syms:
              q="""
                  DECLARE $symbol AS Utf8;
                  SELECT MIN(trade_date) AS first_date, MAX(trade_date) AS last_date, COUNT(*) AS cnt
                  FROM `historical_candles_sessions`
                  WHERE symbol=$symbol;
              """
              rr=rows(pool.execute_with_retries(q,{'$symbol':(sym,ydb.PrimitiveType.Utf8)}))
              r=rr[0] if rr else None
              print('M26_D1_COVERAGE=' + json.dumps({
                  'symbol':sym,
                  'first_date':str(val(r,'first_date') or '') if r else '',
                  'last_date':str(val(r,'last_date') or '') if r else '',
                  'rows':int(val(r,'cnt') or 0) if r else 0,
              },sort_keys=True))

          pool.stop()
          driver.stop(timeout=5)
          print('M26_RUNTIME_READONLY_EVIDENCE=PASS')
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ydb-token"
