name: SiZ6 2026-10-12 public MOEX read-only source diagnostic
on:
  push:
    branches: [chatgpt/siz6-readonly-moex-20261012-transport-audit]
    paths:
      - .github/workflows/siz6-20261012-readonly-source-diagnostic.yml
permissions:
  contents: read
jobs:
  moex-siz6-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - name: Inspect only public exact SiZ6 MOEX metadata daily history and H1 M1
        run: |
          mkdir -p ./diagnostics
          python - <<'PY'
          import json
          from urllib.parse import urlencode
          from pathlib import Path
          from birzha.providers.moex_iss import MoexIssClient, ISS_BASE, MOEX_HTTP_HEADERS
          from birzha.upstream.safety import UpstreamRateLimited

          day="2026-10-12"
          ticker="SiZ6"
          client=MoexIssClient(timeout_seconds=20.0)
          cols="open,close,high,low,value,volume,begin,end"
          checks=[
            ("metadata_boards",f"/securities/{ticker}.json",{
              "iss.meta":"off","iss.only":"boards",
              "boards.columns":"secid,boardid,market,engine,is_primary,has_candles"}),
            ("rolling_si_history","/history/engines/futures/markets/forts/securities.json",{
              "iss.meta":"off","iss.only":"history",
              "history.columns":"TRADEDATE,SECID,BOARDID,ASSETCODE,VALUE,VOLUME,OPENPOSITION",
              "date":day,"assetcode":"Si"}),
            ("siz6_daily_activity",f"/history/engines/futures/markets/forts/boards/RFUD/securities/{ticker}.json",{
              "iss.meta":"off","iss.only":"history,history.cursor",
              "history.columns":"TRADEDATE,SECID,BOARDID,NUMTRADES,VOLUME,VALUE",
              "from":day,"till":day,"start":0}),
            ("siz6_h1_source",f"/engines/futures/markets/forts/boards/RFUD/securities/{ticker}/candles.json",{
              "iss.meta":"off","iss.only":"candles,candles.cursor",
              "candles.columns":cols,
              "from":day,"till":day,"interval":60,"start":0}),
            ("siz6_m1_source",f"/engines/futures/markets/forts/boards/RFUD/securities/{ticker}/candles.json",{
              "iss.meta":"off","iss.only":"candles,candles.cursor",
              "candles.columns":cols,
              "from":day,"till":day,"interval":1,"start":0})
          ]
          report={"scope":"EXACT_SiZ6_READ_ONLY_2026-10-12",
                  "api":"MOEX_PUBLIC_ISS",
                  "headers":MOEX_HTTP_HEADERS,
                  "credentials_used":False,"google_sheets_writes":False,
                  "archive_writes":False,"requests":[]}
          for label,path,params in checks:
            url=ISS_BASE+path+"?"+urlencode(params)
            record={"name":label,"url":url}
            try:
              response=client._request(path,params)
              block="boards" if label=="metadata_boards" else (
                  "history" if "history" in label or label=="siz6_daily_activity" else "candles")
              rows=client._table(response.json(),block)
              record.update({"status":"HTTP_200","block":block,
                             "rows_on_first_page":len(rows),
                             "preview":rows[:2]})
              if block=="candles":
                cur=client._table(response.json(),"candles.cursor")
                record["cursor"]=cur[:1]
            except Exception as ex:
              record.update({"status":"REQUEST_FAILED",
                             "exception":type(ex).__name__,
                             "diagnostic":str(ex)[:180],
                             "safe_reason":getattr(ex,"safe_reason",None)})
            report["requests"].append(record)
            print(json.dumps(record,ensure_ascii=False),flush=True)
          p=Path("diagnostics/SiZ6_2026-10-12_real_MOEX_probe.json")
          p.write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+"\n")
          print("SiZ6_DIAG_SUMMARY",json.dumps({
            r["name"]:{"status":r["status"],"rows_on_first_page":r.get("rows_on_first_page",0),
                       "safe_reason":r.get("safe_reason")}
            for r in report["requests"]},sort_keys=True),flush=True)
          PY
      - name: Save source response proof no secrets or historical data writes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: siz6-2026-10-12-public-iss-readonly-diagnostics
          path: diagnostics/SiZ6_2026-10-12_real_MOEX_probe.json
          if-no-files-found: error
          retention-days: 30
