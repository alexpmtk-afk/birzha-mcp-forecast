name: G2 Staging Receipt SHA Preflight

on:
  push:
    branches:
      - chatgpt/g2-pilot-receipt-preflight-20261010
  pull_request:
    branches:
      - chatgpt/g2-source-bound-issuance-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-receipt-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout feature branch without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install project with DuckDB and dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Focused staging + receipts + source-bound issuance
        run: |
          python -m pytest -q tests/test_prospective_staging_bridge.py tests/test_prospective_capture.py tests/test_g2_source_bound_issuance.py
      - name: Full repository pytest
        run: python -m pytest -q
      - name: Compile staging and receipt code
        run: python -m compileall -q src/birzha/application/prospective_staging_bridge.py tests/test_prospective_staging_bridge.py
      - name: No production release
        run: echo "STAGING_RECEIPT_PREFLIGHT_ONLY=true; NO_HOME_OR_DEPLOY=true"
