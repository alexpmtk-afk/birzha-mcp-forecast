name: G2 historical engine batch
on:
  push:
    branches: [chatgpt/g2-batch-replay-2025-26-integration-20261013]
  pull_request:
    branches: [chatgpt/g2-intraday-bulk-preflight-20261013]
    paths:
      - scripts/g2_historical_engine_batch.py
      - tests/test_g2_historical_engine_batch.py
      - docs/G2_HISTORICAL_ENGINE_BATCH_20261013.md
      - .github/workflows/g2-historical-engine-batch.yml
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Verify batch and original price engine
        run: python -m pytest -q tests/test_g2_historical_engine_batch.py tests/test_g2_forecast_historical_replay.py tests/test_forecast_engine.py tests/test_snapshot_t0.py
      - name: Full regression
        run: python -m pytest -q
