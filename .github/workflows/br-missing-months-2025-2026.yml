name: BR missing 2025-2026 months isolated historical source
on:
  push:
    branches: [chatgpt/br-source-capture-20261015]
    paths:
      - .github/workflows/br-missing-months-2025-2026.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {year: 2025, month: "01"}
          - {year: 2025, month: "02"}
          - {year: 2025, month: "03"}
          - {year: 2025, month: "04"}
          - {year: 2025, month: "05"}
          - {year: 2025, month: "07"}
          - {year: 2025, month: "08"}
          - {year: 2025, month: "09"}
          - {year: 2025, month: "10"}
          - {year: 2025, month: "11"}
          - {year: 2025, month: "12"}
          - {year: 2026, month: "01"}
          - {year: 2026, month: "02"}
          - {year: 2026, month: "03"}
          - {year: 2026, month: "04"}
          - {year: 2026, month: "05"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - name: Collect exact BR futures by day using existing source/governor
        shell: bash
        run: |
          mkdir -p research/BR/${{ matrix.year }}-${{ matrix.month }}
          set +e
          python -m scripts.g2_br_month_capture_20261015 --year ${{ matrix.year }} --month ${{ matrix.month }} --output research/BR/${{ matrix.year }}-${{ matrix.month }} 2>&1 | tee research/BR/${{ matrix.year }}-${{ matrix.month }}/source_capture.log
          printf 'collector_exit_code=%s\n' "${PIPESTATUS[0]}" > research/BR/${{ matrix.year }}-${{ matrix.month }}/collector_status.txt
          exit 0
      - name: Validate monthly source SHA, identity and schema
        run: |
          python - <<'PY'
          import pathlib,hashlib,csv,json
          base=pathlib.Path('research/BR')
          folders=[p for p in base.iterdir() if p.is_dir()]
          assert len(folders)==1
          p=folders[0]
          assert (p/'SHA256SUMS.txt').exists()
          for line in (p/'SHA256SUMS.txt').read_text().splitlines():
              sha,file=line.split('  ')
              assert hashlib.sha256((p/file).read_bytes()).hexdigest()==sha
          q=json.loads((p/'source_quality.json').read_text())
          with (p/'verified_sheet_rows.csv').open(newline='') as f: rows=list(csv.reader(f))
          assert rows and len(rows)==sum(q['rows'].values())
          assert len({row[0] for row in rows})==len(rows)
          assert all(len(row)==20 and row[0].startswith('BR|') and row[8].startswith('BR') and row[16]=='TRUE' for row in rows)
          print(json.dumps({'status':'VERIFIED_MONTHLY_SOURCE','month':p.name,'rows':q['rows'],'days':q['source_days'],'errors':q['errors']}))
          PY
      - name: Preserve original research DB, CSV, quality and SHA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: br-month-${{ matrix.year }}-${{ matrix.month }}-real-source
          path: research/BR/${{ matrix.year }}-${{ matrix.month }}/
          if-no-files-found: error
          retention-days: 30
