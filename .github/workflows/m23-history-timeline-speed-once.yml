name: M23 BR Legacy Gap Diagnostic Once

on:
  push:
    branches: [m23-ydb-model-validation]
    paths:
      - ".github/workflows/m23-history-timeline-speed-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Inspect exact legacy BR dates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from birzha.application.upstream_control import ProcessUpstreamControlPlane
          from birzha.providers.moex_iss import MoexIssClient

          client = MoexIssClient(control_plane=ProcessUpstreamControlPlane())
          security = "BRF3_2013"
          history_path = f"/history/engines/futures/markets/forts/boards/RFUD/securities/{security}.json"
          candle_path = f"/engines/futures/markets/forts/boards/RFUD/securities/{security}/candles.json"
          targets = ("2012-10-26", "2012-11-14")
          result = {"mode": "LEGACY_BR_GAP_DIAGNOSTIC", "security": security, "dates": {}}
          for day in targets:
              history = client._request(history_path, {
                  "iss.meta": "off",
                  "iss.only": "history",
                  "history.columns": "TRADEDATE,SECID,NUMTRADES,VOLUME,VALUE,OPEN,CLOSE,HIGH,LOW,WAPRICE,LASTPRICE,SETTLEPRICE",
                  "from": day,
                  "till": day,
              }).json()
              candles = client._request(candle_path, {
                  "iss.meta": "off",
                  "iss.only": "candles",
                  "candles.columns": "open,close,high,low,value,volume,begin,end",
                  "from": day,
                  "till": day,
                  "interval": 24,
              }).json()
              result["dates"][day] = {
                  "history": client._table(history, "history"),
                  "candles": client._table(candles, "candles"),
              }
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          PY
