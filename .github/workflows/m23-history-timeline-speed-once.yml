name: M23 BR Timeline Speed Once

on:
  push:
    branches: [m23-ydb-model-validation]
    paths:
      - ".github/workflows/m23-history-timeline-speed-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Measure real BR timeline
        shell: bash
        run: |
          python - <<'PY'
          import time
          from datetime import date
          from birzha.application.upstream_control import ProcessUpstreamControlPlane
          from birzha.providers.moex_history import MoexHistoricalFutureResolver
          from birzha.providers.moex_iss import MoexIssClient

          control = ProcessUpstreamControlPlane()
          resolver = MoexHistoricalFutureResolver(MoexIssClient(control_plane=control))
          started = time.monotonic()
          timeline = resolver.timeline("BR", date(2024,1,1), date(2024,1,31))
          elapsed = time.monotonic() - started
          print(f"BR_TIMELINE_ROWS={len(timeline)}")
          print(f"BR_TIMELINE_ELAPSED_SECONDS={elapsed:.3f}")
          if not timeline:
              raise SystemExit("timeline is empty")
          if elapsed > 25:
              raise SystemExit(f"corrected pacing unexpectedly slow: {elapsed:.3f}s")
          print("BR_TIMELINE_SPEED_REGRESSION=PASS")
          PY
