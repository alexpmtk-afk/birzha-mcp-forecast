name: G2 IMOEX consolidate Q1 source artifact smoke
on:
  push:
    branches: [chatgpt/g2-imoex-complete-history-to-date-20261013]
    paths:
      - .github/workflows/g2-imoex-consolidation-smoke.yml
permissions:
  contents: read
  actions: read
jobs:
  prove-source-reuse-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Verify safe merger unit tests
        run: python -m pytest -q tests/test_g2_imoex_merge_research_months.py
      - name: Download three existing real MOEX source DuckDB partitions
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          mkdir -p /tmp/imoex_parts
          gh run download 38440763073 --repo "$GITHUB_REPOSITORY" --name imoex-intraday-2025-01-duckdb --dir /tmp/imoex_parts/imoex-intraday-2025-01-duckdb
          for m in 02 03; do
            gh run download 38441296639 --repo "$GITHUB_REPOSITORY" --name "imoex-intraday-2025-${m}-duckdb" --dir "/tmp/imoex_parts/imoex-intraday-2025-${m}-duckdb"
          done
      - name: Merge H1/M15 Q1 from existing REAL archives (no MOEX)
        run: |
          mkdir -p /tmp/imoex_test_combined
          python - <<'PY'
          from pathlib import Path
          from scripts.g2_imoex_merge_research_months import merge
          report=merge(Path("/tmp/imoex_parts"),
                       Path("/tmp/imoex_test_combined/birzha_intraday_research_2025_2026.duckdb"),
                       Path("/tmp/imoex_test_combined/manifest.json"),
                       months=("2025-01","2025-02","2025-03"))
          assert report["total"]["source_days"] == 61
          assert report["total"]["H1"] == 534
          assert report["total"]["M15"] == 2074
          print("Q1 REAL PARTITION REUSE PASS:",report["total"])
          PY
