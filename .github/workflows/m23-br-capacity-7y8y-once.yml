name: M23 BR Capacity 7Y8Y Once

on:
  push:
    branches: [m23-ydb-model-validation]
    paths:
      - ".github/workflows/m23-br-capacity-7y8y-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Probe 7Y and 8Y BR capacity without model evaluation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from birzha.application.historical_data import HistoricalDataService
          from birzha.application.market_data import MarketDataService
          from birzha.application.upstream_control import ProcessUpstreamControlPlane
          from birzha.application.validation_capacity import stored_contract_capacity
          from birzha.storage.historical_store import DuckDBHistoricalCandleStore

          store = DuckDBHistoricalCandleStore(":memory:")
          try:
              history = HistoricalDataService(
                  market_data=MarketDataService.default(
                      control_plane=ProcessUpstreamControlPlane()
                  ),
                  store=store,
              )
              sync = history.sync(
                  "BR",
                  timeframe="D1",
                  from_date="2009-01-01",
                  till_date="2024-12-31",
              )
              candidates = {
                  "7y": {
                      "development": ("2011-01-01", "2017-12-31"),
                      "holdout": ("2018-01-01", "2024-12-31"),
                  },
                  "8y": {
                      "development": ("2009-01-01", "2016-12-31"),
                      "holdout": ("2017-01-01", "2024-12-31"),
                  },
              }
              result = {
                  "mode": "CAPACITY_ONLY_NO_MODEL",
                  "model_status": "NOT_EVALUATED",
                  "holdout_evaluated": False,
                  "minimum_observations": 20,
                  "sync_from": "2009-01-01",
                  "sync_till": "2024-12-31",
                  "sync_contract_count": len(sync.contracts),
                  "sync_fetched_candles": sync.fetched_candles,
                  "known_6y_result": {
                      "development": 14,
                      "holdout": 18,
                      "passes_20": False,
                  },
              }
              minimum = None
              for label, periods in candidates.items():
                  candidate_result = {}
                  candidate_pass = True
                  for stage, (start, end) in periods.items():
                      cap = stored_contract_capacity(
                          history,
                          "BR",
                          from_date=start,
                          till_date=end,
                          step_sessions=5,
                          max_points=400,
                      )
                      stage_pass = all(
                          count >= 20
                          for count in cap.non_overlapping_observations.values()
                      )
                      candidate_pass = candidate_pass and stage_pass
                      candidate_result[stage] = {
                          "from": start,
                          "till": end,
                          **cap.to_dict(),
                          "passes_20": stage_pass,
                      }
                  candidate_result["passes_20_both"] = candidate_pass
                  result[label] = candidate_result
                  if minimum is None and candidate_pass:
                      minimum = label
              result["minimum_passing_candidate"] = minimum
              print("BR_CAPACITY_7Y8Y=" + json.dumps(result, ensure_ascii=False, sort_keys=True))
          finally:
              store.close()
          PY
