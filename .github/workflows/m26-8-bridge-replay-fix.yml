name: M26.8 Bridge Replay Correlation Fix

on:
  push:
    branches: [main]
    paths:
      - "control/run-m26-8b-bridge-replay-fix.txt"

permissions:
  contents: write

concurrency:
  group: birzha-m26-8-bridge-replay-fix
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply exact protocol fix
        run: python scripts/m26_8_patch_bridge_replay.py
      - name: Full regression and compile
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pytest -q
          python -m compileall -q src tests scripts
          echo 'M26_8_FULL_REGRESSION=PASS'
      - name: Docker and MCP smoke
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -t birzha-m26-8 .
          docker run --rm -d --name birzha-m26-8-smoke -p 8080:8080 birzha-m26-8
          trap 'docker stop birzha-m26-8-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null
          python scripts/docker_smoke.py
          echo 'M26_8_DOCKER_MCP_SMOKE=PASS'
      - name: Commit only verified source and tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --porcelain -- src/birzha/storage/google_sheets_bridge.py tests/test_google_sheets_bridge_v1.py)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/birzha/storage/google_sheets_bridge.py tests/test_google_sheets_bridge_v1.py
          git commit -m 'fix: make bridge mutation replay correlation deterministic'
          git push origin HEAD:main
          echo "M26_8_COMMITTED_SHA=$(git rev-parse HEAD)"
