name: M26.8 Bridge Replay Correlation Fix

on:
  push:
    branches: [main]
    paths:
      - "control/run-m26-8-bridge-replay-fix.txt"

permissions:
  contents: write

concurrency:
  group: birzha-m26-8-bridge-replay-fix
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply exact protocol fix and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          src = Path('src/birzha/storage/google_sheets_bridge.py')
          text = src.read_text()
          old = '''    @staticmethod\n    def _stable_key(action: str, *parts: object) -> str:\n        material = "\\x00".join(str(part) for part in parts)\n        digest = hashlib.sha256(material.encode("utf-8")).hexdigest()\n        return f"birzha:{action}:{digest}"\n'''
          new = '''    @staticmethod\n    def _stable_key(action: str, *parts: object) -> str:\n        material = "\\x00".join(str(part) for part in parts)\n        digest = hashlib.sha256(material.encode("utf-8")).hexdigest()\n        # v2 deliberately rotates the Apps Script idempotency cache namespace.\n        # Older cached mutation envelopes contain request_ids generated randomly\n        # by the v1 client and cannot be safely replay-correlated.\n        return f"birzha:v2:{action}:{digest}"\n'''
          assert old in text, 'stable-key source shape changed; refusing blind patch'
          text = text.replace(old, new, 1)

          old = '''        request_id = str(uuid.uuid4())\n        body: dict[str, Any] = {\n'''
          new = '''        if idempotency_key:\n            # A mutation replayed under the same semantic idempotency key must\n            # carry the same correlation id. The bridge may replay the original\n            # response envelope; deterministic correlation keeps the strict\n            # request_id equality check valid across process restarts.\n            request_id = str(\n                uuid.uuid5(\n                    uuid.NAMESPACE_URL,\n                    f"{BRIDGE_PROJECT_ID}:{action}:{idempotency_key}",\n                )\n            )\n        else:\n            request_id = str(uuid.uuid4())\n        body: dict[str, Any] = {\n'''
          assert old in text, 'request-id source shape changed; refusing blind patch'
          text = text.replace(old, new, 1)
          src.write_text(text)

          test = Path('tests/test_google_sheets_bridge_v1.py')
          t = test.read_text()
          t = t.replace('startswith("birzha:sheet_ensure:")', 'startswith("birzha:v2:sheet_ensure:")')
          t = t.replace('startswith("birzha:sheet_abort:")', 'startswith("birzha:v2:sheet_abort:")')
          t = t.replace('startswith("birzha:") for key in mutation_keys', 'startswith("birzha:v2:") for key in mutation_keys')
          marker = 'def test_mutation_replay_uses_deterministic_request_id_and_v2_namespace'
          assert marker not in t, 'regression tests already present'
          t += r'''


def test_mutation_replay_uses_deterministic_request_id_and_v2_namespace(monkeypatch):
    b = bridge()
    bodies: list[dict[str, Any]] = []

    class FakeResponse:
        status_code = 200
        is_success = True

        def json(self):
            body = bodies[-1]
            return {
                "protocol_version": 1,
                "project_id": BRIDGE_PROJECT_ID,
                "request_id": body["request_id"],
                "action": body["action"],
                "ok": True,
                "result": {"committed": True},
            }

    class FakeClient:
        def __init__(self, *args, **kwargs):
            pass

        def __enter__(self):
            return self

        def __exit__(self, exc_type, exc, tb):
            return False

        def post(self, url, *, json, headers):
            bodies.append(dict(json))
            return FakeResponse()

    monkeypatch.setattr("birzha.storage.google_sheets_bridge.httpx.Client", FakeClient)
    key = b._stable_key("sheet_commit", "sheet-1", "D1", "digest")
    assert key.startswith("birzha:v2:sheet_commit:")
    assert b._post("sheet_commit", {"spreadsheet_id": "sheet-1"}, idempotency_key=key)["committed"] is True
    assert b._post("sheet_commit", {"spreadsheet_id": "sheet-1"}, idempotency_key=key)["committed"] is True
    assert len(bodies) == 2
    assert bodies[0]["request_id"] == bodies[1]["request_id"]
    assert bodies[0]["idempotency_key"] == bodies[1]["idempotency_key"] == key


def test_bridge_still_rejects_wrong_request_id(monkeypatch):
    b = bridge()

    class FakeResponse:
        status_code = 200
        is_success = True

        def json(self):
            return {
                "protocol_version": 1,
                "project_id": BRIDGE_PROJECT_ID,
                "request_id": "definitely-not-the-request-id",
                "action": "sheet_commit",
                "ok": True,
                "result": {"committed": True},
            }

    class FakeClient:
        def __init__(self, *args, **kwargs):
            pass

        def __enter__(self):
            return self

        def __exit__(self, exc_type, exc, tb):
            return False

        def post(self, url, *, json, headers):
            return FakeResponse()

    monkeypatch.setattr("birzha.storage.google_sheets_bridge.httpx.Client", FakeClient)
    key = b._stable_key("sheet_commit", "sheet-1", "D1", "digest")
    with pytest.raises(GoogleSheetsBridgeError) as exc:
        b._post("sheet_commit", {"spreadsheet_id": "sheet-1"}, idempotency_key=key)
    assert exc.value.code == "REQUEST_ID_MISMATCH"
'''
          test.write_text(t)
          print('M26_8_PATCH_APPLIED=PASS')
          PY
      - name: Full regression and compile
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pytest -q
          python -m compileall -q src tests scripts
          echo 'M26_8_FULL_REGRESSION=PASS'
      - name: Docker and MCP smoke
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -t birzha-m26-8 .
          docker run --rm -d --name birzha-m26-8-smoke -p 8080:8080 birzha-m26-8
          trap 'docker stop birzha-m26-8-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null
          python scripts/docker_smoke.py
          echo 'M26_8_DOCKER_MCP_SMOKE=PASS'
      - name: Commit only verified patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- src/birzha/storage/google_sheets_bridge.py tests/test_google_sheets_bridge_v1.py
          test -n "$(git status --porcelain -- src/birzha/storage/google_sheets_bridge.py tests/test_google_sheets_bridge_v1.py)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/birzha/storage/google_sheets_bridge.py tests/test_google_sheets_bridge_v1.py
          git commit -m 'fix: make bridge mutation replay correlation deterministic'
          git push origin HEAD:main
          echo "M26_8_COMMITTED_SHA=$(git rev-parse HEAD)"
