name: GOLD D1 missing GDZ6 GDH7 GDM7 GDU7 historical months

on:
  push:
    branches:
      - chatgpt/gold-d1-new-contracts-backfill-20261014
    paths:
      - .github/workflows/gold-d1-new-contracts-backfill.yml

permissions:
  contents: read

jobs:
  gold-d1-month:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        month:
          - "2025-12"
          - "2026-01"
          - "2026-02"
          - "2026-03"
          - "2026-04"
          - "2026-05"
          - "2026-06"
          - "2026-07"
          - "2026-08"
          - "2026-09"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install MOEX provider
        run: python -m pip install -e .
      - name: Collect only new exact GOLD D1 contract histories
        id: collector
        continue-on-error: true
        shell: bash
        env:
          GOLD_MONTH: ${{ matrix.month }}
        run: |
          mkdir -p "research/GOLD/D1-backfill/$GOLD_MONTH"
          set -o pipefail
          python -m scripts.gold_d1_new_contracts_backfill \
            --month "$GOLD_MONTH" 2>&1 | tee "research/GOLD/D1-backfill/$GOLD_MONTH/collector.log"
      - name: Preserve month DuckDB plus source receipts and hash
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GOLD-D1-GD-new-${{ matrix.month }}-research
          path: research/GOLD/D1-backfill/${{ matrix.month }}/
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed if source or archived research incomplete
        shell: bash
        env:
          GOLD_MONTH: ${{ matrix.month }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=os.environ["GOLD_MONTH"]
          p=Path(f"research/GOLD/D1-backfill/{m}/manifest.json")
          if not p.is_file(): raise SystemExit(f"NO_MANIFEST {m}")
          v=json.loads(p.read_text(encoding="utf-8"))
          print("D1_NEW_CONTRACTS",m,v.get("rows"),v.get("secids"))
          print("STATUS",v.get("status"),"SHA256",v.get("sha256"))
          if v.get("status") != "SOURCE_RECEIPT_NOT_PIT_VERIFIED":
              raise SystemExit(f"PARTIAL_OR_MISSING_D1 {m}")
          PY
