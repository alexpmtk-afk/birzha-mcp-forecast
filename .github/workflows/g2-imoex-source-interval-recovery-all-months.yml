name: G2 IMOEX recover observed native incomplete bars all historical months
on:
  push:
    branches: [chatgpt/imoex-interval-recovery-source-fidelity-20261013]
    paths:
      - .github/workflows/g2-imoex-source-interval-recovery-all-months.yml
permissions:
  contents: read
  actions: read
jobs:
  rebuild-source-only-exceptions:
    name: "IMOEX source exceptions ${{ matrix.year }}-${{ matrix.month }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {year: 2025, month: "01"}
          - {year: 2025, month: "02"}
          - {year: 2025, month: "03"}
          - {year: 2025, month: "04"}
          - {year: 2025, month: "05"}
          - {year: 2025, month: "06"}
          - {year: 2025, month: "07"}
          - {year: 2025, month: "08"}
          - {year: 2025, month: "09"}
          - {year: 2025, month: "10"}
          - {year: 2025, month: "11"}
          - {year: 2025, month: "12"}
          - {year: 2026, month: "01"}
          - {year: 2026, month: "02"}
          - {year: 2026, month: "03"}
          - {year: 2026, month: "04"}
          - {year: 2026, month: "05"}
          - {year: 2026, month: "06"}
          - {year: 2026, month: "07"}
          - {year: 2026, month: "08"}
          - {year: 2026, month: "09"}
          - {year: 2026, month: "10"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: "Regression: source bar original identity and forbidden-year refusal"
        run: python -m pytest -q tests/test_g2_imoex_source_interval_recovery.py
      - name: Reuse original immutable canonical archive (read only)
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          mkdir -p research/IMOEX
          gh run download 38445782909 --repo "$GITHUB_REPOSITORY" --name imoex-2025-2026-10-12-consolidated-h1-m15 --dir research/IMOEX
      - name: Re-query only original native IMOEX H1 and M1 to recover genuine exception bars
        run: |
          python -m scripts.g2_imoex_source_interval_recovery \
            --archive research/IMOEX/birzha_intraday_research_2025_2026.duckdb \
            --year ${{ matrix.year }} --month ${{ matrix.month }} \
            --output research/IMOEX/IMOEX_${{ matrix.year }}-${{ matrix.month }}_AUTHENTIC_SOURCE_EXCEPTIONS.json
      - name: SHA256 individual recovery report
        if: always()
        run: |
          cd research/IMOEX && if test -f IMOEX_${{ matrix.year }}-${{ matrix.month }}_AUTHENTIC_SOURCE_EXCEPTIONS.json; then sha256sum IMOEX_${{ matrix.year }}-${{ matrix.month }}_AUTHENTIC_SOURCE_EXCEPTIONS.json > IMOEX_${{ matrix.year }}-${{ matrix.month }}_RECOVERY_SHA256SUMS.txt; fi
      - name: Preserve exact source recovery (NO raw M1 and NO duplicate baseline DB)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imoex-source-exceptions-${{ matrix.year }}-${{ matrix.month }}
          path: |
            research/IMOEX/IMOEX_${{ matrix.year }}-${{ matrix.month }}_AUTHENTIC_SOURCE_EXCEPTIONS.json
            research/IMOEX/IMOEX_${{ matrix.year }}-${{ matrix.month }}_RECOVERY_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
