name: M23 Full Regression Once

on:
  push:
    branches: [m23-ydb-model-validation]
    paths:
      - '.github/workflows/m23-full-regression-once.yml'
      - 'pyproject.toml'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-regression:
    name: Python 3.12 regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package and dev dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Verify declared timezone runtime dependency
        run: python -c "from zoneinfo import ZoneInfo; print('TZDATA_RUNTIME=PASS', ZoneInfo('Europe/Moscow'))"

      - name: Repository integrity preflight
        run: python scripts/repository_preflight.py

      - name: Full pytest
        run: python -m pytest -q

      - name: Compile all Python sources
        run: python -m compileall -q src tests scripts

  docker-regression:
    name: Docker runtime regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Build Docker image
        run: docker build --pull -t birzha-mcp-forecast:m23-regression .

      - name: Run Docker container
        run: docker run --rm -d --name birzha-m23-regression -p 8080:8080 birzha-mcp-forecast:m23-regression

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              echo 'DOCKER_HEALTH=PASS'
              exit 0
            fi
            sleep 1
          done
          docker logs birzha-m23-regression
          exit 1

      - name: Install smoke dependency
        run: python -m pip install --disable-pip-version-check httpx==0.28.1 mcp==2.1.1

      - name: Verify Docker health and MCP transport
        run: python scripts/docker_smoke.py

      - name: Dump container logs on failure
        if: failure()
        run: docker logs birzha-m23-regression || true

      - name: Stop Docker container
        if: always()
        run: docker stop birzha-m23-regression || true
