name: G2 IMOEX final V2 source recovery and all project regressions
on:
  push:
    branches: [chatgpt/imoex-interval-recovery-source-fidelity-20261013]
    paths:
      - .github/workflows/g2-imoex-v2-final-full-regression.yml
permissions:
  contents: read
jobs:
  final-offline-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: All relevant exact-source and research view tests
        run: python -m pytest -q tests/test_g2_imoex_source_interval_recovery.py tests/test_g2_imoex_enrich_research_archive.py tests/test_research_intraday_source_compat.py
      - name: All repository tests before independent acceptance
        run: python -m pytest -q
