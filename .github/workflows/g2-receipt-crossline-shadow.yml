name: G2 Receipt Preflight + Latest Colleague Shadow

on:
  push:
    branches:
      - chatgpt/g2-pilot-receipt-preflight-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  joined-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout source receipt bridge, no credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin and fetch exact colleague HEADs
        shell: bash
        run: |
          git merge-base --is-ancestor 5f091403510a7af0a4c036404db7c04af959120d HEAD
          git fetch --no-tags origin +refs/heads/codex/g2-level-reaction-facts-20261010:refs/remotes/origin/g2-level-reaction
          git fetch --no-tags origin +refs/heads/codex/g2-regime-development-results-20261010:refs/remotes/origin/g2-regime
          test "$(git rev-parse refs/remotes/origin/g2-level-reaction)" = "abe9a42ddf1242e30162c51bfd6207127c34e92a" || { echo "::error::PR157_HEAD_MOVED"; exit 3; }
          test "$(git rev-parse refs/remotes/origin/g2-regime)" = "82af27e1f9d79f02f8062c5756047fe1fb35ef20" || { echo "::error::PR147_HEAD_MOVED"; exit 4; }
      - name: Ephemeral no-push exact-head three-line integration
        shell: bash
        run: |
          git -c user.name=Ephemeral-CI -c user.email=ci@example.invalid merge --no-ff --no-edit refs/remotes/origin/g2-level-reaction
          git -c user.name=Ephemeral-CI -c user.email=ci@example.invalid merge --no-ff --no-edit refs/remotes/origin/g2-regime
          test -z "$(git diff --name-only --diff-filter=U)"
          for sha in 5f091403510a7af0a4c036404db7c04af959120d abe9a42ddf1242e30162c51bfd6207127c34e92a 82af27e1f9d79f02f8062c5756047fe1fb35ef20; do
            git merge-base --is-ancestor "$sha" HEAD
          done
          echo "BRIDGE_SHA_PREFLIGHT_MERGE=PASS;NO_PUSH=TRUE"
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install actual project dependencies
        run: python -m pip install -e '.[dev]'
      - name: Target receipt + source + V3/reaction + regime compatibility
        run: |
          python -m pytest -q tests/test_prospective_staging_bridge.py tests/test_prospective_capture.py tests/test_g2_source_bound_issuance.py tests/test_baseline_decision_contract.py tests/test_price_level_evidence.py tests/test_level_reaction.py tests/test_d1_regime_experiment.py
      - name: Full combined pytest
        run: python -m pytest -q
      - name: Compile touched modules
        run: python -m compileall -q src/birzha/application src/birzha/domain src/birzha/storage
      - name: Explicitly refuse deployment inference
        run: echo "SHADOW_CODE_COMPATIBILITY_ONLY;RELEASE_ALLOWED=false;HOME_UNTOUCHED=true;MERGE_TO_MAIN=false"
