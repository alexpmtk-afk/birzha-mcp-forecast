name: G2 First Frozen Real-Source Baseline

on:
  push:
    branches:
      - chatgpt/g2-first-frozen-real-forecast-20261010
  pull_request:
    branches:
      - chatgpt/g2-six-market-live-receipt-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-to-canonical-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install project with pinned dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test source-binding, immutable staging and forecast contract
        run: |
          python -m pytest -q tests/test_g2_six_market_live_source_capture.py tests/test_g2_freeze_real_forecast_from_source_receipts.py
      - name: Full repository regression
        run: python -m pytest -q
      - name: Compile new code
        run: python -m compileall -q scripts/g2_six_market_live_source_capture.py scripts/g2_freeze_real_forecast_from_source_receipts.py tests/test_g2_freeze_real_forecast_from_source_receipts.py
      - name: Acquire actual six-market governed raw evidence
        id: actual_source
        continue-on-error: true
        run: |
          python -m scripts.g2_six_market_live_source_capture --output-dir "$RUNNER_TEMP/g2-raw-sources"
      - name: Freeze first actual-source baseline into disposable canonical journals
        id: first_real_forecast
        if: steps.actual_source.outcome == 'success'
        continue-on-error: true
        run: |
          python -m scripts.g2_freeze_real_forecast_from_source_receipts --source-dir "$RUNNER_TEMP/g2-raw-sources" --output-dir "$RUNNER_TEMP/g2-frozen-forecasts"
      - name: Print actual source and forecast admission summaries
        if: always()
        run: |
          python -c "import json,pathlib,os; r=pathlib.Path(os.environ['RUNNER_TEMP']); p=r/'g2-raw-sources'/'manifest.json'; q=r/'g2-frozen-forecasts'/'forecast_manifest.json'; print('SOURCE',json.dumps(json.loads(p.read_text()) if p.exists() else {'status':'MISSING'},sort_keys=True)[:4500]); print('FORECAST',json.dumps(json.loads(q.read_text()) if q.exists() else {'status':'MISSING'},sort_keys=True)[:4500])"
      - name: Preserve raw originals and all frozen staging evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g2-first-real-source-bound-forecast-evidence
          path: |
            ${{ runner.temp }}/g2-raw-sources/
            ${{ runner.temp }}/g2-frozen-forecasts/
          if-no-files-found: warn
          retention-days: 7
      - name: Refuse falsely green run if any real acquisition or freeze failed
        if: steps.actual_source.outcome != 'success' || steps.first_real_forecast.outcome != 'success'
        run: |
          echo "::error::LIVE_SOURCE_OR_FROZEN_FORECAST_INCOMPLETE: inspect manifested failures and artifact"
          exit 3
