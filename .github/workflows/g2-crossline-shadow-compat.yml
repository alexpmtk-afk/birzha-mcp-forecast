name: G2 Crossline Compatibility Shadow Test

on:
  push:
    branches:
      - chatgpt/g2-crossline-readonly-ci-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-merge-no-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout forecast staging head read-only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact forecast branch commit guard
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "282497d5d3e43b35277856f84767faf834a98f59" || {
            echo "::error::FORECAST_HEAD_MOVED: inspect before rerunning"
            exit 4
          }
      - name: Fetch exact Codex-colleague research commit
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/codex/g2-regime-development-results-20261010:refs/remotes/origin/g2-colleague-shadow
          test "$(git rev-parse refs/remotes/origin/g2-colleague-shadow)" = "82af27e1f9d79f02f8062c5756047fe1fb35ef20" || {
            echo "::error::REGIME_HEAD_MOVED: inspect before rerunning"
            exit 5
          }
      - name: Ephemeral no-commit merge into runner workspace only
        shell: bash
        run: |
          git -c user.name=G2-CI -c user.email=ci@example.invalid merge --no-commit --no-ff refs/remotes/origin/g2-colleague-shadow
          test -z "$(git diff --name-only --diff-filter=U)" || {
            echo "::error::UNMERGED_PATHS"
            git diff --name-only --diff-filter=U
            exit 6
          }
          echo "MERGE_TEST_ONLY=1;NO_PUSH=1"
          git status --short
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install combined development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Full combined repository tests
        run: python -m pytest -q
      - name: Compile combined forecast and regime sources
        run: python -m compileall -q src/birzha/application/ scripts/g2_post_maturity_outcome_readiness.py scripts/g2_verify_regime_development_report.py
      - name: Verify nothing touched deployment or main
        shell: bash
        run: |
          test -e .git/MERGE_HEAD || { echo "::error::Expected ephemeral uncommitted merge"; exit 7; }
          echo "Only transient runner workspace modified. No push, no merge commit, no production data."
