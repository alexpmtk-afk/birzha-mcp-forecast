name: G2 Single Classified SBER MOEX Retest - Nonproduction

on:
  push:
    branches:
      - chatgpt/g2-one-shot-safe-classified-sber-retest-20261011

permissions:
  contents: read

concurrency:
  group: g2-classified-sber-one-shot-20261011
  cancel-in-progress: false

jobs:
  one-shot-governed-real-source:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Source checkout without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install actual isolated DuckDB and project
        run: python -m pip install -e '.[dev]'
      - name: Check request governor, page caps and offline classification tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from birzha.upstream.moex import MOEX_ISS_PUBLIC_POLICY as p
          from scripts.g2_six_market_live_source_capture import MAX_PAGES,M1_MAX_PAGES,TIMEFRAMES
          assert p.min_interval_seconds >= 0.5 and p.max_retries <= 2
          assert p.target_utilization <= 0.90 and p.max_requests_per_operation <= 120
          assert MAX_PAGES == 8 and M1_MAX_PAGES == 32
          assert TIMEFRAMES["M1"] == (1,5)
          print("BOUND_SINGLE_MARKET_REQUEST_BUDGET=PASS")
          PY
          python -m pytest -q tests/test_g2_six_market_live_source_capture.py tests/test_g2_sourcebound_atomic_issuer.py
      - name: One real governed SBER capture and atomic disposable Forecast
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d "$RUNNER_TEMP/g2-one-shot-disposable-XXXXXXXX")"
          original="$RUNNER_TEMP/g2-one-shot-source-$GITHUB_RUN_ID"
          echo "G2_SINGLE_REAL_SOURCE_ATTEMPT=true;MARKET=SBER;NO_HOME=true;NO_PRODUCTION=true"
          python -m scripts.g2_capture_and_issue_atomic_staging \
            --market SBER --capture-dir "$original" --staging-root "$stage"
          echo "G2_SBER_REAL_SOURCE_ATOMIC_RETEST=PASS"
      - name: Prove release decision remains blocked even after CI
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.g2_release_gate --manifest docs/G2_RELEASE_GATE_20261010.json --summary
          echo "ONE_SHOT_WORKFLOW_RETRIES_DISABLED=true"
