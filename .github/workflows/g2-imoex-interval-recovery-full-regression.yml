name: G2 IMOEX interval recovery full offline regression
on:
  push:
    branches: [chatgpt/imoex-interval-recovery-source-fidelity-20261013]
    paths:
      - .github/workflows/g2-imoex-interval-recovery-full-regression.yml
permissions:
  contents: read
jobs:
  regress-all:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Unit tests for source authenticity and safety
        run: python -m pytest -q tests/test_g2_imoex_source_interval_recovery.py tests/test_g2_imoex_enrich_research_archive.py
      - name: All project unit and regression tests
        run: python -m pytest -q
