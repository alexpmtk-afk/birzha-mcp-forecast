name: BR isolated month source archive June 2025
on:
  push:
    branches: [chatgpt/br-source-capture-20261015]
    paths:
      - .github/workflows/br-month-2025-06-capture.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - name: Run existing governed collector using historical exact contracts
        shell: bash
        run: |
          mkdir -p research/BR/2025-06
          set +e
          python -m scripts.g2_br_month_capture_20261015 --year 2025 --month 6 --output research/BR/2025-06 2>&1 | tee research/BR/2025-06/source_capture.log
          echo "collector_exit_code=${PIPESTATUS[0]}" > research/BR/2025-06/collector_status.txt
          exit 0
      - name: Validate artifact integrity and per-record formatting
        run: |
          python - <<'PY'
          import pathlib,hashlib,csv,json
          p=pathlib.Path('research/BR/2025-06')
          assert (p/'SHA256SUMS.txt').exists()
          for line in (p/'SHA256SUMS.txt').read_text().splitlines():
              sha,file=line.split('  ')
              assert hashlib.sha256((p/file).read_bytes()).hexdigest()==sha
          q=json.loads((p/'source_quality.json').read_text())
          with (p/'verified_sheet_rows.csv').open(newline='') as f: rows=list(csv.reader(f))
          assert len(rows)==sum(q['rows'].values())
          assert all(len(r)==20 and r[0].startswith('BR|') and r[8].startswith('BR') for r in rows)
          assert len(set(r[0] for r in rows))==len(rows)
          assert rows
          print(json.dumps({'status':'VERIFIED_RESEARCH_SOURCE_ROWS','rows':q['rows'],'errors':q['errors'],'source_days':q['source_days']}))
          PY
      - name: Save monthly source DB, CSV, SHA and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: br-month-2025-06-real-source
          path: research/BR/2025-06/
          if-no-files-found: error
          retention-days: 30
