name: M23 hosted final regression

on:
  push:
    branches: [m23-ydb-model-validation]
    paths:
      - '.github/workflows/m23-hosted-final-regression.yml'

permissions:
  contents: read

jobs:
  m22:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: 5e31dc3aa47dc9aead84f638bf2b29cdf40f6f5c
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m compileall -q src tests scripts

  m23:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: f3cd250c873dfcf87d20d5e5f777b10fa9d78394
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m compileall -q src tests scripts
