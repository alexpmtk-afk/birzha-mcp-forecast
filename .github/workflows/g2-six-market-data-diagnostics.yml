name: G2 Six Market Data Diagnostics
on:
  push:
    branches: [codex/g2-six-market-data-diagnostics-20261011]
  pull_request:
    branches: [codex/g2-six-market-facts-summary-20261011]
permissions:
  contents: read
concurrency:
  group: g2-six-market-diagnostics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -p no:cacheprovider
      - run: python scripts/repository_preflight.py
