name: BR 2025 January one-day isolated MOEX retry
on:
  push:
    branches: [chatgpt/br-source-capture-20261015]
    paths:
      - .github/workflows/br-jan-single-date-validation-20261015.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - name: One day exact BR historical source check, no production writes
        shell: bash
        run: |
          mkdir -p research/BR/2025-01-15
          set +e
          python -m scripts.g2_intraday_research_archive --mode ingest --date 2025-01-15 --markets BR --archive research/BR/2025-01-15/research_intraday_20250115.duckdb --ack-research-write 2>&1 | tee research/BR/2025-01-15/source.log
          code=${PIPESTATUS[0]}
          echo "collector_exit_code=$code" | tee research/BR/2025-01-15/collector_status.txt
          if test -f research/BR/2025-01-15/research_intraday_20250115.duckdb; then
            sha256sum research/BR/2025-01-15/research_intraday_20250115.duckdb > research/BR/2025-01-15/SHA256SUMS.txt
          fi
          exit 0
      - name: Save isolated source and exact error log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: br-jan-2025-01-15-source-probe
          path: research/BR/2025-01-15/
          if-no-files-found: error
          retention-days: 30
