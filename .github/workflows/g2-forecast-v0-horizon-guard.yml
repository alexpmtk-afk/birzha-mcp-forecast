name: G2 Forecast V0 Horizon Guard
on:
  push:
    branches:
      - chatgpt/g2-forecast-v0-horizon-guard-20261016
  pull_request:
    branches:
      - codex/g2-baseline-decision-contract-20261010
permissions:
  contents: read
concurrency:
  group: g2-v0-horizon-guard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -p no:cacheprovider tests/test_g2_forecast_v0_horizon_guard.py tests/test_baseline_decision_contract.py
      - run: python -m pytest -q -p no:cacheprovider
      - run: python scripts/repository_preflight.py
