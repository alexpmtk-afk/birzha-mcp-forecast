name: BR verified 2025 pilot export for canonical Sheet
on:
  push:
    branches: [chatgpt/br-source-capture-20261015]
    paths:
      - .github/workflows/br-pilot-export-source-20261015.yml
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install isolated reader
        run: python -m pip install -e '.[dev]'
      - name: Download exact previous confirmed source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research/BR
          gh run download 38771682290 --repo "$GITHUB_REPOSITORY" --name br-source-pilot-2025-06-09 --dir research/BR
          cd research/BR
          echo '5fa7779eb0796369d593a983bb654ef0ed0f39868551a092b38303f35e5156f6  birzha_intraday_research_2025_2026.duckdb' | sha256sum -c
      - name: Export original verified real OHLCV as rows and audit
        run: |
          python - <<'PY'
          import csv,hashlib,json,pathlib,duckdb
          p=pathlib.Path('research/BR')
          cx=duckdb.connect(str(p/'birzha_intraday_research_2025_2026.duckdb'),read_only=True)
          try:
              rows=cx.execute("""select secid,timeframe,begin,end_time,open,high,low,close,volume,value,source_kind,normalized_sha256
                              from research_intraday_candles where symbol='BR' and trade_date='2025-06-09'
                              order by timeframe,begin""").fetchall()
          finally:
              cx.close()
          assert len(rows)==70
          seen=set(); values=[]; provenance=[]
          for secid,tf,begin,end,o,h,l,c,vol,val,kind,sha in rows:
              assert secid=='BRN5' and tf in ('H1','M15') and begin.startswith('2025-06-09')
              key=f'BR|{tf}|{secid}|{begin}'
              assert key not in seen
              seen.add(key)
              value=[key,'2025-06-09','','',begin,end,'','UNKNOWN',secid,o,h,l,c,vol,'',val,'TRUE','H1' if tf=='H1' else 'M1',1 if tf=='H1' else 15,'MOEX_ISS']
              assert l<=min(o,c)<=max(o,c)<=h
              values.append(value)
              provenance.append({'key':key,'source_kind':kind,'normalized_sha256':sha,'research_only':True,'persistence':'GITHUB_RUN_38771682290','session_calendar':'UNVERIFIED','first_received':'UNKNOWN'})
          (p/'br_verified_pilot_sheet_rows.json').write_text(json.dumps({'rows':values,'provenance':provenance},ensure_ascii=False,separators=(',',':'))+'\n')
          with (p/'br_verified_pilot_sheet_rows.csv').open('w',newline='') as f:
              csv.writer(f).writerows(values)
          print(json.dumps({'rows':len(values),'H1':sum(v[2]=='H1' for v in rows),'M15':sum(v[2]=='M15' for v in rows),'key_count':len(seen),'source':'MOEX_ISS_RESEARCH','pit':'UNKNOWN'}))
          PY
          (cd research/BR && sha256sum br_verified_pilot_sheet_rows.json br_verified_pilot_sheet_rows.csv > EXPORT_SHA256SUMS.txt)
      - name: Preserve checked CSV/JSONL source-to-Sheets payload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: br-2025-06-09-verified-sheets-rows
          path: |
            research/BR/br_verified_pilot_sheet_rows.json
            research/BR/br_verified_pilot_sheet_rows.csv
            research/BR/EXPORT_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
