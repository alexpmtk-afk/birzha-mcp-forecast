name: BR isolated January 2025 MOEX source recovery
on:
  push:
    branches: [chatgpt/br-source-capture-20261015]
    paths:
      - .github/workflows/br-month-2025-01-recovery.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - name: Get January from governed MOEX source with exact contract per date
        shell: bash
        run: |
          mkdir -p research/BR/2025-01
          set +e
          python -m scripts.g2_br_month_capture_20261015 --year 2025 --month 1 --output research/BR/2025-01 2>&1 | tee research/BR/2025-01/source_capture.log
          echo "collector_exit_code=${PIPESTATUS[0]}" > research/BR/2025-01/collector_status.txt
          exit 0
      - name: Verify source archive checksums and authentic rows
        shell: bash
        run: |
          python - <<'PY'
          import csv,pathlib,hashlib,json
          p=pathlib.Path('research/BR/2025-01')
          assert (p/'SHA256SUMS.txt').exists()
          for line in (p/'SHA256SUMS.txt').read_text().splitlines():
              digest,basename=line.split('  ',1)
              assert hashlib.sha256((p/basename).read_bytes()).hexdigest()==digest
          quality=json.loads((p/'source_quality.json').read_text())
          with (p/'verified_sheet_rows.csv').open(newline='') as f: data=list(csv.reader(f))
          assert data and len(data)==sum(quality['rows'].values())
          assert all(len(r)==20 and r[0].startswith('BR|') and r[8].startswith('BR') for r in data)
          assert len({r[0] for r in data})==len(data)
          print(json.dumps({'status':'SOURCE_ROWS_VERIFIED_NOT_CALENDAR','rows':quality['rows'],'source_days':quality['source_days'],'error_dates':quality['errors']}))
          PY
      - name: Preserve exact real source and availability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: br-month-2025-01-recovered-source
          path: research/BR/2025-01/
          if-no-files-found: error
          retention-days: 30
