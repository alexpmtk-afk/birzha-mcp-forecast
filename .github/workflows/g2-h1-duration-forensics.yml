name: G2 H1 Duration Forensic Audit
on:
  push:
    branches:
      - chatgpt/g2-h1-duration-forensics-20261016
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  read-only-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Verify forensic input/receipt safety
        run: python -m pytest -q -p no:cacheprovider tests/test_g2_h1_duration_forensics.py
      - name: Full regression
        run: python -m pytest -q -p no:cacheprovider
      - name: Repository preflight
        run: python scripts/repository_preflight.py
