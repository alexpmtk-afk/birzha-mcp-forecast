name: G2 IMOEX full project regression after history completion
on:
  push:
    branches: [chatgpt/g2-imoex-complete-history-to-date-20261013]
    paths:
      - .github/workflows/g2-imoex-completion-full-regression.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: New monthly and consolidation safety tests
        run: python -m pytest -q tests/test_g2_imoex_merge_research_months.py tests/test_g2_imoex_month_archive.py tests/test_research_intraday_archive.py
      - name: Existing project regression without MOEX
        run: python -m pytest -q
