name: G2 Atomic Single DuckDB Staging

on:
  push:
    branches:
      - chatgpt/g2-atomic-single-duckdb-staging-20261010
      - chatgpt/g2-duckdb-process-recovery-20261010
  pull_request:
    branches:
      - chatgpt/g2-pilot-receipt-preflight-20261010
      - chatgpt/g2-atomic-single-duckdb-staging-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-store-atomicity:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout no persisted GitHub credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install project including actual DuckDB
        run: python -m pip install -e '.[dev]'
      - name: Focused atomicity and prior staged bridge
        run: python -m pytest -q tests/test_prospective_single_store.py tests/test_prospective_single_store_process_recovery.py tests/test_prospective_staging_bridge.py tests/test_prospective_capture.py
      - name: Full own-line pytest
        run: python -m pytest -q
      - name: Compile new single-store layer
        run: python -m compileall -q src/birzha/storage/prospective_single_store.py tests/test_prospective_single_store.py tests/test_prospective_single_store_process_recovery.py
      - name: Confirm this is not a production migration
        run: echo "ATOMIC_STAGING_ONLY=true;NO_HOME=true;NO_PROD_DB=true;RELEASE_ALLOWED=false"

  newest-code-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout no persisted GitHub credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Assert exact source parent and fetch independent heads
        run: |
          git merge-base --is-ancestor b148b658d3f9c828d5c2dfbc5f0e4a6eb946bcbb HEAD
          git fetch --no-tags origin +refs/heads/codex/g2-price-location-facts-20261010:refs/remotes/origin/g2-holding
          git fetch --no-tags origin +refs/heads/codex/g2-regime-development-results-20261010:refs/remotes/origin/g2-research
          test "$(git rev-parse refs/remotes/origin/g2-holding)" = "4b51c92879de9a59cd808a6635ba860f6f861fa6"
          test "$(git rev-parse refs/remotes/origin/g2-research)" = "82af27e1f9d79f02f8062c5756047fe1fb35ef20"
      - name: Only temporary two local merges without push
        run: |
          git -c user.name=Ephemeral-CI -c user.email=ci@example.invalid merge --no-ff --no-edit refs/remotes/origin/g2-holding
          git -c user.name=Ephemeral-CI -c user.email=ci@example.invalid merge --no-ff --no-edit refs/remotes/origin/g2-research
          test -z "$(git diff --name-only --diff-filter=U)"
          echo "ONE_STORE_EXACT_HEAD_MERGE=PASS;NO_PUSH=true"
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Focused current-head contracts
        run: python -m pytest -q tests/test_prospective_single_store.py tests/test_prospective_single_store_process_recovery.py tests/test_prospective_staging_bridge.py tests/test_level_reaction.py tests/test_price_location.py tests/test_baseline_decision_contract.py
      - name: Full combined suite
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src/birzha
      - name: Explicit no production
        run: echo "COMPATIBILITY_ONLY=true;RELEASE_ALLOWED=false"
