name: Dispatch OIDC subject diagnostic once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-yandex-test-image-once.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch OIDC diagnostic workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Refusing dispatch outside main" >&2; exit 1; }
          [[ "$GITHUB_REPOSITORY" == "alexpmtk-afk/birzha-mcp-forecast" ]] || { echo "Unexpected repository" >&2; exit 1; }
          RESPONSE_FILE="$RUNNER_TEMP/dispatch-response.json"
          HTTP_CODE="$(curl --proto '=https' --tlsv1.2 --silent --show-error --fail-with-body \
            -o "$RESPONSE_FILE" -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            'https://api.github.com/repos/alexpmtk-afk/birzha-mcp-forecast/actions/workflows/diagnose-yandex-oidc-subject.yml/dispatches' \
            -d '{"ref":"main"}')"
          [[ "$HTTP_CODE" == "200" || "$HTTP_CODE" == "204" ]] || { echo "Workflow dispatch failed with HTTP ${HTTP_CODE}" >&2; exit 1; }
          echo 'OIDC_DIAGNOSTIC_DISPATCH_ACCEPTED'
          rm -f "$RESPONSE_FILE"
