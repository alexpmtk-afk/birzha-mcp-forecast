name: G2 IMOEX final full 2025 2026 Forecast V1 source compatible research
on:
  push:
    branches: [chatgpt/imoex-interval-recovery-source-fidelity-20261013]
    paths:
      - .github/workflows/g2-imoex-source-compat-all-v1-history.yml
permissions:
  contents: read
  actions: read
jobs:
  full-reconstructed-history:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Use saved corrected V2 H1 M15 research archive not renewed MOEX intraday data
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          mkdir -p research/IMOEX
          gh run download 38457009349 --repo "$GITHUB_REPOSITORY" --name imoex-all-observed-source-h1-m15-2025-2026-v2 --dir research/IMOEX
      - name: Run ALL historical source compatible Forecast V1 snapshots and independently score future D1
        run: |
          python -m scripts.g2_imoex_v2_full_reconstructed_forecast_v1 \
            --archive research/IMOEX/birzha_intraday_research_2025_2026_source_compatible.duckdb \
            --expected-sha256 e66262c6d809e7a81b2b91d6e1068e60b3dac114b0310c862d05127c36b29a5c \
            --output research/IMOEX/IMOEX_2025-2026_FORECAST_V1_ALL_RECONSTRUCTED_SOURCE_COMPAT.json
      - name: Check all actual forecasts and nontrading research protection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path('research/IMOEX/IMOEX_2025-2026_FORECAST_V1_ALL_RECONSTRUCTED_SOURCE_COMPAT.json')
          x=json.loads(f.read_text())
          assert x['forecast_V1_replays']>=390
          assert x['D1_source_dates']>=450
          assert x['native_short_source_H1']==541 and x['partial_source_M15']==1296
          assert x['predictions_frozen_before_outcome_evaluation']
          assert x['future_prices_passed_to_forecast_engine'] is False
          assert x['point_in_time_first_receipt_verified'] is False
          assert not x['release_allowed'] and not x['engine_parameters_changed']
          assert x['horizon_summary']['20']['observed']>350
          print('ALL_SOURCE_COMPAT_REPLAYS_PASS',x['forecast_V1_replays'])
          PY
      - name: Seal complete research with SHA256 and preserve user report
        if: always()
        shell: bash
        run: |
          if test -f research/IMOEX/IMOEX_2025-2026_FORECAST_V1_ALL_RECONSTRUCTED_SOURCE_COMPAT.json; then
            cd research/IMOEX && sha256sum IMOEX_2025-2026_FORECAST_V1_ALL_RECONSTRUCTED_SOURCE_COMPAT.json > IMOEX_V2_FORECAST_RESEARCH_SHA256SUMS.txt
          fi
      - name: Preserve source-compatible full historical Forecast V1 evaluation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imoex-v2-all-forecast-v1-source-compatible-research-2025-2026
          path: |
            research/IMOEX/IMOEX_2025-2026_FORECAST_V1_ALL_RECONSTRUCTED_SOURCE_COMPAT.json
            research/IMOEX/IMOEX_V2_FORECAST_RESEARCH_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
