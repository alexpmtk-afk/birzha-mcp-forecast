name: Temporary old Yandex folder inventory via OIDC

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-old-yandex-inventory-20260918.yml"

permissions:
  contents: write
  id-token: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Read-only inventory through Yandex OIDC
        shell: bash
        env:
          OIDC_AUDIENCE: https://github.com/alexpmtk-afk
          PUBLISHER_SERVICE_ACCOUNT_ID: ajessiopotr4eq1g2c2v
          TARGET_FOLDER_ID: b1g0224nfivl9224dm96
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          report=[]

          def emit(line):
              print(line)
              report.append(line)

          oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          oidc_req_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          audience = os.environ["OIDC_AUDIENCE"]
          sa_id = os.environ["PUBLISHER_SERVICE_ACCOUNT_ID"]
          folder_id = os.environ["TARGET_FOLDER_ID"]

          sep = "&" if "?" in oidc_url else "?"
          url = oidc_url + sep + "audience=" + urllib.parse.quote(audience, safe="")
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + oidc_req_token})
          with urllib.request.urlopen(req, timeout=30) as r:
              oidc_jwt = json.loads(r.read().decode())["value"]
          emit("GITHUB_OIDC=PASS")

          body = urllib.parse.urlencode({
              "grant_type": "urn:ietf:params:oauth:grant-type:token-exchange",
              "requested_token_type": "urn:ietf:params:oauth:token-type:access_token",
              "audience": sa_id,
              "subject_token": oidc_jwt,
              "subject_token_type": "urn:ietf:params:oauth:token-type:id_token",
          }).encode()
          req = urllib.request.Request(
              "https://auth.yandex.cloud/oauth/token",
              data=body,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              iam_token = json.loads(r.read().decode())["access_token"]
          emit("YANDEX_OIDC_TOKEN_EXCHANGE=PASS")

          def get_json(label, url):
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + iam_token})
              try:
                  with urllib.request.urlopen(req, timeout=35) as r:
                      data = json.loads(r.read().decode())
                      emit(f"{label}_HTTP=200")
                      return data
              except urllib.error.HTTPError as e:
                  emit(f"{label}_HTTP={e.code}")
                  return None
              except Exception as e:
                  emit(f"{label}_ERROR={type(e).__name__}")
                  return None

          folder = get_json(
              "FOLDER",
              f"https://resource-manager.api.cloud.yandex.net/resource-manager/v1/folders/{folder_id}",
          )
          if folder:
              emit(f"FOLDER_ID={folder.get('id','')}")
              emit(f"FOLDER_NAME={folder.get('name','')}")
              emit(f"FOLDER_STATUS={folder.get('status','')}")

          endpoints = [
              ("LOCKBOX", "https://lockbox.api.cloud.yandex.net/lockbox/v1/secrets", "secrets"),
              ("STORAGE", "https://storage.api.cloud.yandex.net/storage/v1/buckets", "buckets"),
              ("YDB", "https://ydb.api.cloud.yandex.net/ydb/v1/databases", "databases"),
              ("COMPUTE_INSTANCES", "https://compute.api.cloud.yandex.net/compute/v1/instances", "instances"),
              ("COMPUTE_DISKS", "https://compute.api.cloud.yandex.net/compute/v1/disks", "disks"),
              ("COMPUTE_SNAPSHOTS", "https://compute.api.cloud.yandex.net/compute/v1/snapshots", "snapshots"),
              ("FUNCTIONS", "https://serverless-functions.api.cloud.yandex.net/functions/v1/functions", "functions"),
              ("CONTAINERS", "https://serverless-containers.api.cloud.yandex.net/containers/v1/containers", "containers"),
              ("API_GATEWAYS", "https://serverless-apigateway.api.cloud.yandex.net/apigateways/v1/apigateways", "apiGateways"),
              ("REGISTRIES", "https://container-registry.api.cloud.yandex.net/container-registry/v1/registries", "registries"),
              ("NETWORKS", "https://vpc.api.cloud.yandex.net/vpc/v1/networks", "networks"),
              ("SUBNETS", "https://vpc.api.cloud.yandex.net/vpc/v1/subnets", "subnets"),
          ]

          for label, base, key in endpoints:
              q = urllib.parse.urlencode({"folderId": folder_id, "pageSize": "1000"})
              data = get_json(label, base + "?" + q)
              if data is None:
                  continue
              items = data.get(key) or []
              emit(f"{label}_COUNT={len(items)}")
              for x in items:
                  emit(
                      f"{label}_ITEM "
                      f"id={x.get('id','')} "
                      f"name={x.get('name','')} "
                      f"status={x.get('status','')} "
                      f"zone={x.get('zoneId','')} "
                      f"size={x.get('size',x.get('storageSize',''))} "
                      f"versioning={x.get('versioning','')}"
                  )

          emit("OLD_FOLDER_INVENTORY_DONE=YES")
          p=Path("migration-status")
          p.mkdir(exist_ok=True)
          (p/"old-yandex-inventory-20260918.txt").write_text("\n".join(report)+"\n", encoding="utf-8")
          PY

      - name: Commit sanitized inventory report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "yandex-inventory-bot"
          git config user.email "yandex-inventory-bot@users.noreply.github.com"
          git add migration-status/old-yandex-inventory-20260918.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: record sanitized old Yandex inventory"
          git push origin HEAD:main
