name: MOEX independent offline audit
on:
  push:
    branches: [codex/moex-independent-audit-20261011]
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - name: Synthetic tests only, no provider capture commands
        run: >-
          python -m pytest -q tests/test_moex_independent_audit.py
          tests/test_upstream_safety.py tests/test_retry_safety_regressions.py
          tests/test_moex_provider.py tests/test_g2_sourcebound_atomic_issuer.py
          tests/test_g2_freeze_real_forecast_from_source_receipts.py
          tests/test_g2_source_bound_issuance.py tests/test_g2_six_market_live_source_capture.py
          tests/test_prospective_single_store.py tests/test_prospective_single_store_process_recovery.py
      - run: python -m scripts.g2_release_gate --manifest docs/G2_RELEASE_GATE_20261010.json --summary
