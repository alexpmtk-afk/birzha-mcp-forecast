name: Publish protected Yandex TEST image once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-protected-yandex-image-once.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: birzha-yandex-protected-image-771ef803d1836bbe253476a87dab66da26d5b507
  cancel-in-progress: false

env:
  APPROVED_SOURCE_SHA: 771ef803d1836bbe253476a87dab66da26d5b507
  REGISTRY_ID: crpk5qvf4p7kcqil2u3v
  PUBLISHER_SERVICE_ACCOUNT_ID: ajessiopotr4eq1g2c2v
  OIDC_AUDIENCE: https://github.com/alexpmtk-afk
  EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/birzha-mcp-forecast@1350648480:ref:refs/heads/main
  IMAGE_NAME: birzha-mcp-forecast
  REGISTRY_API: https://container-registry.api.cloud.yandex.net/container-registry/v1

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Guard approved one-shot invocation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "push" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_REPOSITORY" == "alexpmtk-afk/birzha-mcp-forecast" ]]
          echo "WORKFLOW_CONTROL_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Checkout exact protected application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.APPROVED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert immutable source and image coordinates
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$APPROVED_SOURCE_SHA" ]]
          TARGET_TAG="git-${APPROVED_SOURCE_SHA}"
          TARGET_REPOSITORY="${REGISTRY_ID}/${IMAGE_NAME}"
          TARGET_IMAGE="cr.yandex/${TARGET_REPOSITORY}:${TARGET_TAG}"
          EXPECTED_TARGET="cr.yandex/crpk5qvf4p7kcqil2u3v/birzha-mcp-forecast:git-771ef803d1836bbe253476a87dab66da26d5b507"
          [[ "$TARGET_IMAGE" == "$EXPECTED_TARGET" ]]
          echo "TARGET_TAG=$TARGET_TAG" >> "$GITHUB_ENV"
          echo "TARGET_REPOSITORY=$TARGET_REPOSITORY" >> "$GITHUB_ENV"
          echo "TARGET_IMAGE=$TARGET_IMAGE" >> "$GITHUB_ENV"
          echo "LOCAL_IMAGE=birzha-mcp-forecast:source-${APPROVED_SOURCE_SHA}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run protected-source tests
        run: python -m pytest -q

      - name: Compile protected source
        run: python -m compileall -q src tests scripts

      - name: Build exact Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --label "org.opencontainers.image.revision=${APPROVED_SOURCE_SHA}" -t "$LOCAL_IMAGE" .

      - name: Run local acceptance container
        run: docker run --rm -d --name birzha-protected-publish-smoke -p 8080:8080 "$LOCAL_IMAGE"

      - name: Wait for health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null && exit 0
            sleep 1
          done
          docker logs birzha-protected-publish-smoke
          exit 1

      - name: Verify MCP and Host protection
        run: python scripts/docker_smoke.py

      - name: Stop local acceptance container
        run: docker stop birzha-protected-publish-smoke

      - name: Exchange GitHub OIDC for Yandex IAM token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]
          ENCODED_AUDIENCE="$(python - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['OIDC_AUDIENCE'], safe=''))
          PY
          )"
          SEP='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && SEP='&'
          OIDC_RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${SEP}audience=${ENCODED_AUDIENCE}")"
          OIDC_JWT="$(python -c 'import json,sys; print(json.load(sys.stdin).get("value", ""))' <<< "$OIDC_RESPONSE")"
          [[ -n "$OIDC_JWT" ]]
          echo "::add-mask::$OIDC_JWT"
          python - "$OIDC_JWT" <<'PY'
          import base64,json,os,sys
          payload=sys.argv[1].split('.')[1]; payload += '=' * (-len(payload) % 4)
          c=json.loads(base64.urlsafe_b64decode(payload))
          assert c.get('sub') == os.environ['EXPECTED_OIDC_SUBJECT'], c.get('sub')
          assert c.get('aud') == os.environ['OIDC_AUDIENCE']
          assert c.get('repository') == 'alexpmtk-afk/birzha-mcp-forecast'
          assert c.get('repository_id') == '1350648480'
          assert c.get('repository_owner_id') == '309119594'
          assert c.get('ref') == 'refs/heads/main'
          print('OIDC_CLAIMS_EXACT_PASS')
          PY
          TOKEN_RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -X POST 'https://auth.yandex.cloud/oauth/token' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' --data-urlencode "audience=${PUBLISHER_SERVICE_ACCOUNT_ID}" --data-urlencode "subject_token=${OIDC_JWT}" --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          IAM_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin).get("access_token", ""))' <<< "$TOKEN_RESPONSE")"
          EXPIRES_IN="$(python -c 'import json,sys; print(json.load(sys.stdin).get("expires_in", ""))' <<< "$TOKEN_RESPONSE")"
          [[ -n "$IAM_TOKEN" && "$EXPIRES_IN" =~ ^[0-9]+$ ]]
          echo "::add-mask::$IAM_TOKEN"
          umask 077
          printf '%s' "$IAM_TOKEN" > "$RUNNER_TEMP/yandex-iam-token"
          chmod 0600 "$RUNNER_TEMP/yandex-iam-token"
          echo "expires_in=$EXPIRES_IN" >> "$GITHUB_OUTPUT"
          unset OIDC_JWT IAM_TOKEN OIDC_RESPONSE TOKEN_RESPONSE

      - name: Assert immutable target tag is absent
        shell: bash
        run: |
          set -euo pipefail
          IAM_TOKEN="$(cat "$RUNNER_TEMP/yandex-iam-token")"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${IAM_TOKEN}" "${REGISTRY_API}/images?registryId=${REGISTRY_ID}&pageSize=1000" -o "$RUNNER_TEMP/registry-before.json"
          python - "$RUNNER_TEMP/registry-before.json" <<'PY'
          import json,os,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text()); images=d.get('images') or []
          assert not d.get('nextPageToken')
          matches=[]
          for image in images:
              tags=image.get('tags') or []
              if os.environ['TARGET_TAG'] in tags:
                  matches.append(image)
          assert not matches, 'immutable target tag already exists; refusing overwrite'
          print(f'REGISTRY_TARGET_TAG_ABSENT_PASS existing_images={len(images)}')
          PY
          unset IAM_TOKEN

      - name: Login and push immutable protected image
        shell: bash
        run: |
          set -euo pipefail
          IAM_TOKEN="$(cat "$RUNNER_TEMP/yandex-iam-token")"
          DOCKER_CONFIG_DIR="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG_DIR" && chmod 0700 "$DOCKER_CONFIG_DIR"
          printf '%s' "$IAM_TOKEN" | docker --config "$DOCKER_CONFIG_DIR" login --username iam --password-stdin cr.yandex >/dev/null
          docker tag "$LOCAL_IMAGE" "$TARGET_IMAGE"
          docker --config "$DOCKER_CONFIG_DIR" push "$TARGET_IMAGE"
          unset IAM_TOKEN

      - name: Verify protected image metadata and digest
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          IAM_TOKEN="$(cat "$RUNNER_TEMP/yandex-iam-token")"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${IAM_TOKEN}" "${REGISTRY_API}/images?registryId=${REGISTRY_ID}&pageSize=1000" -o "$RUNNER_TEMP/registry-after.json"
          META="$(python - "$RUNNER_TEMP/registry-after.json" <<'PY'
          import json,os,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text()); images=d.get('images') or []
          assert not d.get('nextPageToken')
          matches=[i for i in images if i.get('name') == os.environ['TARGET_REPOSITORY'] and os.environ['TARGET_TAG'] in (i.get('tags') or [])]
          assert len(matches) == 1, f'expected one protected target image, found {len(matches)}'
          image=matches[0]
          digest=image.get('digest','')
          assert digest.startswith('sha256:') and len(digest)==71, digest
          print(image.get('id',''), digest, image.get('createdAt',''))
          PY
          )"
          read -r IMAGE_ID YANDEX_DIGEST CREATED_AT <<< "$META"
          [[ -n "$IMAGE_ID" && "$YANDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${IAM_TOKEN}" "${REGISTRY_API}/images/${IMAGE_ID}" -o "$RUNNER_TEMP/registry-image-get.json"
          python - "$RUNNER_TEMP/registry-image-get.json" "$IMAGE_ID" "$YANDEX_DIGEST" <<'PY'
          import json,os,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text())
          assert d.get('id') == sys.argv[2]
          assert d.get('digest') == sys.argv[3]
          assert d.get('name') == os.environ['TARGET_REPOSITORY']
          assert os.environ['TARGET_TAG'] in (d.get('tags') or [])
          print('YANDEX_PROTECTED_IMAGE_METADATA_PASS')
          PY
          echo "image_id=$IMAGE_ID" >> "$GITHUB_OUTPUT"
          echo "digest=$YANDEX_DIGEST" >> "$GITHUB_OUTPUT"
          echo "created_at=$CREATED_AT" >> "$GITHUB_OUTPUT"
          unset IAM_TOKEN META

      - name: Cleanup authentication
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/docker-config"
          [[ ! -f "$D/config.json" ]] || docker --config "$D" logout cr.yandex >/dev/null || true
          rm -f "$RUNNER_TEMP/yandex-iam-token"
          rm -rf "$D"
          [[ ! -e "$RUNNER_TEMP/yandex-iam-token" && ! -e "$D" ]]
          echo "cleanup=PASS" >> "$GITHUB_OUTPUT"

      - name: Write evidence
        if: success()
        shell: bash
        env:
          YANDEX_IMAGE_ID: ${{ steps.registry.outputs.image_id }}
          YANDEX_DIGEST: ${{ steps.registry.outputs.digest }}
          YANDEX_CREATED_AT: ${{ steps.registry.outputs.created_at }}
          CLEANUP_STATUS: ${{ steps.cleanup.outputs.cleanup }}
        run: |
          set -euo pipefail
          [[ "$CLEANUP_STATUS" == "PASS" ]]
          mkdir -p "$RUNNER_TEMP/publish-evidence"
          python - "$RUNNER_TEMP/publish-evidence/image-publish-evidence.json" <<'PY'
          import json,os,sys
          from datetime import datetime,timezone
          from pathlib import Path
          e={
            'schema_version':'BIRZHA_MCP_IMAGE_PUBLISH_EVIDENCE_V4',
            'source_commit_sha':os.environ['APPROVED_SOURCE_SHA'],
            'workflow_control_sha':os.environ['WORKFLOW_CONTROL_SHA'],
            'registry_id':os.environ['REGISTRY_ID'],
            'image_tag':os.environ['TARGET_IMAGE'],
            'yandex_image_id':os.environ['YANDEX_IMAGE_ID'],
            'yandex_image_digest':os.environ['YANDEX_DIGEST'],
            'yandex_image_created_at':os.environ['YANDEX_CREATED_AT'],
            'timestamp_utc':datetime.now(timezone.utc).isoformat(),
            'api_safety':{'upper_level_governor':True,'target_utilization':0.90,'large_request_batching':True,'bounded_retries':True,'retry_after':True,'remote_multi_instance_fail_closed':True},
            'acceptance':{'pytest':'PASS','compile':'PASS','docker_build':'PASS','docker_run':'PASS','healthz':'PASS','mcp_transport':'PASS','tools_list':'PASS','system_version':'PASS','untrusted_host_421':'PASS','oidc_claims':'PASS','target_tag_absent_before':'PASS','yandex_registry_digest':'PASS'},
            'cleanup':{'iam_token_file_removed':True,'docker_config_removed':True,'oidc_jwt_persisted':False}
          }
          Path(sys.argv[1]).write_text(json.dumps(e,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: birzha-yandex-protected-image-publish-evidence-v4
          path: ${{ runner.temp }}/publish-evidence/image-publish-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Final cleanup
        if: always()
        shell: bash
        run: |
          docker stop birzha-protected-publish-smoke >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/yandex-iam-token" "$RUNNER_TEMP/registry-before.json" "$RUNNER_TEMP/registry-after.json" "$RUNNER_TEMP/registry-image-get.json"
          rm -rf "$RUNNER_TEMP/docker-config"
