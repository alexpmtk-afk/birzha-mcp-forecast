name: G2 Six-Market Source Receipt

on:
  push:
    branches:
      - chatgpt/g2-six-market-live-receipt-20261010
  pull_request:
    branches:
      - chatgpt/g2-canonical-staging-bridge-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  six-market-readonly-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up pinned Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install project and pytest
        run: python -m pip install -e '.[dev]'
      - name: Run six-market negative source tests
        run: python -m pytest -q tests/test_g2_six_market_live_source_capture.py
      - name: Run complete repository regression tests
        run: python -m pytest -q
      - name: Compile the bounded collector
        run: python -m compileall -q scripts/g2_six_market_live_source_capture.py tests/test_g2_six_market_live_source_capture.py
      - name: Fetch six markets with existing provider governor (NON-PRODUCTION)
        id: actual_capture
        continue-on-error: true
        run: |
          python -m scripts.g2_six_market_live_source_capture --output-dir "$RUNNER_TEMP/g2-six-market-source"
      - name: Print explicit completeness from actual receipt manifest
        if: always()
        run: |
          python -c "import json, pathlib, os; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'g2-six-market-source'/'manifest.json'; print(json.dumps(json.loads(p.read_text()) if p.exists() else {'status':'NO_MANIFEST'},sort_keys=True,default=str)[:5000])"
      - name: Preserve original governed MOEX pages and manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g2-six-market-original-responses-20261010
          path: ${{ runner.temp }}/g2-six-market-source/
          if-no-files-found: warn
          retention-days: 7

      - name: Require complete six-market source receipt after artifact preservation
        if: steps.actual_capture.outcome != 'success'
        run: |
          echo "::error::SIX_MARKET_LIVE_RECEIPT_PARTIAL: inspect manifest and original pages"
          exit 3
