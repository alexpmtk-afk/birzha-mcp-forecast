name: M23 selfhosted final validation

on:
  push:
    branches:
      - m23-ydb-model-validation
    paths:
      - '.github/workflows/m23-selfhosted-final-validation.yml'

permissions:
  contents: read

concurrency:
  group: m23-selfhosted-final-validation
  cancel-in-progress: false

jobs:
  m22-regression:
    runs-on: [self-hosted, Windows, X64, gpt-powershell-home]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5e31dc3aa47dc9aead84f638bf2b29cdf40f6f5c
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        shell: powershell
        run: python -m pip install -e ".[dev]"
      - name: Pytest
        shell: powershell
        run: python -m pytest -q
      - name: Compile
        shell: powershell
        run: python -m compileall -q src scripts

  m23-regression:
    runs-on: [self-hosted, Windows, X64, gpt-powershell-home]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: f3cd250c873dfcf87d20d5e5f777b10fa9d78394
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        shell: powershell
        run: python -m pip install -e ".[dev]"
      - name: Pytest
        shell: powershell
        run: python -m pytest -q
      - name: Compile
        shell: powershell
        run: python -m compileall -q src scripts

  real-gold-ydb-stage1:
    needs: [m22-regression, m23-regression]
    runs-on: [self-hosted, Windows, X64, gpt-powershell-home]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          ref: f3cd250c873dfcf87d20d5e5f777b10fa9d78394
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        shell: powershell
        run: python -m pip install -e ".[dev]"
      - name: Locate yc
        id: yc
        shell: powershell
        run: |
          $cmd = Get-Command yc -ErrorAction SilentlyContinue
          if ($null -eq $cmd) { throw 'yc CLI is not available to the HOME runner service account' }
          Write-Host "YC_PATH=$($cmd.Source)"
          yc version
      - name: M22 GOLD real YDB probe
        shell: powershell
        run: python scripts/run_authorized_ydb_backfill.py --connection-string "grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1gi4pr9msenirafh2c7/etnes7omhgut11oulsd5" --from-date 2025-01-13 --till-date 2025-01-17 --symbols GOLD --timeframes D1
      - name: M23 governed Stage 1
        shell: powershell
        run: python scripts/run_authorized_ydb_model_pipeline.py --connection-string "grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1gi4pr9msenirafh2c7/etnes7omhgut11oulsd5"
