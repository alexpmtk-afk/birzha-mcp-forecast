name: Public Repository Security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-repo-security:
    name: Public repository policy and credential hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require PUBLIC repository and main as default branch
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          echo "REPOSITORY_PRIVATE=${REPOSITORY_PRIVATE}"
          echo "REPOSITORY_VISIBILITY=${REPOSITORY_VISIBILITY}"
          echo "DEFAULT_BRANCH=${DEFAULT_BRANCH}"
          [ "${REPOSITORY_PRIVATE}" = "false" ]
          [ "${REPOSITORY_VISIBILITY}" = "public" ]
          [ "${DEFAULT_BRANCH}" = "main" ]
          echo "PUBLIC_REPOSITORY_POLICY=PASS"

      - name: Checkout complete history without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch all public branch refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Scan current tree and reachable Git history
        run: python scripts/public_repo_security.py --history
