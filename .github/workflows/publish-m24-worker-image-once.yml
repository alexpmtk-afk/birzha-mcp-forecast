name: Publish M24 worker image once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-m24-worker-image-once.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: birzha-m24-worker-image-1b7564bdeab31484efba61da270d519998c97cd2
  cancel-in-progress: false

env:
  APPROVED_SOURCE_SHA: 1b7564bdeab31484efba61da270d519998c97cd2
  REGISTRY_ID: crpk5qvf4p7kcqil2u3v
  PUBLISHER_SERVICE_ACCOUNT_ID: ajessiopotr4eq1g2c2v
  OIDC_AUDIENCE: https://github.com/alexpmtk-afk
  EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/birzha-mcp-forecast@1350648480:ref:refs/heads/main
  IMAGE_NAME: birzha-mcp-forecast
  REGISTRY_API: https://container-registry.api.cloud.yandex.net/container-registry/v1

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Guard one-shot invocation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "push" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_REPOSITORY" == "alexpmtk-afk/birzha-mcp-forecast" ]]

      - name: Checkout exact M24 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.APPROVED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$APPROVED_SOURCE_SHA" ]]
          TARGET_TAG="m24-worker-git-${APPROVED_SOURCE_SHA}"
          TARGET_REPOSITORY="${REGISTRY_ID}/${IMAGE_NAME}"
          echo "TARGET_TAG=$TARGET_TAG" >> "$GITHUB_ENV"
          echo "TARGET_REPOSITORY=$TARGET_REPOSITORY" >> "$GITHUB_ENV"
          echo "TARGET_IMAGE=cr.yandex/${TARGET_REPOSITORY}:${TARGET_TAG}" >> "$GITHUB_ENV"
          echo "LOCAL_IMAGE=birzha-m24-worker:source-${APPROVED_SOURCE_SHA}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run exact-source tests
        run: python -m pytest -q

      - name: Compile exact source
        run: python -m compileall -q src tests scripts

      - name: Assert autonomous worker entry point exists
        shell: bash
        run: |
          set -euo pipefail
          test -f src/birzha/worker.py
          python - <<'PY'
          from pathlib import Path
          text=Path('src/birzha/worker.py').read_text()
          assert 'BIRZHA_ORCHESTRATOR_WORKER' in text
          assert 'YdbOrchestrationStore' in text
          assert 'run_next_active' in text
          print('M24_WORKER_ENTRYPOINT=PASS')
          PY

      - name: Build immutable worker-capable image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --label "org.opencontainers.image.revision=${APPROVED_SOURCE_SHA}" -t "$LOCAL_IMAGE" .

      - name: Exchange GitHub OIDC for Yandex IAM token
        shell: bash
        run: |
          set -euo pipefail
          ENCODED_AUDIENCE="$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe=""))')"
          SEP='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && SEP='&'
          OIDC_RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${SEP}audience=${ENCODED_AUDIENCE}")"
          OIDC_JWT="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$OIDC_RESPONSE")"
          echo "::add-mask::$OIDC_JWT"
          python - "$OIDC_JWT" <<'PY'
          import base64,json,os,sys
          p=sys.argv[1].split('.')[1]; p += '=' * (-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          assert c.get('sub')==os.environ['EXPECTED_OIDC_SUBJECT'], c.get('sub')
          assert c.get('aud')==os.environ['OIDC_AUDIENCE'], c.get('aud')
          assert c.get('ref')=='refs/heads/main', c.get('ref')
          print('M24_PUBLISHER_OIDC_CLAIMS=PASS')
          PY
          RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -X POST 'https://auth.yandex.cloud/oauth/token' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' --data-urlencode "audience=${PUBLISHER_SERVICE_ACCOUNT_ID}" --data-urlencode "subject_token=${OIDC_JWT}" --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          IAM_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$RESPONSE")"
          test -n "$IAM_TOKEN"
          echo "::add-mask::$IAM_TOKEN"
          printf '%s' "$IAM_TOKEN" > "$RUNNER_TEMP/yandex-iam-token"
          echo 'M24_PUBLISHER_OIDC_EXCHANGE=PASS'

      - name: Assert immutable target tag is absent
        shell: bash
        run: |
          set -euo pipefail
          IAM_TOKEN="$(cat "$RUNNER_TEMP/yandex-iam-token")"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${IAM_TOKEN}" "${REGISTRY_API}/images?registryId=${REGISTRY_ID}&pageSize=1000" -o "$RUNNER_TEMP/registry-before.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'registry-before.json').read_text())
          assert not d.get('nextPageToken')
          hits=[x for x in d.get('images',[]) if os.environ['TARGET_TAG'] in (x.get('tags') or [])]
          assert not hits, 'immutable M24 worker tag already exists'
          print('M24_WORKER_TARGET_TAG_ABSENT=PASS')
          PY

      - name: Push immutable worker image
        shell: bash
        run: |
          set -euo pipefail
          IAM_TOKEN="$(cat "$RUNNER_TEMP/yandex-iam-token")"
          D="$RUNNER_TEMP/docker-config"; mkdir -p "$D"; chmod 0700 "$D"
          printf '%s' "$IAM_TOKEN" | docker --config "$D" login --username iam --password-stdin cr.yandex >/dev/null
          docker tag "$LOCAL_IMAGE" "$TARGET_IMAGE"
          docker --config "$D" push "$TARGET_IMAGE"
          echo 'M24_WORKER_IMAGE_PUSH=PASS'

      - name: Verify immutable digest
        shell: bash
        run: |
          set -euo pipefail
          IAM_TOKEN="$(cat "$RUNNER_TEMP/yandex-iam-token")"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${IAM_TOKEN}" "${REGISTRY_API}/images?registryId=${REGISTRY_ID}&pageSize=1000" -o "$RUNNER_TEMP/registry-after.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'registry-after.json').read_text())
          assert not d.get('nextPageToken')
          m=[x for x in d.get('images',[]) if x.get('name')==os.environ['TARGET_REPOSITORY'] and os.environ['TARGET_TAG'] in (x.get('tags') or [])]
          assert len(m)==1, len(m)
          digest=m[0].get('digest','')
          assert digest.startswith('sha256:') and len(digest)==71, digest
          print('M24_WORKER_IMAGE_DIGEST_REF=cr.yandex/'+os.environ['TARGET_REPOSITORY']+'@'+digest)
          print('M24_WORKER_IMAGE_VERIFY=PASS')
          PY

      - name: Cleanup authentication
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/yandex-iam-token" "$RUNNER_TEMP/docker-config" "$RUNNER_TEMP/registry-before.json" "$RUNNER_TEMP/registry-after.json"
