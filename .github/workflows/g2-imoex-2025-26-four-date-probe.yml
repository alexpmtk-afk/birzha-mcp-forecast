name: G2 IMOEX H1 M15 2025-26 source samples
on:
  push:
    branches: [chatgpt/g2-imoex-h1m15-coverage-probe-20261013]
    paths:
      - .github/workflows/g2-imoex-2025-26-four-date-probe.yml
permissions:
  contents: read
jobs:
  imoex-4-date-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - name: Four read-only IMOEX historical source samples
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          dates = ("2025-01-15", "2025-12-15", "2026-04-15", "2026-09-15")
          missing = []
          for day in dates:
              proc = subprocess.run([
                  sys.executable, "-m", "scripts.g2_intraday_research_archive",
                  "--mode", "probe", "--date", day, "--markets", "IMOEX",
              ], capture_output=True, text=True, timeout=150)
              print(f"DATE={day} EXIT={proc.returncode}", flush=True)
              print(proc.stdout.strip(), flush=True)
              if proc.stderr.strip():
                  print("PROBE_ERROR:", proc.stderr[-600:], flush=True)
              try:
                  data = json.loads(proc.stdout.strip().splitlines()[-1])
              except (IndexError, ValueError):
                  missing.append(day)
                  continue
              if data.get("market") != "IMOEX" or data.get("h1_rows", 0) < 1 or data.get("m15_rows", 0) < 1:
                  missing.append(day)
          if missing:
              raise SystemExit("Missing required IMOEX H1/M15 sample evidence: " + ",".join(missing))
          print("IMOEX 4-DATE SOURCE ACCESS PASS; completeness/PIT NOT PROVEN", flush=True)
          PY
