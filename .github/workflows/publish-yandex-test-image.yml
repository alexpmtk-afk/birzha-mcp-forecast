name: Publish Yandex TEST image

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Explicit controlled TEST image publish"
        required: true
        type: choice
        default: DO_NOT_PUBLISH
        options:
          - DO_NOT_PUBLISH
          - PUBLISH_APPROVED_IMAGE

permissions:
  contents: read
  id-token: write

concurrency:
  group: birzha-yandex-test-image-e8463b8a034b2a7ed92ac06894ce960d9fa3a021
  cancel-in-progress: false

env:
  APPROVED_SOURCE_SHA: e8463b8a034b2a7ed92ac06894ce960d9fa3a021
  REGISTRY_ID: crpk5qvf4p7kcqil2u3v
  PUBLISHER_SERVICE_ACCOUNT_ID: ajessiopotr4eq1g2c2v
  OIDC_FEDERATION_ID: ajeccljd5pi9ive0i18u
  FEDERATED_CREDENTIAL_ID: ajek2olnlmms3oaqsp58
  OIDC_AUDIENCE: https://github.com/alexpmtk-afk
  EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk/birzha-mcp-forecast:ref:refs/heads/main
  IMAGE_NAME: birzha-mcp-forecast
  REGISTRY_API: https://container-registry.api.cloud.yandex.net/container-registry/v1

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Guard manual approval and capture workflow control SHA
        shell: bash
        env:
          APPROVAL_INPUT: ${{ inputs.approval }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || { echo "Refusing non-manual invocation" >&2; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Refusing publish outside main" >&2; exit 1; }
          [[ "$APPROVAL_INPUT" == "PUBLISH_APPROVED_IMAGE" ]] || { echo "Explicit publish approval not supplied" >&2; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid workflow control SHA" >&2; exit 1; }
          echo "WORKFLOW_CONTROL_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Checkout exact approved application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.APPROVED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact source and target coordinates
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$APPROVED_SOURCE_SHA" ]] || { echo "Source SHA mismatch" >&2; exit 1; }
          [[ "$REGISTRY_ID" == "crpk5qvf4p7kcqil2u3v" ]] || { echo "Registry mismatch" >&2; exit 1; }
          [[ "$PUBLISHER_SERVICE_ACCOUNT_ID" == "ajessiopotr4eq1g2c2v" ]] || { echo "Publisher SA mismatch" >&2; exit 1; }
          [[ "$OIDC_FEDERATION_ID" == "ajeccljd5pi9ive0i18u" ]] || { echo "Federation mismatch" >&2; exit 1; }
          [[ "$FEDERATED_CREDENTIAL_ID" == "ajek2olnlmms3oaqsp58" ]] || { echo "Federated credential mismatch" >&2; exit 1; }
          TARGET_TAG="git-${APPROVED_SOURCE_SHA}"
          TARGET_REPOSITORY="${REGISTRY_ID}/${IMAGE_NAME}"
          TARGET_IMAGE="cr.yandex/${TARGET_REPOSITORY}:${TARGET_TAG}"
          EXPECTED_TARGET="cr.yandex/crpk5qvf4p7kcqil2u3v/birzha-mcp-forecast:git-e8463b8a034b2a7ed92ac06894ce960d9fa3a021"
          [[ "$TARGET_IMAGE" == "$EXPECTED_TARGET" ]] || { echo "Target image mismatch" >&2; exit 1; }
          echo "TARGET_TAG=$TARGET_TAG" >> "$GITHUB_ENV"
          echo "TARGET_REPOSITORY=$TARGET_REPOSITORY" >> "$GITHUB_ENV"
          echo "TARGET_IMAGE=$TARGET_IMAGE" >> "$GITHUB_ENV"
          echo "LOCAL_IMAGE=birzha-mcp-forecast:source-${APPROVED_SOURCE_SHA}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run pytest acceptance
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Build Docker image from exact source
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            --label "org.opencontainers.image.revision=${APPROVED_SOURCE_SHA}" \
            -t "$LOCAL_IMAGE" .

      - name: Run Docker acceptance container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -d \
            --name birzha-mcp-forecast-publish-smoke \
            -p 8080:8080 \
            "$LOCAL_IMAGE"

      - name: Verify health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs birzha-mcp-forecast-publish-smoke
          exit 1

      - name: Verify MCP transport, tools, version and untrusted Host rejection
        run: python scripts/docker_smoke.py

      - name: Stop acceptance container before cloud authentication
        run: docker stop birzha-mcp-forecast-publish-smoke

      - name: Obtain GitHub OIDC JWT and exchange for Yandex IAM token
        id: oidc
        shell: bash
        env:
          OIDC_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          OIDC_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${OIDC_REQUEST_URL:-}" && -n "${OIDC_REQUEST_TOKEN:-}" ]] || { echo "GitHub OIDC endpoint unavailable" >&2; exit 1; }

          ENCODED_AUDIENCE="$(python - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['OIDC_AUDIENCE'], safe=''))
          PY
          )"
          SEP='?'
          [[ "$OIDC_REQUEST_URL" == *'?'* ]] && SEP='&'
          OIDC_RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 \
            -H "Authorization: Bearer ${OIDC_REQUEST_TOKEN}" \
            "${OIDC_REQUEST_URL}${SEP}audience=${ENCODED_AUDIENCE}")"
          OIDC_JWT="$(python -c 'import json,sys; print(json.load(sys.stdin).get("value", ""))' <<< "$OIDC_RESPONSE")"
          [[ -n "$OIDC_JWT" ]] || { echo "GitHub did not return an OIDC JWT" >&2; exit 1; }
          echo "::add-mask::$OIDC_JWT"

          python - "$OIDC_JWT" <<'PY'
          import base64, json, os, sys
          token=sys.argv[1]
          payload=token.split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims=json.loads(base64.urlsafe_b64decode(payload))
          if claims.get('sub') != os.environ['EXPECTED_OIDC_SUBJECT']:
              raise SystemExit('OIDC subject does not match the exact main-branch federated credential')
          if claims.get('aud') != os.environ['OIDC_AUDIENCE']:
              raise SystemExit('OIDC audience mismatch')
          if claims.get('repository') != 'alexpmtk-afk/birzha-mcp-forecast':
              raise SystemExit('OIDC repository mismatch')
          if claims.get('ref') != 'refs/heads/main':
              raise SystemExit('OIDC ref mismatch')
          print('OIDC_CLAIMS_EXACT_PASS')
          PY

          TOKEN_RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 \
            -X POST 'https://auth.yandex.cloud/oauth/token' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${PUBLISHER_SERVICE_ACCOUNT_ID}" \
            --data-urlencode "subject_token=${OIDC_JWT}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          IAM_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin).get("access_token", ""))' <<< "$TOKEN_RESPONSE")"
          EXPIRES_IN="$(python -c 'import json,sys; print(json.load(sys.stdin).get("expires_in", ""))' <<< "$TOKEN_RESPONSE")"
          [[ -n "$IAM_TOKEN" && "$EXPIRES_IN" =~ ^[0-9]+$ ]] || { echo "Yandex token exchange failed" >&2; exit 1; }
          echo "::add-mask::$IAM_TOKEN"
          umask 077
          printf '%s' "$IAM_TOKEN" > "$RUNNER_TEMP/yandex-iam-token"
          chmod 0600 "$RUNNER_TEMP/yandex-iam-token"
          echo "expires_in=$EXPIRES_IN" >> "$GITHUB_OUTPUT"
          unset OIDC_JWT IAM_TOKEN OIDC_RESPONSE TOKEN_RESPONSE OIDC_REQUEST_TOKEN

      - name: Assert Registry is pristine and approved tag does not exist
        shell: bash
        run: |
          set -euo pipefail
          IAM_TOKEN="$(cat "$RUNNER_TEMP/yandex-iam-token")"
          REGISTRY_JSON="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 \
            -H "Authorization: Bearer ${IAM_TOKEN}" \
            "${REGISTRY_API}/images?registryId=${REGISTRY_ID}&pageSize=1000")"
          python - <<'PY' <<< "$REGISTRY_JSON"
          import json, os, sys
          data=json.load(sys.stdin)
          images=data.get('images') or []
          if data.get('nextPageToken'):
              raise SystemExit('Registry image list unexpectedly paginated')
          if images:
              tags=[t for image in images for t in (image.get('tags') or [])]
              if os.environ['TARGET_TAG'] in tags:
                  raise SystemExit('Approved immutable tag already exists; refusing overwrite')
              raise SystemExit(f'Registry is not pristine: expected 0 images, found {len(images)}')
          print('REGISTRY_PRISTINE_AND_TAG_ABSENT_PASS')
          PY
          unset IAM_TOKEN REGISTRY_JSON

      - name: Docker login and push exact immutable tag
        shell: bash
        run: |
          set -euo pipefail
          IAM_TOKEN="$(cat "$RUNNER_TEMP/yandex-iam-token")"
          DOCKER_CONFIG_DIR="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG_DIR"
          chmod 0700 "$DOCKER_CONFIG_DIR"
          printf '%s' "$IAM_TOKEN" | docker --config "$DOCKER_CONFIG_DIR" login \
            --username iam --password-stdin cr.yandex >/dev/null
          docker tag "$LOCAL_IMAGE" "$TARGET_IMAGE"
          docker --config "$DOCKER_CONFIG_DIR" push "$TARGET_IMAGE"
          unset IAM_TOKEN

      - name: Resolve and verify real Yandex Registry image metadata
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          IAM_TOKEN="$(cat "$RUNNER_TEMP/yandex-iam-token")"
          LIST_JSON="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 \
            -H "Authorization: Bearer ${IAM_TOKEN}" \
            "${REGISTRY_API}/images?registryId=${REGISTRY_ID}&pageSize=1000")"
          read -r IMAGE_ID YANDEX_DIGEST CREATED_AT <<< "$(python - <<'PY' <<< "$LIST_JSON"
          import json, os, sys
          data=json.load(sys.stdin)
          images=data.get('images') or []
          if data.get('nextPageToken'):
              raise SystemExit('Registry image list unexpectedly paginated after push')
          if len(images) != 1:
              raise SystemExit(f'Expected exactly 1 image after first controlled publish, found {len(images)}')
          image=images[0]
          if image.get('name') != os.environ['TARGET_REPOSITORY']:
              raise SystemExit(f'Unexpected repository: {image.get("name")}')
          if image.get('tags') != [os.environ['TARGET_TAG']]:
              raise SystemExit(f'Unexpected tags: {image.get("tags")}')
          digest=image.get('digest','')
          if not digest.startswith('sha256:') or len(digest) != 71:
              raise SystemExit('Invalid Yandex digest')
          print(image.get('id',''), digest, image.get('createdAt',''))
          PY
          )"
          [[ -n "$IMAGE_ID" && "$YANDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid image metadata" >&2; exit 1; }

          GET_JSON="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 \
            -H "Authorization: Bearer ${IAM_TOKEN}" \
            "${REGISTRY_API}/images/${IMAGE_ID}")"
          python - "$IMAGE_ID" "$YANDEX_DIGEST" <<'PY' <<< "$GET_JSON"
          import json, os, sys
          data=json.load(sys.stdin)
          image_id=sys.argv[1]
          digest=sys.argv[2]
          assert data.get('id') == image_id, data
          assert data.get('digest') == digest, data
          assert data.get('name') == os.environ['TARGET_REPOSITORY'], data
          assert data.get('tags') == [os.environ['TARGET_TAG']], data
          print('YANDEX_IMAGE_GET_METADATA_PASS')
          PY
          echo "image_id=$IMAGE_ID" >> "$GITHUB_OUTPUT"
          echo "digest=$YANDEX_DIGEST" >> "$GITHUB_OUTPUT"
          echo "created_at=$CREATED_AT" >> "$GITHUB_OUTPUT"
          unset IAM_TOKEN LIST_JSON GET_JSON

      - name: Cleanup authentication material
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DOCKER_CONFIG_DIR="$RUNNER_TEMP/docker-config"
          if [[ -f "$DOCKER_CONFIG_DIR/config.json" ]]; then
            docker --config "$DOCKER_CONFIG_DIR" logout cr.yandex >/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/yandex-iam-token"
          rm -rf "$DOCKER_CONFIG_DIR"
          if [[ -e "$RUNNER_TEMP/yandex-iam-token" || -e "$DOCKER_CONFIG_DIR" ]]; then
            echo "Authentication cleanup failed" >&2
            exit 1
          fi
          echo "cleanup=PASS" >> "$GITHUB_OUTPUT"

      - name: Write non-secret publish evidence
        if: success()
        shell: bash
        env:
          YANDEX_IMAGE_ID: ${{ steps.registry.outputs.image_id }}
          YANDEX_DIGEST: ${{ steps.registry.outputs.digest }}
          YANDEX_CREATED_AT: ${{ steps.registry.outputs.created_at }}
          TOKEN_EXPIRES_IN: ${{ steps.oidc.outputs.expires_in }}
          CLEANUP_STATUS: ${{ steps.cleanup.outputs.cleanup }}
        run: |
          set -euo pipefail
          [[ "$CLEANUP_STATUS" == "PASS" ]] || exit 1
          EVIDENCE_DIR="$RUNNER_TEMP/publish-evidence"
          mkdir -p "$EVIDENCE_DIR"
          python - "$EVIDENCE_DIR/image-publish-evidence.json" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path
          evidence={
            'schema_version':'BIRZHA_MCP_IMAGE_PUBLISH_EVIDENCE_V2',
            'source_commit_sha':os.environ['APPROVED_SOURCE_SHA'],
            'workflow_control_sha':os.environ['WORKFLOW_CONTROL_SHA'],
            'registry_id':os.environ['REGISTRY_ID'],
            'publisher_service_account_id':os.environ['PUBLISHER_SERVICE_ACCOUNT_ID'],
            'oidc_federation_id':os.environ['OIDC_FEDERATION_ID'],
            'federated_credential_id':os.environ['FEDERATED_CREDENTIAL_ID'],
            'oidc_subject':os.environ['EXPECTED_OIDC_SUBJECT'],
            'oidc_audience':os.environ['OIDC_AUDIENCE'],
            'authentication':'GITHUB_OIDC_TO_YANDEX_WIF',
            'authorized_key_created':False,
            'github_secret_created':False,
            'image_tag':os.environ['TARGET_IMAGE'],
            'yandex_image_id':os.environ['YANDEX_IMAGE_ID'],
            'yandex_image_digest':os.environ['YANDEX_DIGEST'],
            'yandex_image_created_at':os.environ['YANDEX_CREATED_AT'],
            'registry_images_before':0,
            'registry_images_after':1,
            'iam_token_expires_in_seconds':int(os.environ['TOKEN_EXPIRES_IN']),
            'timestamp_utc':datetime.now(timezone.utc).isoformat(),
            'acceptance':{
              'exact_source_sha':'PASS','pytest':'PASS','compile':'PASS','docker_build':'PASS',
              'docker_run':'PASS','healthz':'PASS','mcp_transport':'PASS','tools_list':'PASS',
              'system_version':'PASS','untrusted_host_421':'PASS','registry_id':'PASS',
              'publisher_sa':'PASS','exact_target_image':'PASS','tag_not_exists':'PASS',
              'registry_pristine_before':'PASS','yandex_image_metadata_after':'PASS'
            },
            'cleanup':{
              'docker_logout':'PASS','docker_config_removed':True,'iam_token_file_removed':True,
              'oidc_jwt_persisted':False,'authorized_key_present':False,'github_secret_present':False
            }
          }
          Path(sys.argv[1]).write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload non-secret publish evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: birzha-yandex-test-image-publish-evidence
          path: ${{ runner.temp }}/publish-evidence/image-publish-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Final runner cleanup
        if: always()
        shell: bash
        run: |
          docker stop birzha-mcp-forecast-publish-smoke >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/yandex-iam-token"
          rm -rf "$RUNNER_TEMP/docker-config"
