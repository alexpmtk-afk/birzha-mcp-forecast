name: G2 IMOEX all remaining 2025-26 months through October 12
on:
  push:
    branches: [chatgpt/g2-imoex-complete-history-to-date-20261013]
    paths:
      - .github/workflows/g2-imoex-all-remaining-2025-26.yml
permissions:
  contents: read
  actions: read
jobs:
  capture:
    name: "IMOEX ${{ matrix.year }}-${{ matrix.month }}"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {year: 2025, month: "04"}
          - {year: 2025, month: "05"}
          - {year: 2025, month: "06"}
          - {year: 2025, month: "07"}
          - {year: 2025, month: "08"}
          - {year: 2025, month: "09"}
          - {year: 2025, month: "10"}
          - {year: 2025, month: "11"}
          - {year: 2025, month: "12"}
          - {year: 2026, month: "01"}
          - {year: 2026, month: "02"}
          - {year: 2026, month: "03"}
          - {year: 2026, month: "04"}
          - {year: 2026, month: "05"}
          - {year: 2026, month: "06"}
          - {year: 2026, month: "07"}
          - {year: 2026, month: "08"}
          - {year: 2026, month: "09"}
          - {year: 2026, month: "10"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Collector and storage offline tests
        run: python -m pytest -q tests/test_g2_imoex_month_archive.py tests/test_research_intraday_archive.py
      - run: mkdir -p ./research/IMOEX
      - name: Capture only selected month via protected MOEX governor
        shell: bash
        run: |
          extra=()
          if [ "${{ matrix.year }}-${{ matrix.month }}" = "2026-10" ]; then
            extra=(--till-date 2026-10-12)
          fi
          python -m scripts.g2_imoex_month_archive --mode ingest --year ${{ matrix.year }} --month ${{ matrix.month }} \
            --max-source-days 31 "${extra[@]}" \
            --archive ./research/IMOEX/birzha_intraday_research_2025_2026.duckdb \
            --report ./research/IMOEX/IMOEX_${{ matrix.year }}-${{ matrix.month }}_coverage.json \
            --ack-research-write
      - name: Record SHA256 for monthly source pair
        if: always()
        shell: bash
        run: |
          if [ -d research/IMOEX ]; then
            (cd research/IMOEX && sha256sum *.duckdb *.json > IMOEX_${{ matrix.year }}-${{ matrix.month }}_SHA256SUMS.txt) || true
            find research/IMOEX -maxdepth 1 -type f -printf '%f %s bytes\n'
          fi
      - name: Preserve monthly partition and manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imoex-intraday-${{ matrix.year }}-${{ matrix.month }}-duckdb
          path: research/IMOEX/
          if-no-files-found: error
          retention-days: 30
