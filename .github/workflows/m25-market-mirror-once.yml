name: M25 Combined Forecast Runtime Once

on:
  push:
    branches: [m25-market-data-mirror]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "ops/apps_script/**"
      - "Dockerfile"
      - "pyproject.toml"
      - ".github/workflows/m25-market-mirror-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and tests
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Targeted M25 + orchestration tests
        run: python -m pytest -q tests/test_market_mirror.py tests/test_market_mirror_sync.py tests/test_google_sheets_bridge.py tests/test_m25_combined_orchestration.py tests/test_config.py
      - name: Full regression
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q src tests scripts
      - name: Validate Apps Script syntax
        shell: bash
        run: |
          cp ops/apps_script/birzha_market_mirror_bridge.gs "$RUNNER_TEMP/birzha_market_mirror_bridge.js"
          node --check "$RUNNER_TEMP/birzha_market_mirror_bridge.js"
      - name: Build Docker image
        run: docker build --pull -t birzha-mcp-forecast:m25 .
      - name: Start Docker image
        run: docker run --rm -d --name birzha-m25-ci -p 8080:8080 birzha-mcp-forecast:m25
      - name: MCP health smoke
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              python scripts/docker_smoke.py
              exit 0
            fi
            sleep 1
          done
          docker logs birzha-m25-ci
          exit 1
      - name: Stop container
        if: always()
        run: docker stop birzha-m25-ci || true
