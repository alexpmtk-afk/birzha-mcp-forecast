name: G2 six-market one-day 2025 source inventory
on:
  push:
    branches: [chatgpt/g2-research-intraday-duckdb-archive-20261013]
    paths:
      - .github/workflows/g2-intraday-six-market-one-day-probe.yml
permissions:
  contents: read
jobs:
  six-market-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - name: Read-only 2025 one-day six-market H1/M1 inventory
        run: python -m scripts.g2_intraday_research_archive --mode probe --date 2025-06-09
