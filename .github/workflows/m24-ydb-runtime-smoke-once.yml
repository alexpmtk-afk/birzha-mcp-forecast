name: M24 Real YDB Runtime Smoke Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m24-ydb-runtime-smoke-once.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: birzha-m24-real-ydb-runtime-smoke
  cancel-in-progress: false

env:
  APP_SHA: 02b1ae09040903d59615478b664ba3f9c526df92
  OIDC_AUDIENCE: https://github.com/alexpmtk-afk
  HISTORICAL_PREPARER_SERVICE_ACCOUNT_ID: ajeadmjrbl2i9ku929cc
  EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/birzha-mcp-forecast@1350648480:ref:refs/heads/main
  YDB_CONNECTION_STRING: grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1gi4pr9msenirafh2c7/etnes7omhgut11oulsd5
  PREVIOUS_PREFIX: m24runtime_34761251579

jobs:
  real-ydb-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mint Yandex IAM token through GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          A="$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe=""))')"
          S='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && S='&'
          R="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${S}audience=${A}")"
          J="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$R")"
          echo "::add-mask::$J"
          python - "$J" <<'PY'
          import base64,json,os,sys
          p=sys.argv[1].split('.')[1]; p += '='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          assert c.get('sub')==os.environ['EXPECTED_OIDC_SUBJECT']
          assert c.get('aud')==os.environ['OIDC_AUDIENCE']
          assert c.get('ref')=='refs/heads/main'
          print('M24_YDB_SMOKE_OIDC=PASS')
          PY
          X="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -X POST 'https://auth.yandex.cloud/oauth/token' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' --data-urlencode "audience=${HISTORICAL_PREPARER_SERVICE_ACCOUNT_ID}" --data-urlencode "subject_token=${J}" --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          T="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$X")"
          test -n "$T"; echo "::add-mask::$T"; printf '%s' "$T" > "$RUNNER_TEMP/yandex-iam-token"; chmod 600 "$RUNNER_TEMP/yandex-iam-token"
          echo 'M24_YDB_SMOKE_TOKEN_EXCHANGE=PASS'

      - name: Checkout exact corrected M24 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: alexpmtk-afk/birzha-mcp-forecast
          ref: ${{ env.APP_SHA }}
          path: app
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = "$APP_SHA"
          echo "M24_YDB_SMOKE_SOURCE_SHA=PASS $APP_SHA"

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install exact package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e ./app

      - name: Allow schema operations to settle
        shell: bash
        run: sleep 90

      - name: Remove leftovers from first verification run
        shell: bash
        run: |
          set -euo pipefail
          cd app
          python scripts/run_ydb_orchestration_smoke.py \
            --connection-string "$YDB_CONNECTION_STRING" \
            --token-file "$RUNNER_TEMP/yandex-iam-token" \
            --prefix "$PREVIOUS_PREFIX" \
            --phase cleanup
          echo 'M24_PREVIOUS_SMOKE_CLEANUP=PASS'

      - name: Bootstrap temporary orchestration schema and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="m24runtime_${GITHUB_RUN_ID}"
          printf '%s' "$PREFIX" > "$RUNNER_TEMP/m24-prefix"
          cd app
          python scripts/run_ydb_orchestration_smoke.py \
            --connection-string "$YDB_CONNECTION_STRING" \
            --token-file "$RUNNER_TEMP/yandex-iam-token" \
            --prefix "$PREFIX" \
            --phase create

      - name: Restart process and prove runtime uses existing schema without DDL
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$(cat "$RUNNER_TEMP/m24-prefix")"
          cd app
          python scripts/run_ydb_orchestration_smoke.py \
            --connection-string "$YDB_CONNECTION_STRING" \
            --token-file "$RUNNER_TEMP/yandex-iam-token" \
            --prefix "$PREFIX" \
            --phase resume

      - name: Allow schema operations to settle before cleanup
        if: always()
        shell: bash
        run: sleep 90

      - name: Cleanup temporary YDB schema
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/m24-prefix" && -f "$RUNNER_TEMP/yandex-iam-token" ]]; then
            PREFIX="$(cat "$RUNNER_TEMP/m24-prefix")"
            cd app
            python scripts/run_ydb_orchestration_smoke.py \
              --connection-string "$YDB_CONNECTION_STRING" \
              --token-file "$RUNNER_TEMP/yandex-iam-token" \
              --prefix "$PREFIX" \
              --phase cleanup
          fi

      - name: Cleanup ephemeral credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yandex-iam-token" "$RUNNER_TEMP/m24-prefix"
