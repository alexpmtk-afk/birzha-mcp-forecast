name: G2 real IMOEX archive quality and Forecast V1 replay
on:
  push:
    branches: [chatgpt/g2-imoex-final-quality-replay-20261013]
    paths:
      - .github/workflows/g2-imoex-real-archive-price-replay.yml
permissions:
  contents: read
  actions: read
jobs:
  verify-price-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Offline read-only archive guard tests
        run: python -m pytest -q tests/test_g2_imoex_saved_archive_replay.py
      - name: Obtain previously created actual IMOEX archive without MOEX re-fetch
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          mkdir -p research/IMOEX
          gh run download 38445782909 --repo "$GITHUB_REPOSITORY" --name imoex-2025-2026-10-12-consolidated-h1-m15 --dir research/IMOEX
      - name: Verify actual full-market archive original bytes and quality
        run: |
          python -m scripts.g2_imoex_saved_archive_replay \
            --archive research/IMOEX/birzha_intraday_research_2025_2026.duckdb \
            --expected-sha256 caa235288d442cf88fd9f8ae38a5c51071042badb6b9295386495468aaa2d4c6 \
            --mode audit --output research/IMOEX/IMOEX_ARCHIVE_FINAL_QUALITY_AUDIT.json
      - name: REAL reconstructed Forecast V1 on 2025-09-15
        run: |
          python -m scripts.g2_imoex_saved_archive_replay \
            --archive research/IMOEX/birzha_intraday_research_2025_2026.duckdb \
            --expected-sha256 caa235288d442cf88fd9f8ae38a5c51071042badb6b9295386495468aaa2d4c6 \
            --mode replay --cutoff-day 2025-09-15 \
            --output research/IMOEX/IMOEX_2025-09-15_V1_RECONSTRUCTED_REPLAY.json
      - name: REAL reconstructed Forecast V1 on 2026-04-15
        run: |
          python -m scripts.g2_imoex_saved_archive_replay \
            --archive research/IMOEX/birzha_intraday_research_2025_2026.duckdb \
            --expected-sha256 caa235288d442cf88fd9f8ae38a5c51071042badb6b9295386495468aaa2d4c6 \
            --mode replay --cutoff-day 2026-04-15 \
            --output research/IMOEX/IMOEX_2026-04-15_V1_RECONSTRUCTED_REPLAY.json
      - name: Print actual statuses without claiming real-time forecast issuance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for f in Path('research/IMOEX').glob('IMOEX_*.json'):
              d=json.loads(f.read_text())
              if 'replay' in d:
                  t=d['replay']
                  print(f.name, t['assessment_status'],t['input_counts'],
                        'ForecastV1_executed=',t['research_engine_result'] is not None)
              if d.get('schema')=='IMOEX_G2_STORED_INTRADAY_QUALITY_AUDIT_V1':
                  print('ARCHIVE_QUALITY',d['classification'], d['captured_days'],
                        d['incomplete_m15_source_bucket_reports'],d['shortened_native_h1_reports'])
          PY
      - name: Retain real reconstructed Forecast V1 offline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imoex-real-v1-replay-and-data-quality-20261013
          path: |
            research/IMOEX/IMOEX_ARCHIVE_FINAL_QUALITY_AUDIT.json
            research/IMOEX/IMOEX_*_V1_RECONSTRUCTED_REPLAY.json
          if-no-files-found: ignore
          retention-days: 30
