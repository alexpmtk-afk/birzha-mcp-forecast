name: G2 Real MOEX One-Market STAGING Smoke (No HOME)

on:
  push:
    branches:
      - chatgpt/g2-real-moex-one-market-staging-smoke-20261011

permissions:
  contents: read

concurrency:
  group: g2-one-market-nonprod-live-smoke
  cancel-in-progress: false

jobs:
  bounded-one-market-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout exact isolated branch with no persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install reviewed project and actual DuckDB
        run: python -m pip install -e '.[dev]'
      - name: Receive one real governed MOEX market and issue only to disposable DuckDB
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d "$RUNNER_TEMP/g2-ephemeral-staging-XXXXXXXX")"
          original="$RUNNER_TEMP/g2-real-original-$GITHUB_RUN_ID"
          echo "G2_SCOPE=GITHUB_EPHEMERAL_RUNNER_ONLY"
          echo "G2_ORIGINAL_SOURCE=LIVE_MOEX_PUBLIC_ISS_GOVERNED"
          echo "G2_MARKET=SBER"
          echo "G2_NO_HOME_NO_PRODUCTION_NO_TRADING=1"
          python -m scripts.g2_capture_and_issue_atomic_staging \
            --market SBER --capture-dir "$original" --staging-root "$stage"
          echo "G2_ONE_MARKET_ATOMIC_STAGING_SMOKE=PASS"
      - name: Read release state without granting deployment
        if: always()
        run: |
          python -m scripts.g2_release_gate --manifest docs/G2_RELEASE_GATE_20261010.json --summary
