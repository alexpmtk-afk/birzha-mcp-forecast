name: G2 existing forecast historical replay
on:
  push:
    branches: [codex/g2-forecast-historical-replay-20261013, chatgpt/g2-historical-replay-time-interval-integrity-20261013, chatgpt/g2-intraday-2025-26-hard-scope-20261013, chatgpt/g2-intraday-bulk-preflight-20261013]
  pull_request:
    branches: [chatgpt/g2-q124-128-historical-evidence-review-20261013]
    paths:
      - scripts/g2_forecast_historical_replay.py
      - tests/test_g2_forecast_historical_replay.py
      - docs/G2_FORECAST_HISTORICAL_REPLAY_20261013.md
      - .github/workflows/g2-forecast-historical-replay.yml
permissions:
  contents: read
jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Verify replay and existing price engine
        run: python -m pytest -q tests/test_g2_forecast_historical_replay.py tests/test_forecast_engine.py tests/test_snapshot_t0.py
      - name: Run all project tests
        run: python -m pytest -q
