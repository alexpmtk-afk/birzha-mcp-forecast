name: GOLD remaining historical monthly GD contract archives

on:
  push:
    branches:
      - chatgpt/gold-remaining-months-2025-2026-20261014
    paths:
      - .github/workflows/gold-remaining-monthly-2025-2026.yml

permissions:
  contents: read

jobs:
  gold-month:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        month:
          - "2025-01"
          - "2025-02"
          - "2025-03"
          - "2025-04"
          - "2025-05"
          - "2025-07"
          - "2025-08"
          - "2025-09"
          - "2025-10"
          - "2025-11"
          - "2025-12"
          - "2026-01"
          - "2026-02"
          - "2026-03"
          - "2026-04"
          - "2026-05"
          - "2026-06"
          - "2026-07"
          - "2026-08"
          - "2026-09"
          - "2026-10"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install research application
        run: python -m pip install -e .
      - name: Capture MOEX H1/M1 and aggregate strict M15 for exact GD contracts
        id: source
        continue-on-error: true
        shell: bash
        env:
          GOLD_MONTH: ${{ matrix.month }}
        run: |
          mkdir -p "research/GOLD/$GOLD_MONTH"
          set -o pipefail
          python -m scripts.gold_monthly_research_capture \
            --month "$GOLD_MONTH" \
            --archive "research/GOLD/$GOLD_MONTH/birzha_intraday_research_2025_2026.duckdb" \
            --output "research/GOLD/$GOLD_MONTH/evidence" \
            2>&1 | tee "research/GOLD/$GOLD_MONTH/collector.log"
      - name: Always preserve source DuckDB, checkpoints, CSV, manifests and errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GOLD-${{ matrix.month }}-research
          path: research/GOLD/${{ matrix.month }}/
          if-no-files-found: error
          retention-days: 30
      - name: Report quality without promoting incomplete source to full PASS
        shell: bash
        env:
          GOLD_MONTH: ${{ matrix.month }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          month=os.environ["GOLD_MONTH"]
          path=Path(f"research/GOLD/{month}/evidence/manifest.json")
          if not path.exists():
              raise SystemExit(f"NO_MANIFEST {month}")
          value=json.loads(path.read_text(encoding="utf-8"))
          print("MONTH",month,"SOURCE_STATUS",value.get("status"))
          print("ARCHIVE_SHA256",value.get("archive_sha256"))
          print("COUNTS",value.get("counts"))
          print("CONTRACTS",value.get("contracts"))
          print("CHECKPOINTS",value.get("checkpoint_count"))
          if value.get("status") != "SOURCE_RECEIPT_NOT_PIT_VERIFIED":
              raise SystemExit(f"PARTIAL_SOURCE_OR_VALIDATION {month}")
          PY
