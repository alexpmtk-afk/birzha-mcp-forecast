name: G2 Prospective Staging Integration

on:
  push:
    branches:
      - chatgpt/g2-canonical-staging-bridge-20261010
  pull_request:
    branches:
      - chatgpt/g2-prospective-capture-pilot-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-staging-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install pinned DuckDB and pytest
        run: python -m pip install duckdb==1.5.5 pytest==8.4.1
      - name: Install entire project for full offline regression
        run: python -m pip install -e '.[dev]'
      - name: Run full project test suite
        run: python -m pytest -q
      - name: Run forecast baseline, receipt and actual DuckDB journal integration tests
        run: |
          python -m pytest -q tests/test_g2_first_forecast_development.py tests/test_prospective_capture.py tests/test_prospective_staging_bridge.py tests/test_g2_moex_raw_capture_probe.py
      - name: Read-only actual MOEX original response probe (non-blocking external provider)
        id: moex_raw
        continue-on-error: true
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          python -m scripts.g2_moex_raw_capture_probe --output-dir "$RUNNER_TEMP/g2-real-moex-capture"
      - name: Preserve real MOEX raw response evidence if provider probe passed
        if: steps.moex_raw.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g2-moex-original-response-readonly
          path: ${{ runner.temp }}/g2-real-moex-capture/
          if-no-files-found: error
          retention-days: 7
      - name: Compile own modules and tests
        run: |
          python -m compileall -q src/birzha/application/prospective_capture.py src/birzha/application/prospective_staging_bridge.py tests/test_prospective_capture.py tests/test_prospective_staging_bridge.py
      - name: Run isolated synthetic receipt and outcomes demo
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          python -m scripts.g2_prospective_pilot_demo --output-dir "$RUNNER_TEMP/g2-synthetic-staging"
          python -c "import json, pathlib, os; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'g2-synthetic-staging'/'synthetic_pilot_report.json'; v=json.loads(p.read_text()); assert v['audit']['captures']==1 and v['audit']['outcomes']==3 and v['NOT_REAL_FORECAST'] is True"
