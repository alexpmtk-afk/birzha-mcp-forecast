name: YDB Readiness OIDC

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ydb-readiness-oidc.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ydb-readiness-oidc
  cancel-in-progress: false

env:
  APP_SHA: 06a4121baa183a64766b63c9893a476136753648
  OIDC_AUDIENCE: https://github.com/alexpmtk-afk
  PUBLISHER_SERVICE_ACCOUNT_ID: ajessiopotr4eq1g2c2v
  EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/birzha-mcp-forecast@1350648480:ref:refs/heads/main
  YDB_CONNECTION_STRING: grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1gi4pr9msenirafh2c7/etnes7omhgut11oulsd5

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mint Yandex IAM token through GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Refusing OIDC audit outside main" >&2; exit 1; }
          ENCODED_AUDIENCE="$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe=""))')"
          SEP='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && SEP='&'
          RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${SEP}audience=${ENCODED_AUDIENCE}")"
          OIDC_JWT="$(python -c 'import json,sys; print(json.load(sys.stdin).get("value", ""))' <<< "$RESPONSE")"
          test -n "$OIDC_JWT"
          echo "::add-mask::$OIDC_JWT"
          python - "$OIDC_JWT" <<'PY'
          import base64, json, os, sys
          payload=sys.argv[1].split('.')[1]; payload += '=' * (-len(payload) % 4)
          claims=json.loads(base64.urlsafe_b64decode(payload))
          assert claims.get('sub') == os.environ['EXPECTED_OIDC_SUBJECT'], claims.get('sub')
          assert claims.get('aud') == os.environ['OIDC_AUDIENCE'], claims.get('aud')
          print('GITHUB_OIDC_CLAIMS=PASS')
          PY
          TOKEN_RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 \
            -X POST 'https://auth.yandex.cloud/oauth/token' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${PUBLISHER_SERVICE_ACCOUNT_ID}" \
            --data-urlencode "subject_token=${OIDC_JWT}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          IAM_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin).get("access_token", ""))' <<< "$TOKEN_RESPONSE")"
          test -n "$IAM_TOKEN"
          echo "::add-mask::$IAM_TOKEN"
          printf '%s' "$IAM_TOKEN" > "$RUNNER_TEMP/yandex-iam-token"
          chmod 600 "$RUNNER_TEMP/yandex-iam-token"
          printf '%s' "$YDB_CONNECTION_STRING" > "$RUNNER_TEMP/ydb-connection-string"
          echo 'YANDEX_OIDC_TOKEN_EXCHANGE=PASS'

      - name: Checkout exact M23 application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: alexpmtk-afk/birzha-mcp-forecast
          ref: ${{ env.APP_SHA }}
          path: app
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout audit implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: alexpmtk-afk/mcp-yandex-cloud-infra
          ref: main
          path: infra
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact app source and install
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = "$APP_SHA"
          python -m pip install --disable-pip-version-check -e ./app
          echo "APP_SOURCE_SHA=PASS $APP_SHA"

      - name: Run read-only D1 YDB readiness audit
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/app/src"
          python infra/scripts/birzha_m23_ydb_readonly_audit.py \
            --connection-string-file "$RUNNER_TEMP/ydb-connection-string" \
            --token-file "$RUNNER_TEMP/yandex-iam-token" \
            --app-sha "$APP_SHA" \
            --workflow-sha "$GITHUB_SHA" \
            --artifact "$RUNNER_TEMP/birzha-m23-ydb-oidc-audit.json"
          echo 'YDB_OIDC_READONLY_AUDIT=PASS'

      - name: Upload durable audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: birzha-m23-ydb-oidc-readonly-audit
          path: ${{ runner.temp }}/birzha-m23-ydb-oidc-audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup ephemeral token
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yandex-iam-token" "$RUNNER_TEMP/ydb-connection-string"
