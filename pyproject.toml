[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "birzha-mcp-forecast"
version = "0.1.0"
description = "BIRZHA MCP Forecast System backend"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "httpx==0.28.1",
  "duckdb==1.5.5",
  "mcp==2.1.1",
  "uvicorn==0.35.0",
  "ydb[yc]==3.31.4",
  "tzdata==2026.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/birzha"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
